function clearAuthError(){ document.getElementById('auth-error').style.display = 'none'; }

function setAuthBusy(busy){
  const l = document.getElementById('auth-login-btn');
  const r = document.getElementById('auth-reg-btn');
  if(l){ l.disabled = busy; l.textContent = busy ? 'Signing in…' : 'Sign In →'; }
  if(r){ r.disabled = busy; r.textContent = busy ? 'Creating account…' : 'Create Account →'; }
}

async function doAuthLogin(){
  const u = document.getElementById('auth-login-user').value.trim();
  const p = document.getElementById('auth-login-pass').value;
  clearAuthError();
  if(!u || !p) return showAuthError('Please enter your username and password.');
  setAuthBusy(true);
  try{
    const doc = await fbDb.collection('pedsboard_users').doc(userDocId(u)).get();
    if(!doc.exists){ setAuthBusy(false); return showAuthError('Username not found. Please check or register.'); }
    const data = doc.data();
    if(data.pwHash !== hashPw(p)){ setAuthBusy(false); return showAuthError('Incorrect password. Please try again.'); }
    signIn({ username: data.username, displayName: data.displayName });
  }catch(e){
    setAuthBusy(false);
    showAuthError('Network error — check your connection and try again.');
  }
}

async function doAuthRegister(){
  const name = document.getElementById('auth-reg-name').value.trim();
  const u = document.getElementById('auth-reg-user').value.trim();
  const p = document.getElementById('auth-reg-pass').value;
  const p2 = document.getElementById('auth-reg-pass2').value;
  clearAuthError();
  if(!name || !u || !p || !p2) return showAuthError('Please fill in all fields.');
  if(p !== p2) return showAuthError('Passwords do not match.');
  if(p.length < 4) return showAuthError('Password must be at least 4 characters.');
  setAuthBusy(true);
  try{
    const ref = fbDb.collection('pedsboard_users').doc(userDocId(u));
    const existing = await ref.get();
    if(existing.exists){ setAuthBusy(false); return showAuthError('Username already taken. Please choose another.'); }
    const userData = { username: u, displayName: name, pwHash: hashPw(p) };
    await ref.set(userData);
    signIn({ username: u, displayName: name });
  }catch(e){
    setAuthBusy(false);
    showAuthError('Network error — check your connection and try again.');
  }
}

async function signIn(userData){
  CURRENT_USER = { username: userData.username, displayName: userData.displayName };
  localStorage.setItem('pedsboard_session', userData.username);
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
  setAuthBusy(false);
  await loadProgress();
  render();
}

function doSignOut(){
  clearInterval(STATE.timerInterval);
  CURRENT_USER = null;
  localStorage.removeItem('pedsboard_session');
  STATE.screen = 'dashboard';
  STATE.qStatus = {};
  STATE.block = null;
  STATE.reviewSet = null;
  STATE.timerStart = null;
  STATE.timerInterval = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-login-user').value = '';
  document.getElementById('auth-login-pass').value = '';
  showAuthTab('login');
}

/* ============================================================
   PERSISTENCE — synced to Firestore per username. Same
   STATE.qStatus shape as before; storage backend is Firestore
   instead of localStorage, so progress follows the account to
   any device/browser.
   ============================================================ */
let saveQueued = false;
let saveAgainAfter = false;

async function loadProgress(){
  if(!CURRENT_USER){ STATE.qStatus = {}; return; }
  try{
    const doc = await fbDb.collection('pedsboard_progress').doc(userDocId(CURRENT_USER.username)).get();
    STATE.qStatus = doc.exists && doc.data().qStatus ? doc.data().qStatus : {};
  }catch(e){
    console.warn('Load failed, starting empty', e);
    STATE.qStatus = {};
  }
}

function saveProgress(){
  if(!CURRENT_USER) return;
  if(saveQueued){ saveAgainAfter = true; return; }
  saveQueued = true;
  setTimeout(async () => {
    saveQueued = false;
    try{
      await fbDb.collection('pedsboard_progress').doc(userDocId(CURRENT_USER.username))
        .set({ qStatus: STATE.qStatus, updatedAt: Date.now() }, { merge: true });
    }catch(e){
      console.warn('Save failed', e);
    }
    if(saveAgainAfter){ saveAgainAfter = false; saveProgress(); }
  }, 500);
}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(str){
  if(str===undefined||str===null) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function nl2br(str){ return esc(str).replace(/\n/g,'<br>'); }

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(STATE.toastTimeout);
  STATE.toastTimeout = setTimeout(()=>t.classList.remove('show'), 2200);
}

function overallStats(){
  let attempted=0, correct=0, flagged=0;
  QUESTIONS.forEach(q=>{
    const s = getStatus(q.id);
    if(s.status==='correct'||s.status==='incorrect') attempted++;
    if(s.status==='correct') correct++;
    if(s.flagged) flagged++;
  });
  return { total: QUESTIONS.length, attempted, correct, incorrect: attempted-correct, flagged,
    accuracy: attempted? Math.round(correct/attempted*100):0 };
}

function systemStats(sysId){
  const qs = QUESTIONS.filter(q=>q.system===sysId);
  let attempted=0, correct=0;
  qs.forEach(q=>{
    const s = getStatus(q.id);
    if(s.status==='correct'||s.status==='incorrect') attempted++;
    if(s.status==='correct') correct++;
  });
  return { total: qs.length, attempted, correct, accuracy: attempted? Math.round(correct/attempted*100):0 };
}

function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function go(screen, extra){
  STATE.screen = screen;
  if(extra) Object.assign(STATE, extra);
  window.scrollTo(0,0);
  render();
}

/* ============================================================
   RENDER: ROOT
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  let html = '';
  html += renderTopbar();
  html += '<div class="main">';
  if(STATE.screen==='dashboard') html += renderDashboard();
  else if(STATE.screen==='create') html += renderCreate();
  else if(STATE.screen==='test') html += renderTest();
  else if(STATE.screen==='summary') html += renderSummary();
  else if(STATE.screen==='review') html += renderReviewScreen();
  else if(STATE.screen==='notebook') html += renderNotebook();
  html += '</div>';
  html += '<div id="toast" class="toast"></div>';
  app.innerHTML = html;
  attachHandlers();
  if(STATE.screen==='test') startTimerIfNeeded();
}

  return QUESTIONS.filter(q=>{
    if(!systemIds.has(q.system)) return false;
    const s = getStatus(q.id);
    if(subset==='unused') return s.status==='unused';
    if(subset==='incorrect') return s.status==='incorrect';
    if(subset==='flagged') return s.flagged;
    return true;
  }).length;
}

function currentBlockQuestion(){
  if(!STATE.block) return null;
  const id = STATE.block.ids[STATE.block.index];
  return QMAP[id];
}

function renderNavStrip(ids, currentIdx, onActionName){
  let dots = ids.map((id,i)=>{
    const s = getStatus(id);
    let cls = 'nav-dot';
    if(i===currentIdx) cls += ' current';
    else if(s.status==='correct') cls += ' correct';
    else if(s.status==='incorrect') cls += ' incorrect';
    const flag = s.flagged ? '<span class="flag-mark"></span>' : '';
    return `<button class="${cls}" data-action="${onActionName}" data-idx="${i}">${i+1}${flag}</button>`;
  }).join('');
  return `<div class="nav-strip-wrap"><div class="nav-strip">${dots}</div></div>`;
}

function renderTest(){
  const block = STATE.block;
  if(!block) return `<div class="container"><div class="empty-state"><h3>No active test</h3><p>Start a new test from the dashboard.</p></div></div>`;
  const q = currentBlockQuestion();
  const st = getStatus(q.id);
  const answeredThisQ = block.answers[q.id];
  const revealed = block.mode==='tutor' && answeredThisQ && answeredThisQ.revealed;
  const sys = SYSMAP[q.system];
  const pct = Math.round(((block.index)/(block.ids.length))*100);

  let optsHtml = q.options.map(o=>{
    let cls = 'q-option';
    const sel = answeredThisQ && answeredThisQ.selected === o.letter;
    if(sel && !revealed) cls += ' selected';
    if(revealed){
      if(o.letter===q.correct) cls += ' reveal-correct';
      else if(sel) cls += ' reveal-incorrect';
      else cls += ' reveal-dim';
    }
    return `
    <div class="${cls}" data-action="select-option" data-letter="${o.letter}" role="button" tabindex="0">
      <div class="opt-letter">${o.letter}</div>
      <div class="opt-text">${esc(o.text)}</div>
    </div>`;
  }).join('');

  let explainHtml = '';
  if(revealed){
    const isCorrect = answeredThisQ.selected === q.correct;
    explainHtml = `
    <div class="explain-panel">
      <div class="explain-verdict ${isCorrect?'correct':'incorrect'}">${isCorrect? '✓ Correct' : '✕ Incorrect — correct answer is '+q.correct}</div>
      <div class="explain-block"><b class="lbl">Why</b>${esc(q.why)}</div>
      ${q.wrong? `<div class="explain-block wrong"><b class="lbl">Why not the others</b>${esc(q.wrong)}</div>`:''}
      ${q.note? `<div class="explain-note">${esc(q.note)}</div>`:''}
    </div>`;
  }

  const isLast = block.index === block.ids.length-1;
  const canSubmit = answeredThisQ && !revealed;
  const showNext = (block.mode==='exam') || revealed;

  let footerBtns = '';
  if(block.mode==='tutor'){
    if(!revealed){
      footerBtns = `<button class="btn btn-primary" data-action="submit-answer" ${!answeredThisQ?'disabled':''}>Submit Answer</button>`;
    }else{
      footerBtns = isLast
        ? `<button class="btn btn-primary" data-action="finish-block">Finish Block</button>`
        : `<button class="btn btn-primary" data-action="next-question">Next Question →</button>`;
    }
  }else{
    footerBtns = isLast
      ? `<button class="btn btn-primary" data-action="finish-block">Submit Block</button>`
      : `<button class="btn btn-primary" data-action="next-question">Next →</button>`;
  }

  return `
  <div class="test-topbar">
    <div class="test-topbar-inner">
      <span class="qcount-lbl">Question ${block.index+1} of ${block.ids.length}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="timer-lbl" id="timer-lbl">${fmtTime(0)}</span>
    </div>

      <span class="tag tag-system">${esc(sys.name)}</span>
      <span class="tag tag-source">${q.source==='2021'?'2021 Exam':'Set 1'}</span>
      <button class="flag-btn ${st.flagged?'active':''}" data-action="toggle-flag">
        ${st.flagged? '★ Flagged' : '☆ Flag for review'}
      </button>
    </div>
    <div class="q-stem">${esc(q.stem)}</div>
    <div class="q-options">${optsHtml}</div>
    ${explainHtml}
  </div>
  <div class="test-footer">
    <div class="test-footer-inner">
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" data-action="prev-question" ${block.index===0?'disabled':''}>← Previous</button>

    el.textContent = fmtTime(sec);

}

/* ============================================================
   SUMMARY
   ============================================================ */
function renderSummary(){
  const block = STATE.block;
  if(!block) return `<div class="container"><div class="empty-state"><h3>No block to summarize</h3></div></div>`;
  const ids = block.ids;
  let correct=0;
  const bySystem = {};
  ids.forEach(id=>{
    const q = QMAP[id];
    const ans = block.answers[id];
    const isCorrect = ans && ans.selected === q.correct;
    if(isCorrect) correct++;
    if(!bySystem[q.system]) bySystem[q.system] = {total:0, correct:0};
    bySystem[q.system].total++;
    if(isCorrect) bySystem[q.system].correct++;
  });
  const total = ids.length;
  const pct = total? Math.round(correct/total*100) : 0;
  const passClass = pct>=70?'pass':pct>=50?'':'fail';

  let sysRows = Object.keys(bySystem).map(sysId=>{
    const s = bySystem[sysId];
    const p = Math.round(s.correct/s.total*100);
    return `<div class="sys-row" style="grid-template-columns:1.7fr 1fr 110px 90px;">
      <div class="sys-name">${esc(SYSMAP[sysId].name)}</div>
      <div class="num-col">${s.correct}/${s.total}</div>
      <div><div class="sys-bar-track"><div class="sys-bar-fill" style="width:${p}%"></div></div></div>
      <div class="sys-acc">${p}%</div>
    </div>`;
  }).join('');

  let mistakeRows = ids.filter(id=>{
    const ans = block.answers[id];
    return !ans || ans.selected !== QMAP[id].correct;
  }).map(id=>{
    const q = QMAP[id];
    const st = getStatus(id);
    return `<div class="mistake-row" data-action="review-single" data-id="${id}">
      <span class="mi-status incorrect"></span>
      <span class="mi-text">${esc(q.stem.split('\n')[0].slice(0,90))}${q.stem.length>90?'…':''}</span>
      <span class="mi-tag">${esc(SYSMAP[q.system].name)}</span>
      ${st.flagged? '<span class="flag-mini">★</span>':''}
    </div>`;
  }).join('') || `<div style="color:var(--slate);font-size:13.5px;padding:8px 4px;">No mistakes — nice work.</div>`;

  return `
  <div class="container">
    <div class="summary-hero">
      <div class="summary-score ${passClass}">${pct}%</div>
      <div class="summary-sub">${correct} of ${total} correct · ${block.mode==='tutor'?'Tutor Mode':'Exam Mode'}</div>
      <div class="summary-breakdown">
        <div class="item"><div class="n" style="color:var(--green)">${correct}</div><div class="l">Correct</div></div>
        <div class="item"><div class="n" style="color:var(--red)">${total-correct}</div><div class="l">Incorrect</div></div>
        <div class="item"><div class="n">${fmtTime(Math.floor((Date.now()-STATE.timerStart)/1000))}</div><div class="l">Time</div></div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" data-action="review-block">Review All Answers</button>
      <button class="btn btn-outline" data-action="retest-mistakes">Retest Mistakes From This Block</button>
      <button class="btn btn-outline" data-action="go-dashboard">Back to Dashboard</button>
    </div>

    <div class="section-title">Performance by System (this block)</div>
    <div class="sys-grid" style="margin-bottom:32px;">${sysRows}</div>

    <div class="section-title">Missed Questions</div>
    <div class="mistake-list">${mistakeRows}</div>
  </div>`;
}

/* ============================================================
   REVIEW SCREEN (read-only walk-through, used post-block AND for notebooks)
   ============================================================ */
function renderReviewScreen(){
  const rs = STATE.reviewSet;
  if(!rs || !rs.ids.length) return `<div class="container"><div class="empty-state"><div class="icon">📭</div><h3>Nothing to review</h3><p>This list is empty.</p></div></div>`;
  const id = rs.ids[rs.index];
  const q = QMAP[id];
  const st = getStatus(id);
  const sys = SYSMAP[q.system];
  const pct = Math.round((rs.index/(rs.ids.length-1||1))*100);

  let optsHtml = q.options.map(o=>{
    let cls = 'q-option';
    if(o.letter===q.correct) cls += ' reveal-correct';
    else if(st.lastSelected===o.letter) cls += ' reveal-incorrect';
    else cls += ' reveal-dim';
    return `<div class="${cls}">
      <div class="opt-letter">${o.letter}</div>
      <div class="opt-text">${esc(o.text)}</div>
    </div>`;
  }).join('');

  const isCorrect = st.lastSelected === q.correct;
  const answeredLabel = st.lastSelected ? (isCorrect? '✓ You answered correctly' : '✕ You answered '+st.lastSelected+' — correct is '+q.correct) : 'Not yet attempted';

  return `
  <div class="test-topbar">
    <div class="test-topbar-inner">
      <span class="qcount-lbl">${esc(rs.title)} — ${rs.index+1} of ${rs.ids.length}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <button class="topbar-btn" style="color:var(--navy);background:none;border:1px solid var(--line);" data-action="exit-review">Exit</button>
    </div>
  </div>
  ${renderNavStrip(rs.ids, rs.index, 'jump-review')}
  <div class="test-body">
    <div class="q-meta-row">
      <span class="tag tag-system">${esc(sys.name)}</span>
      <span class="tag tag-source">${q.source==='2021'?'2021 Exam':'Set 1'}</span>
      <button class="flag-btn ${st.flagged?'active':''}" data-action="toggle-flag-review">
        ${st.flagged? '★ Flagged' : '☆ Flag for review'}
      </button>
    </div>
    <div class="q-stem">${esc(q.stem)}</div>
    <div class="q-options">${optsHtml}</div>
    <div class="explain-panel">
      <div class="explain-verdict ${isCorrect?'correct':'incorrect'}">${answeredLabel}</div>
      <div class="explain-block"><b class="lbl">Why</b>${esc(q.why)}</div>
      ${q.wrong? `<div class="explain-block wrong"><b class="lbl">Why not the others</b>${esc(q.wrong)}</div>`:''}
      ${q.note? `<div class="explain-note">${esc(q.note)}</div>`:''}
    </div>
  </div>
  <div class="test-footer">
    <div class="test-footer-inner">
      <button class="btn btn-outline" data-action="review-prev" ${rs.index===0?'disabled':''}>← Previous</button>
      <button class="btn btn-outline" data-action="exit-review">Back to List</button>
      <button class="btn btn-primary" data-action="review-next" ${rs.index===rs.ids.length-1?'disabled':''}>Next →</button>
    </div>
  </div>`;
}

/* ============================================================
   NOTEBOOK (Mistakes / Flagged listing screen)
   ============================================================ */
function renderNotebook(){
  const filter = STATE.notebookFilter || 'mistakes';
  const list = QUESTIONS.filter(q=>{
    const s = getStatus(q.id);
    if(filter==='mistakes') return s.status==='incorrect';
    if(filter==='flagged') return s.flagged;
    return false;
  });

  const tabs = `
  <div class="filter-tabs">
    <div class="filter-tab ${filter==='mistakes'?'active':''}" data-action="notebook-tab" data-tab="mistakes">Mistakes</div>
    <div class="filter-tab ${filter==='flagged'?'active':''}" data-action="notebook-tab" data-tab="flagged">Flagged</div>
  </div>`;

  if(!list.length){
    const msg = filter==='mistakes' ? "You haven't missed any questions yet — or you've cleared them all." : "You haven't flagged any questions yet.";
    return `<div class="container">${tabs}<div class="empty-state"><div class="icon">${filter==='mistakes'?'✅':'☆'}</div><h3>Nothing here</h3><p>${msg}</p></div></div>`;
  }

  let rows = list.map(q=>{
    const s = getStatus(q.id);
    return `<div class="mistake-row" data-action="review-single" data-id="${q.id}">
      <span class="mi-status ${s.status==='incorrect'?'incorrect':'correct'}"></span>
      <span class="mi-text">${esc(q.stem.split('\n')[0].slice(0,100))}${q.stem.length>100?'…':''}</span>
      <span class="mi-tag">${esc(SYSMAP[q.system].name)}</span>
      ${s.flagged? '<span class="flag-mini">★</span>':''}
    </div>`;
  }).join('');

  return `
  <div class="container">
    <div class="section-title">${filter==='mistakes'?'Mistakes Notebook':'Flagged Questions'} <span class="count-pill">${list.length}</span></div>
    ${tabs}
    <div class="action-row">
      <button class="btn btn-primary" data-action="retest-notebook">Retest These (${list.length})</button>
      <button class="btn btn-outline" data-action="review-notebook">Review All</button>
    </div>
    <div class="mistake-list">${rows}</div>
  </div>`;
}

/* ============================================================
   EVENT HANDLING
   ============================================================ */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildBlockFromSelection(){
  const sel = STATE.createSel;
  let pool = QUESTIONS.filter(q=>{
    if(!sel.systems.has(q.system)) return false;
    const s = getStatus(q.id);
    if(sel.subset==='unused') return s.status==='unused';
    if(sel.subset==='incorrect') return s.status==='incorrect';
    if(sel.subset==='flagged') return s.flagged;
    return true;
  }).map(q=>q.id);

  if(sel.shuffle) pool = shuffleArr(pool);
  if(!sel.useAll) pool = pool.slice(0, sel.count);

  return pool;
}

function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
    if(el.tagName==='DIV' || el.tagName==='BUTTON'){
      el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onAction({currentTarget:el}); } });
    }
  });
  const countInput = document.getElementById('count-input');
  if(countInput) countInput.addEventListener('input', e=>{
    STATE.createSel.count = Math.max(1, parseInt(e.target.value||'1',10));
  });
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.getAttribute('data-action');

  switch(action){
    case 'go-dashboard': go('dashboard'); break;
    case 'go-create': go('create'); break;

    case 'toggle-sys': {
      const sys = el.getAttribute('data-sys');
      if(STATE.createSel.systems.has(sys)) STATE.createSel.systems.delete(sys);
      else STATE.createSel.systems.add(sys);
      render();
      break;
    }
    case 'select-all-sys': STATE.createSel.systems = new Set(SYSTEMS.map(s=>s.id)); render(); break;
    case 'select-none-sys': STATE.createSel.systems = new Set(); render(); break;
    case 'set-subset': STATE.createSel.subset = el.value; render(); break;
    case 'set-mode': STATE.createSel.mode = el.value; render(); break;
    case 'toggle-useall': STATE.createSel.useAll = el.checked; render(); break;
    case 'toggle-shuffle': STATE.createSel.shuffle = el.checked; break;
    case 'set-count': break;

    case 'start-test': {
      const ids = buildBlockFromSelection();
      if(!ids.length){ showToast('No questions match this selection.'); return; }
      STATE.block = { ids, mode: STATE.createSel.mode, index:0, answers:{} };
      STATE.timerStart = Date.now();
      go('test');
      break;
    }

    case 'quick-system': {
      const sys = el.getAttribute('data-sys');
      STATE.createSel.systems = new Set([sys]);
      STATE.createSel.subset = 'all';
      STATE.createSel.useAll = true;
      go('create');
      break;
    }

    case 'select-option': {
      const letter = el.getAttribute('data-letter');
      const q = currentBlockQuestion();
      const block = STATE.block;
      const already = block.answers[q.id];
      if(already && already.revealed) return; // locked after reveal in tutor mode
      block.answers[q.id] = { selected: letter, revealed: already? already.revealed : false };
      render();
      break;
    }

    case 'submit-answer': {
      const q = currentBlockQuestion();
      const block = STATE.block;
      const ans = block.answers[q.id];
      if(!ans) return;
      ans.revealed = true;
      const isCorrect = ans.selected === q.correct;
      setStatus(q.id, { status: isCorrect?'correct':'incorrect', lastSelected: ans.selected });
      render();
      break;
    }

    case 'toggle-flag': {
      const q = currentBlockQuestion();
      const st = getStatus(q.id);
      setStatus(q.id, { flagged: !st.flagged });
      render();
      break;
    }
    case 'toggle-flag-review': {
      const rs = STATE.reviewSet;
      const id = rs.ids[rs.index];
      const st = getStatus(id);
      setStatus(id, { flagged: !st.flagged });
      render();
      break;
    }

    case 'next-question': {
      const block = STATE.block;
      if(block.index < block.ids.length-1){ block.index++; render(); }
      break;
    }
    case 'prev-question': {
      const block = STATE.block;
      if(block.index>0){ block.index--; render(); }
      break;
    }
    case 'jump-question': {
      STATE.block.index = parseInt(el.getAttribute('data-idx'),10);
      render();
      break;
    }

    case 'end-block-confirm': showModal(
      'End this block?',
      'Unanswered questions will be marked incomplete. You can review your answers afterward.',
      [
        {label:'Keep Going', cls:'btn-outline', action: closeModal},
        {label:'End Block', cls:'btn-primary', action: ()=>{ closeModal(); finishBlock(); }},
      ]
    ); break;

    case 'finish-block': finishBlock(); break;

    case 'review-block': {
      STATE.reviewSet = { ids: STATE.block.ids, index:0, title:'Block Review' };
      go('review');
      break;
    }
    case 'retest-mistakes': {
      const missed = STATE.block.ids.filter(id=>{
        const ans = STATE.block.answers[id];
        return !ans || ans.selected !== QMAP[id].correct;
      });
      if(!missed.length){ showToast('No mistakes in this block!'); return; }
      STATE.block = { ids: missed, mode:'tutor', index:0, answers:{} };
      STATE.timerStart = Date.now();
      go('test');
      break;
    }

    case 'review-single': {
      const id = parseInt(el.getAttribute('data-id'),10);
      const listSource = STATE.screen==='summary' ? STATE.block.ids : QUESTIONS.filter(q=>{
        const s = getStatus(q.id);
        return STATE.notebookFilter==='flagged' ? s.flagged : s.status==='incorrect';
      }).map(q=>q.id);
      STATE.reviewSet = { ids: listSource, index: listSource.indexOf(id), title: STATE.screen==='summary'?'Block Review':'Notebook Review' };
      go('review');
      break;
    }

    case 'review-prev': if(STATE.reviewSet.index>0){ STATE.reviewSet.index--; render(); } break;
    case 'review-next': if(STATE.reviewSet.index<STATE.reviewSet.ids.length-1){ STATE.reviewSet.index++; render(); } break;
    case 'jump-review': STATE.reviewSet.index = parseInt(el.getAttribute('data-idx'),10); render(); break;
    case 'exit-review': {
      if(STATE.reviewSet && STATE.reviewSet.title==='Block Review' && STATE.block){ go('summary'); }
      else { go('notebook'); }
      break;
    }

    case 'open-notebook': {
      STATE.notebookFilter = el.getAttribute('data-filter');
      go('notebook');
      break;
    }
    case 'notebook-tab': {
      STATE.notebookFilter = el.getAttribute('data-tab');
      render();
      break;
    }
    case 'retest-notebook': {
      const list = QUESTIONS.filter(q=>{
        const s = getStatus(q.id);
        return STATE.notebookFilter==='flagged' ? s.flagged : s.status==='incorrect';
      }).map(q=>q.id);
      if(!list.length) return;
      STATE.block = { ids: shuffleArr(list), mode:'tutor', index:0, answers:{} };
      STATE.timerStart = Date.now();
      go('test');
      break;
    }
    case 'review-notebook': {
      const list = QUESTIONS.filter(q=>{
        const s = getStatus(q.id);
        return STATE.notebookFilter==='flagged' ? s.flagged : s.status==='incorrect';
      }).map(q=>q.id);
      if(!list.length) return;
      STATE.reviewSet = { ids:list, index:0, title: STATE.notebookFilter==='flagged'?'Flagged Questions':'Mistakes Notebook' };
      go('review');
      break;
    }

    case 'reset-progress': showModal(
      'Reset all progress?',
      'This clears every answered question, flag, and accuracy stat. This cannot be undone.',
      [
        {label:'Cancel', cls:'btn-outline', action: closeModal},
        {label:'Reset Everything', cls:'btn-danger-outline', action: ()=>{ STATE.qStatus={}; saveProgress(); closeModal(); go('dashboard'); }},
      ]
    ); break;
  }
}

function finishBlock(){
  const block = STATE.block;
  block.ids.forEach(id=>{
    const q = QMAP[id];
    const ans = block.answers[id];
    if(ans){
      const isCorrect = ans.selected === q.correct;
      setStatus(id, { status: isCorrect?'correct':'incorrect', lastSelected: ans.selected });
    }
  });
  clearInterval(STATE.timerInterval);
  go('summary');
}

/* ============================================================
   MODAL
   ============================================================ */
function showModal(title, body, buttons){
  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay';
  wrap.id = 'modal-root';
  wrap.innerHTML = `
    <div class="modal-box">
      <h3>${esc(title)}</h3>
      <p>${esc(body)}</p>
      <div class="modal-actions" id="modal-actions"></div>
    </div>`;
  document.body.appendChild(wrap);
  const actionsEl = wrap.querySelector('#modal-actions');
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'btn '+b.cls;
    btn.textContent = b.label;
    btn.addEventListener('click', b.action);
    actionsEl.appendChild(btn);
  });
  wrap.addEventListener('click', e=>{ if(e.target===wrap) closeModal(); });
}
function closeModal(){
  const m = document.getElementById('modal-root');
  if(m) m.remove();
}

/* ============================================================
   INIT
   If this browser has a remembered username from a previous
   session, look them up in Firestore and sign back in
   automatically (no password re-entry needed on this device,
   same as before — but the data itself now lives server-side).
   ============================================================ */
showAuthTab('login');
(async function(){
  const saved = localStorage.getItem('pedsboard_session');
  if(saved){
    try{
      const doc = await fbDb.collection('pedsboard_users').doc(userDocId(saved)).get();
      if(doc.exists){
        const data = doc.data();
        await signIn({ username: data.username, displayName: data.displayName });
      }
    }catch(e){ /* stay on the sign-in screen */ }
  }
})();

['auth-login-user','auth-login-pass'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') doAuthLogin(); });
});
['auth-reg-name','auth-reg-user','auth-reg-pass','auth-reg-pass2'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') doAuthRegister(); });
});
