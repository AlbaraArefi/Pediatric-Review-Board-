s":[{"letter":"A","text":"aspirin and penicillin orally"},{"letter":"B","text":"aspirin orally and intravenous immunoglobulin"},{"letter":"C","text":"penicillin and glucocorticoids orally"},{"letter":"D","text":"penicillin orally and intravenous immunoglobulin"}],"correct":"A","why":"This is acute rheumatic fever (ARF) — migratory polyarthritis (right knee, then left... here it's recounted as recurring knee involvement), new regurgitant murmur (carditis), antecedent streptococcal infection (positive ASO titer), and fatigue. Standard therapy is (1) eradication of residual/recurrent group A strep with penicillin, and (2) anti-inflammatory therapy with aspirin (NSAID) for the arthritis/mild carditis, plus cardiology follow-up for the new murmur.","wrong":"B/D) IVIG is not standard therapy for acute rheumatic fever (it's used in other inflammatory conditions like Kawasaki disease, not ARF). C) Glucocorticoids are reserved for more severe carditis (e.g., with heart failure) rather than routine first-line therapy in mild-moderate ARF, where aspirin is preferred initially.","note":""},{"id":27,"system":"cardiology","systemName":"Cardiology","source":"2021","stem":"A 5-day-old full-term male neonate is brought to the emergency department for evaluation of poor feeding. His parents report that in the past day he seems to tire while feeding. He had been eating well over the prior 48 hours. On physical examination, the neonate is cyanotic and tachypneic, but appears comfortable. His heart rate is 160 beats/min, respiratory rate is 60 breaths/min, blood pressure is 70/40 mm Hg, and oxygen saturation is 60% on room air.\nOf the following, the BEST next management step for this neonate is to","options":[{"letter":"A","text":"administer indomethacin"},{"letter":"B","text":"administer oxygen"},{"letter":"C","text":"initiate prostaglandin infusion"},{"letter":"D","text":"obtain a cardiology consultation"}],"correct":"C","why":"A neonate around day 5 of life presenting with acute cyanosis, tachypnea, and profound hypoxemia (SpO2 60%) as the ductus arteriosus closes is classic for duct-dependent cyanotic congenital heart disease. Prostaglandin E1 infusion re-opens/maintains ductal patency, restoring pulmonary or systemic blood flow depending on the lesion, and is a time-critical, potentially life-saving intervention that should be started empirically based on strong clinical suspicion, without waiting for definitive echo confirmation.","wrong":"A) Indomethacin CLOSES the ductus — the opposite of what's needed here, and is used for symptomatic PDA in premature infants, not this scenario. B) Oxygen alone won't correct duct-dependent cyanotic physiology and can even be harmful in some duct-dependent lesions (promoting ductal closure and worsening pulmonary over-circulation in certain lesions). D) A cardiology consult is important but shouldn't delay starting PGE1 — treatment should begin empirically while awaiting formal echo/cardiology input given how time-critical duct closure is.","note":""},{"id":28,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 2-year-old boy presents with a three-day history of flu, high-grade fever, and gradually increasing breathing difficulty. On examination, he is toxic-looking with drooling saliva. His temperature was 39 C, and R/R was 40/min with suprasternal recessions. H/R is 120/min. Soft stridor can be heard. He is very irritable and agitated. He had been nebulized once with racemic adrenaline with some improvement for half an hour. He suddenly got apnea while crying.\nWhat is the most appropriate next step in management?","options":[{"letter":"A","text":"Cricothyroidotomy"},{"letter":"B","text":"Endotracheal tube insertion"},{"letter":"C","text":"Laryngeal mask airway placement"},{"letter":"D","text":"Tracheostomy"}],"correct":"A","why":"This is severe upper airway obstruction (likely bacterial tracheitis/epiglottitis) that has now progressed to complete obstruction/apnea. When standard airway attempts would be difficult/high-risk in a toxic child with impending complete obstruction, a surgical airway (cricothyroidotomy) becomes necessary as an emergency rescue technique.","wrong":"B) Standard ETT insertion may be extremely difficult/dangerous with severe supraglottic/glottic edema and risks converting partial to complete obstruction. C) LMA placement doesn't bypass the level of obstruction in epiglottitis/severe upper airway swelling. D) Tracheostomy takes too long to perform in a true apnea emergency — cricothyroidotomy is faster.","note":""},{"id":29,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"The recurrent aspiration of small quantities of gastric, nasal, or oral contents can lead to several clinical presentations, including recurrent bronchitis or bronchiolitis; recurrent pneumonia; atelectasis; wheezing; cough; apnea; and/or laryngospasm.\nWhat is the MOST common underlying problem associated with recurrent pneumonia in hospitalized children?","options":[{"letter":"A","text":"Oropharyngeal incoordination"},{"letter":"B","text":"Esophageal foreign body"},{"letter":"C","text":"Nasoenteric tube"},{"letter":"D","text":"Poor oral hygiene"}],"correct":"A","why":"In hospitalized/neurologically impaired children, dysfunctional swallowing (oropharyngeal incoordination) — not structural GI lesions — is the most common driver of recurrent aspiration pneumonia.","wrong":"B) Esophageal foreign body is an acute, uncommon cause, not the 'most common' overall. C) Nasoenteric tubes can contribute to aspiration risk but aren't the most common overall cause. D) Poor oral hygiene contributes to the bacterial burden of aspirated material but isn't itself the mechanism causing aspiration.","note":""},{"id":30,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 30-month-old girl presenting with anemia and respiratory distress is diagnosed with idiopathic pulmonary hemosiderosis. She is admitted for further management in addition to supplemental oxygen and transfusion.\nWhich of the following is the most appropriate next step in management?","options":[{"letter":"A","text":"Intravenous ceftriaxone treatment"},{"letter":"B","text":"Intravenous methylprednisolone treatment"},{"letter":"C","text":"Oral high-dose amoxicillin treatment"},{"letter":"D","text":"Oral hydroxychloroquine treatment"}],"correct":"B","why":"Systemic corticosteroids are the mainstay acute treatment for idiopathic pulmonary hemosiderosis, used to suppress the presumed autoimmune-mediated alveolar hemorrhage.","wrong":"A) IV ceftriaxone treats bacterial infection, not this non-infectious hemorrhagic process. C) Oral amoxicillin is similarly an antibiotic with no role here. D) Hydroxychloroquine isn't standard first-line therapy for acute pulmonary hemorrhage in this condition.","note":""},{"id":31,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 10-year-old boy presents for evaluation of a food bolus impaction. The patient has had too similar episodes over the past year. His past medical history is significant for asthma, but he is not taking medications at this time. Large meat boluses were extracted endoscopically in the past, but no overt esophageal abnormalities were noted. The patient is unable to control his secretions and undergoes repeat endoscopy. No overt obstruction is seen, but some white exudates are seen in the esophagus. The food bolus is successfully removed.\nWhat is the MOST likely underlying diagnosis in this patient?","options":[{"letter":"A","text":"Behavior disorder"},{"letter":"B","text":"Eosinophilic esophagitis (EE)"},{"letter":"C","text":"Esophageal Shatzki's ring"},{"letter":"D","text":"Nutcracker esophagus"}],"correct":"B","why":"Recurrent food impaction in a patient with atopic history (asthma), plus white exudates (eosinophilic microabscesses) on endoscopy, is classic for eosinophilic esophagitis — an allergen-driven eosinophilic infiltration of the esophagus.","wrong":"A) A primary behavior disorder wouldn't explain the endoscopic white exudates. C) Schatzki's ring is a discrete anatomic narrowing, and 'no overt obstruction/abnormalities' argues against a structural ring being the cause. D) Nutcracker esophagus is a motility disorder without these endoscopic exudative findings.","note":""},{"id":32,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 10-year-old girl with severe asthma requiring treatment with an inhaled corticosteroid with a long-acting beta agonist and a leukotriene receptor antagonist is coming for evaluation. She has, in addition, chronic nasal congestion and rhinorrhea and a strong family history of allergy. Allergy skin testing showed a positive result for house dust mites. In addition to environmental control, an allergy consultant recommended allergen immunotherapy.\nWhich of the following is the strongest evidence that this therapy?","options":[{"letter":"A","text":"Decreases the need for rescue medication"},{"letter":"B","text":"Decreases the use of inhaled corticosteroid"},{"letter":"C","text":"(option omitted in source)"},{"letter":"D","text":"Improves lung function"}],"correct":"B","why":"Among the answer choices, reduction in maintenance ICS/controller medication requirement is the outcome with the strongest evidence base supporting allergen immunotherapy's disease-modifying effect in allergic asthma.","wrong":"A) Decreased rescue medication use is a softer/less robust outcome measure than medication-sparing of controller therapy. D) 'Improves lung function' has weaker and less consistent evidence than the medication-reduction benefit for immunotherapy specifically.","note":""},{"id":33,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 1-year-old boy presented to the Emergency with a cough, fever, and mild hypoxia. At admission, he had evidence of a right upper lobe consolidation on his chest radiograph. Blood culture has become positive in less than 24 hours for Staphylococcus aureus. Approximately 20 hours into his hospitalization, the nurse calls you because the child has acutely worsened over the previous few minutes, with markedly increased work in breathing, increasing oxygen requirement, and hypotension.\nAs you move swiftly to the child's hospital room, tell the nurse to order the following?","options":[{"letter":"A","text":"A second chest radiograph to evaluate for pneumatocele formation"},{"letter":"B","text":"Chest tube kit for aspiration of a probable tension pneumothorax"},{"letter":"C","text":"A change in antibiotics to include gentamicin"},{"letter":"D","text":"A sedative to treat the child's attack of severe anxiety"}],"correct":"B","why":"Staph aureus pneumonia is notorious for necrotizing complications including pneumatocele formation and pneumothorax. Sudden deterioration (worsening work of breathing, rising O2 requirement, hypotension — signs of obstructive shock) strongly suggests tension pneumothorax, a time-critical emergency requiring immediate needle decompression/chest tube, not imaging first.","wrong":"A) Repeat imaging would delay life-saving decompression in a patient with signs of tension physiology and hemodynamic compromise. C) Changing antibiotics won't address the acute mechanical/hemodynamic emergency. D) Sedation for 'anxiety' is dangerously wrong — this is a physiologic emergency, not an anxiety attack.","note":""},{"id":34,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 6-year-old female patient with a history of recurrent cough and wheezing for the last year, triggered mainly by exposure to pollens and pets. She demonstrated improvement in symptoms after salbutamol administration.\nWhat are the most likely spirometry values for her?","options":[{"letter":"A","text":"Low FEV1, low FVC, low FEV1/FVC"},{"letter":"B","text":"Low FEV1, low FVC, normal FEV1/FVC"},{"letter":"C","text":"Normal FEV1, low FVC, normal FEV1/FVC"},{"letter":"D","text":"Low FEV1, normal FVC, low FEV1/FVC"}],"correct":"D","why":"This is a classic OBSTRUCTIVE pattern (asthma): reduced FEV1 out of proportion to FVC, giving a reduced FEV1/FVC ratio, while FVC itself is preserved (or only mildly reduced) since total lung volume isn't primarily restricted.","wrong":"A/B) Low FVC with low FEV1 describes a restrictive-type or mixed pattern, not typical uncomplicated asthma. C) Low FVC with normal FEV1/normal ratio would suggest a pure restrictive process, not obstructive airway disease.","note":""},{"id":35,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"The mother of a 10-year-old girl with cystic fibrosis (CF) calls for advice about a positive airway culture. She has been very healthy and has required no aggressive intervention for pulmonary infection. Her routine airway cultures, obtained in the CF center by deep throat/gag swab, have consistently grown normal flora or methicillin-sensitive Staphylococcus aureus. Her most recent culture was positive for Pseudomonas aeruginosa. The girl has no symptoms of illness. She is eating well and has had no weight loss. She is attending school regularly.\nWhat is the MOST appropriate management strategy in response to this girl's laboratory findings?","options":[{"letter":"A","text":"Hospitalization for intravenous antibiotic administration"},{"letter":"B","text":"Inhaled antibiotic treatment for eradication of the identified organism"},{"letter":"C","text":"No intervention while she is asymptomatic"},{"letter":"D","text":"Repeat airway culture before implementing treatment"}],"correct":"B","why":"Current CF guidelines recommend early eradication therapy (typically inhaled tobramycin ± oral ciprofloxacin) at the FIRST isolation of Pseudomonas, even in an asymptomatic patient, because early treatment can delay/prevent chronic colonization, which is associated with accelerated lung function decline.","wrong":"A) Hospitalization for IV antibiotics is reserved for pulmonary exacerbations, not an asymptomatic new culture. C) 'No intervention' misses the opportunity for early eradication, which changes long-term outcomes. D) Repeating the culture before treating would delay evidence-based early eradication therapy.","note":""},{"id":36,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 3-year-old boy has experienced hoarseness for more than 12 months. He has no dyspnea or stridor. Shortly after birth, he had ligation of a patent ductus arteriosus. Which of the following is the procedure that will provide the MOST helpful information about this patient?","options":[{"letter":"A","text":"A barium esophagram for assessment of a vascular ring"},{"letter":"B","text":"Inspection of the palate for symmetric motion"},{"letter":"C","text":"Flexible airway endoscopy for assessment of vocal cord mobility"},{"letter":"D","text":"Posteroanterior and lateral chest radiography for evaluation of the pulmonary hilum"}],"correct":"C","why":"PDA ligation puts the left recurrent laryngeal nerve at risk of injury as it courses near the ductus. Chronic hoarseness post-ligation should prompt direct visualization of vocal cord movement (flexible laryngoscopy) to assess for vocal cord paralysis.","wrong":"A) A barium esophagram assesses for vascular ring/extrinsic esophageal compression, not vocal cord function. B) Palate motion assessment evaluates for velopharyngeal insufficiency, unrelated to hoarseness after PDA ligation. D) Chest imaging doesn't evaluate vocal cord mobility.","note":""},{"id":37,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 14-year-old is evaluated for cough with associated chest pain during the past two weeks. The cough has slowly worsened, and it isn't easy to complete daily tasks due to shortness of breath. Lung examination reveals no crackles or wheezing. The patient is afebrile. He denies smoking tobacco but admits to using e-cigarettes. A complete blood cell count is significant for elevated white blood cells. Chest radiography is ordered. The chest radiograph is most likely to show which of the following findings?","options":[{"letter":"A","text":"Bilateral diffuse infiltrates"},{"letter":"B","text":"Pneumothorax"},{"letter":"C","text":"Large pleural effusion"},{"letter":"D","text":"Lobar consolidation"}],"correct":"A","why":"E-cigarette/vaping-associated lung injury (EVALI) classically presents with bilateral, often diffuse ground-glass/infiltrative changes on chest imaging, in a patient with a subacute respiratory illness and a vaping history.","wrong":"B) Pneumothorax isn't the typical EVALI radiographic finding. C) Large pleural effusion isn't classic for EVALI. D) Lobar consolidation suggests typical bacterial pneumonia, not the diffuse/bilateral picture of vaping-related lung injury.","note":""},{"id":38,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 2-week-old female neonate develops a cough and tachypnea four days after surgical repair of her congenital heart disease. Examination of her chest demonstrates dullness to percussion and diminished breath sounds over her left lung. A chest radiograph shows a moderate-sized pleural effusion on the left side. Needle thoracocentesis is then performed with a good improvement of her respiratory status. The analysis of the pleural fluid demonstrates lymphocyte predominance with high triglyceride content. Subsequent serial chest radiographs show a slow accumulation of the pleural effusion with no associated respiratory symptoms.\nWhich of the following is the BEST next step in this baby's management?","options":[{"letter":"A","text":"Medium-chain triglyceride-based formula"},{"letter":"B","text":"Fibrin glue chemical pleurodesis"},{"letter":"C","text":"Ligation of the thoracic duct"},{"letter":"D","text":"Noninvasive continuous positive airway pressure"}],"correct":"A","why":"High-triglyceride, lymphocyte-predominant pleural fluid confirms chylothorax (post-surgical thoracic duct injury/disruption). First-line conservative management for a slowly-reaccumulating, asymptomatic chylous effusion is dietary modification to MCT-based formula, which bypasses lymphatic (thoracic duct) absorption since MCTs are absorbed directly into the portal circulation rather than via chylomicrons/lymphatics.","wrong":"B) Chemical pleurodesis is reserved for cases refractory to conservative dietary management. C) Surgical thoracic duct ligation is reserved for cases that fail medical management, not first-line. D) CPAP doesn't address the underlying chylous leak.","note":""},{"id":39,"system":"pulmonology","systemName":"Pulmonology","source":"SET-1","stem":"A 2-year-old female, presenting with cough and wheezing to the ED with a previous history of similar attacks three times in the last year, required hospitalization twice. Examination revealed RR: 70, SpO2: 90% on room air, intercostal retractions, and bilateral wheezing. Father had a history of asthma. A decision was made to admit this patient. You started counseling the parents regarding treatment.\nWhat is the MOST appropriate statement regarding the management of this patient?","options":[{"letter":"A","text":"Inhaled corticosteroid (ICS) will prevent future attacks of wheezing after medication is discontinued"},{"letter":"B","text":"ICS, if used with good compliance, can decrease the number of exacerbations and severity"},{"letter":"C","text":"The patient has no risk of developing asthma after the age of 5 years"},{"letter":"D","text":"Salbutamol has no role in treating this patient"}],"correct":"B","why":"This reflects accurate, evidence-based counseling: ICS are controller therapy that reduce exacerbation frequency/severity with good adherence, though they don't 'cure' or guarantee prevention of all future attacks once stopped.","wrong":"A) ICS do NOT provide lasting protection once discontinued — this overstates their effect. C) Many preschool wheezers do 'outgrow' symptoms, but it's inaccurate/overly reassuring to say there's 'no risk' of asthma after age 5. D) Salbutamol (a bronchodilator) very much has a role as rescue therapy in this patient.","note":""},{"id":40,"system":"pulmonology","systemName":"Pulmonology","source":"2021","stem":"A 2-year-old boy was brought to the ER with a history of difficulty breathing and coughing for the last 2 days. His mother has asthma. Three other siblings do not have asthma. Mother denies any foreign body aspiration. Physical examination: afebrile, mildly tachypneic, wheezing is noted in the right chest, and the left lung sounds are clear. Chest X-ray reveals overdistended right lung, especially in expiratory film. Appropriate management should be:","options":[{"letter":"A","text":"Bronchodilator"},{"letter":"B","text":"Pulmonary physiotherapy"},{"letter":"C","text":"Thoracotomy"},{"letter":"D","text":"CPR (cardio pulmonary resuscitation)"},{"letter":"E","text":"Removal of the bronchial foreign body"}],"correct":"E","why":"Unilateral wheeze with air-trapping (overdistension of the right lung, worse on expiration — a classic 'ball-valve' obstruction pattern) in a toddler, despite denied aspiration history (very common — witnessed aspiration is often NOT reported), is foreign body aspiration until proven otherwise. Definitive management is bronchoscopic removal of the foreign body.","wrong":"A) A bronchodilator won't relieve a mechanical obstruction from a foreign body. B) Physiotherapy doesn't remove an obstructing foreign body and could theoretically dislodge it into a more dangerous position. C) Thoracotomy is far more invasive than needed — bronchoscopy is the standard approach. D) There's no arrest/indication for CPR described in this stable, mildly tachypneic child.","note":""},{"id":41,"system":"pulmonology","systemName":"Pulmonology","source":"2021","stem":"A 10-year-old girl appeared in the ER with acute asthma attacks. The girl improved with inhalation bronchodilator therapy. She usually receives oral prednisone at home. The next step in management:","options":[{"letter":"A","text":"Increase oral prednisone doses"},{"letter":"B","text":"Start inhaled steroid and discontinue oral steroid"},{"letter":"C","text":"Resume theophylline along with oral steroid"},{"letter":"D","text":"Reduce oral prednisone doses"},{"letter":"E","text":"Give both inhaled and oral steroids"}],"correct":"B","why":"A child on chronic oral (systemic) steroids for asthma control who is now improved after an acute exacerbation should be transitioned to inhaled corticosteroids for long-term maintenance therapy — inhaled steroids provide effective control with a much better long-term side-effect profile than chronic oral steroids, and are the guideline-recommended controller therapy.","wrong":"A) Increasing oral steroid dose perpetuates unnecessary systemic steroid exposure/side effects when the picture is now stable/improving. C) Theophylline is an older, less-preferred controller agent with a narrow therapeutic window — not the standard next step. D) Simply reducing oral steroid dose without transitioning to a proper controller (ICS) risks under-treatment. E) Continuing both inhaled AND oral steroids isn't necessary once she's stabilized and can be controlled on ICS alone — unnecessarily prolongs systemic steroid exposure.","note":""},{"id":42,"system":"pulmonology","systemName":"Pulmonology","source":"2021","stem":"A 10-day-old male newborn is diagnosed to have cystic fibrosis. Sweat chloride test results are normal. The most likely interpretation:","options":[{"letter":"A","text":"He does not have cystic fibrosis."},{"letter":"B","text":"Sweat chloride test results are always abnormal in a cystic fibrosis newborn."},{"letter":"C","text":"A sweat chloride test should not be performed before 1 year of age."},{"letter":"D","text":"Sweat chloride test results are not reliable in first week of life."},{"letter":"E","text":"Sweat chloride test should be performed after 6 months of age"}],"correct":"D","why":"Sweat chloride testing requires an adequate sweat volume, which very young infants (especially under 2 weeks) often cannot produce reliably, leading to false-negative or indeterminate results. A normal sweat test in a 10-day-old with a positive newborn screen for CF should NOT be taken as ruling out CF — it should be repeated later.","wrong":"A) A single normal sweat test in the first days of life does not rule out CF given the technical unreliability at this age — repeat testing is needed, not reassurance. B) Sweat chloride is not 'always' abnormal at this age due to the technical difficulty of adequate sweat collection in neonates. C) Testing CAN be attempted before 1 year (in fact it's recommended after a positive newborn screen), it's just less reliable in the very first days/weeks — 'should not be performed' is too absolute. E) Waiting until 6 months is far too long a delay when the infant needs prompt diagnostic clarification after a positive newborn screen.","note":""},{"id":43,"system":"neurology","systemName":"Neurology","source":"SET-1","stem":"A 7-year-old boy with recent flu-like symptoms now shows signs of confusion, hallucinations, and involuntary movements. His parents report episodes of unresponsiveness. EEG shows abnormal slow-wave activity. MRI is unremarkable.\nWhat would be an appropriate treatment strategy?","options":[{"letter":"A","text":"Administer intravenous immunoglobulin (IVIG)"},{"letter":"B","text":"Start antipsychotic medication"},{"letter":"C","text":"Begin antiviral therapy with acyclovir"},{"letter":"D","text":"Initiate antiseizure medications"}],"correct":"A","why":"This constellation (post-infectious psychiatric symptoms, dyskinesias, altered consciousness, abnormal EEG with normal/near-normal MRI) is classic for autoimmune (e.g., anti-NMDA-receptor) encephalitis, which is treated with immunotherapy — IVIG, steroids, or plasma exchange.","wrong":"B) Antipsychotics only mask symptoms and don't treat the underlying autoimmune process (and can worsen movement disorder/neuroleptic sensitivity in anti-NMDAR encephalitis). C) Acyclovir treats HSV encephalitis, which typically shows temporal lobe changes on MRI — here the MRI is unremarkable, making autoimmune encephalitis more likely. D) Antiseizure medications may be needed adjunctively but don't address the underlying autoimmune process driving the presentation.","note":""},{"id":44,"system":"neurology","systemName":"Neurology","source":"SET-1","stem":"A 9-year-old boy has been admitted to the hospital with symptoms of fever, headache, altered consciousness, and focal neurologic signs. Lumbar puncture reveals lymphocytic pleocytosis and increased protein in the CSF. PCR confirms HSV infection.\nWhat is the recommended duration for antiviral therapy in this case?","options":[{"letter":"A","text":"7 days"},{"letter":"B","text":"14 days"},{"letter":"C","text":"21 days"}],"correct":"C","why":"HSV encephalitis in children (beyond the neonatal period) is treated with IV acyclovir for 21 days, given the high relapse rate with shorter courses.","wrong":"A) 7 days is inadequate and risks relapse/incomplete treatment. B) 14 days is the neonatal HSV (skin/eye/mouth, not CNS) duration, not appropriate for confirmed CNS disease — CNS/disseminated neonatal HSV needs even longer (21 days), and pediatric HSV encephalitis also requires 21 days.","note":""},{"id":45,"system":"neurology","systemName":"Neurology","source":"SET-1","stem":"A 6-year-old boy with no past medical history is brought to the emergency department after seizure-like activity. He has had a headache, fever, cough, rhinorrhea, and intermittent vomiting for the past four days. Their mother reported that he had strange behavior, with incoherent speech, difficulty walking, and lethargy. He had approximately 1 minute of generalized seizure activity that self-resolved. His rectal temperature was 39°C. On examination, he is awake and alert, although he appears confused and agitated, with incoherent speech. His physical examination reveals a clinically stable, fussy, uncooperative child with no focal neurologic findings and clear nasal rhinorrhea. Results from a complete blood count, complete metabolic panel, and urinalysis are unremarkable. An emergency computed tomography scan of the head is normal. On re-evaluation, the patient's mental status is unchanged.\nWhich of the following is the BEST next step in managing this child?","options":[{"letter":"A","text":"Administer an intravenous anti-epileptic medication"},{"letter":"B","text":"Obtain brain magnetic resonance imaging with and without contrast"},{"letter":"C","text":"Obtain emergency electroencephalography"},{"letter":"D","text":"Perform a lumbar puncture with opening pressure measurement"}],"correct":"D","why":"With a normal CT (making LP safe) and a clinical picture concerning for meningitis/encephalitis, LP is the essential next diagnostic test to guide antimicrobial/antiviral therapy; opening pressure measurement also helps assess for raised ICP.","wrong":"A) An empiric anti-epileptic isn't indicated for a single self-resolved seizure without ongoing status epilepticus. B) Contrast MRI is not urgently necessary before LP once CT has ruled out a mass lesion/contraindication to LP. C) Emergency EEG isn't the priority when the seizure has already resolved and diagnostic work-up for infection is needed first.","note":""},{"id":46,"system":"neurology","systemName":"Neurology","source":"SET-1","stem":"A 6-year-old girl presents to the emergency department with progressive weakness in her legs that has ascended to involve her arms. She also reports tingling in her feet. She had a respiratory infection two weeks ago.\nWhat is the most appropriate initial management?","options":[{"letter":"A","text":"Start oral prednisolone"},{"letter":"B","text":"Administer intravenous corticosteroids"},{"letter":"C","text":"Initiate broad-spectrum antibiotics"},{"letter":"D","text":"Perform plasma exchange"}],"correct":"D","why":"This is Guillain-Barré syndrome (ascending weakness, recent antecedent infection, paresthesias). First-line disease-modifying treatments are IVIG or plasma exchange — of the options listed, plasma exchange is correct (note: IVIG is an equally valid alternative in practice, but wasn't offered here in a way that beat the other options).","wrong":"A) Oral prednisolone has NOT been shown to be effective in GBS and is not standard therapy. B) IV corticosteroids alone are also not effective in GBS (steroids are notably ineffective in this disease, unlike in many other inflammatory neuropathies). C) Broad-spectrum antibiotics have no role since GBS is post-infectious/immune-mediated, not an active bacterial infection.","note":""},{"id":47,"system":"neurology","systemName":"Neurology","source":"SET-1","stem":"A six-month-old male infant presents with sudden onset of hypotonia, loss of head control, and irritability after three days of upper respiratory tract infection. The examination was remarkable for macrocephaly, dystonic posture, and spasticity of all limbs. Retinal bleeding was evident on eye examination. MRI brain shows bitemporal brain atrophy and subdural hemorrhage.\nWhat is the most likely diagnosis?","options":[{"letter":"A","text":"Non-accidental injury"},{"letter":"B","text":"Glutaric aciduria type 1"},{"letter":"C","text":"Biotinidase deficiency"}],"correct":"B","why":"Macrocephaly with bilateral (bitemporal/frontotemporal) atrophy, subdural hemorrhages, and retinal hemorrhages in an infant can mimic non-accidental trauma but is a recognized presentation of glutaric aciduria type 1 — a organic acidemia causing striatal injury, often triggered by an intercurrent illness ('encephalopathic crisis').","wrong":"A) Non-accidental injury is an important differential (and must always be considered/screened for), but the combination of macrocephaly PLUS bitemporal atrophy is a specific radiologic pattern more typical of GA1 and is the intended answer given these exact findings. C) Biotinidase deficiency causes a different picture (seizures, rash, alopecia, developmental regression) without this classic bitemporal atrophy/subdural pattern.","note":""},{"id":48,"system":"neurology","systemName":"Neurology","source":"2021","stem":"A newborn was diagnosed with congenital hydrocephalus due to aqueductal stenosis. Ventriculoperitoneal shunt was placed. The baby developed fever 3 days after surgery. Physical examination revealed erythema of scalp over shunt. Shunt was removed. S. epidermidis was isolated in blood and CSF cultures. Vancomycin was given. Most infections are due to:","options":[{"letter":"A","text":"Intraoperative contamination of surgical wound by skin flora"},{"letter":"B","text":"Preoperative infection"},{"letter":"C","text":"Postoperative infection due to contamination and poor wound handling"},{"letter":"D","text":"Shunt is infected secondary to primary systemic infection"},{"letter":"E","text":"Meningitis causing shunt infection"}],"correct":"A","why":"VP shunt infections most commonly occur within the first 1-2 months after placement and are most commonly caused by skin flora (coagulase-negative staphylococci like S. epidermidis, as seen here, and S. aureus) introduced at the time of surgery — i.e., intraoperative contamination, not a separate pre-existing or hematogenous process.","wrong":"B) Preoperative infection isn't the typical mechanism — the organism profile (skin flora) points to intraoperative introduction. C) 'Postoperative contamination/poor wound handling' is a less precise/less classically emphasized mechanism than direct intraoperative inoculation with skin flora during the procedure itself. D) Systemic infection seeding the shunt is a less common mechanism than direct intraoperative contamination for early shunt infections. E) Meningitis causing shunt infection reverses the usual causal direction — shunt infection more commonly causes secondary meningitis/ventriculitis, not the other way around.","note":""},{"id":49,"system":"neurology","systemName":"Neurology","source":"2021","stem":"A 10-year-old girl appears with a progressive weakness in both lower extremities, pain in the lower back and abdomen, and urinary incontinence for the last 24 hours. She had a viral infection recently. Physical examination reveals a loss of pain, light touch, and temperature sensations; loss of reflexes; but the joint position and vibration sense are intact. Later on she developed spasticity and hyperreflexia in lower extremities. CBC reveals WBC count 9,500, polymorphs 45%, lymphocytes 55%, hemoglobin 12, hematocrit 36, and platelet 225,000. CSF reveals an elevated lymphocytes (35 cells), absence of polymorphonuclear leukocytes, mildly elevated protein (55 mg/dL), and normal glucose (60 mg/dL). Most likely diagnosis:","options":[{"letter":"A","text":"Botulism"},{"letter":"B","text":"Brain tumor"},{"letter":"C","text":"Poliomyelitis"},{"letter":"D","text":"Transverse myelitis"},{"letter":"E","text":"Guillain-Barre syndrome"}],"correct":"D","why":"Acute, focal spinal-cord-level dysfunction (sensory level with loss of pain/temperature but INTACT joint position/vibration — a classic dissociated sensory loss suggesting a spinothalamic tract lesion), bladder involvement (urinary incontinence), and evolving upper motor neuron signs (spasticity/hyperreflexia developing after initial flaccidity) following a recent viral illness is classic for transverse myelitis — an immune-mediated spinal cord inflammation.","wrong":"A) Botulism causes a descending flaccid paralysis without sensory loss or CSF pleocytosis. B) A brain tumor wouldn't produce this acute, spinal-level, dissociated sensory pattern with rapidly evolving upper motor neuron signs. C) Poliomyelitis causes a pure flaccid, asymmetric motor paralysis WITHOUT sensory loss — sensory involvement here argues strongly against polio. E) GBS is a polyradiculoneuropathy causing ASCENDING FLACCID weakness with AREFLEXIA and usually preserved sensation (or only mild paresthesias), not this sharp sensory LEVEL with dissociated loss and later spasticity — the CSF here (mild pleocytosis with elevated protein) is also more typical of transverse myelitis than GBS's classic albuminocytologic dissociation (very high protein, normal/low cell count).","note":""},{"id":50,"system":"neurology","systemName":"Neurology","source":"2021","stem":"A 3-year-old boy is brought to the emergency department because of leg pain and refusal to walk. His parents report that he has been crying of pain in his legs for the past 2 days and that over the last day he has insisted on being carried, refusing to put his feet down or bear weight. He has no history of trauma to the legs. His parents recall that he had a febrile upper respiratory infection 2 weeks ago and has had no rash or joint swelling. He has a temperature of 37.6°C, heart rate of 100 beats/min, respiratory rate of 22 breaths/min, and blood pressure of 90/72 mm Hg. He is crying and inconsolable. His general physical examination findings are unremarkable. He has no rash, joint swelling, or erythema. On neurological examination, he is alert and uncooperative. His cranial nerve examination has normal findings. He vigorously moves his upper extremities. He drags his legs away from examination and along the bed but is unable to lift them off the bed. His reflexes are 0/4 at the ankle and patella and 1/4 at the biceps and triceps bilaterally. His toes are downgoing to plantar stimulation. Sensation to touch is intact. He reaches for objects without evidence of dysmetria or ataxia. He refuses to walk. Magnetic resonance imaging of the lumbar spine shows enhancement of the lumbo-sacral nerve roots. CSF: White blood cell count 4/µL with lymphocytic predominance, Red blood cell count 0/µL, Protein 114 mg/dL, Glucose 60 mg/dL (3.3 mmol/L).\nOf the following, the BEST next step in management is initiation of","options":[{"letter":"A","text":"ceftriaxone"},{"letter":"B","text":"intravenous immunoglobulin"},{"letter":"C","text":"methylprednisolone"},{"letter":"D","text":"plasmapheresis"}],"correct":"B","why":"This vignette (post-infectious, progressive leg weakness/pain, refusal to walk, AREFLEXIA at the legs, normal sensation, MRI showing lumbosacral nerve root enhancement, and CSF with albuminocytologic dissociation — very high protein [114] with a nearly normal cell count [4 cells]) is Guillain-Barré syndrome (here presenting atypically in a young child as leg pain/refusal to walk rather than classic ascending weakness). First-line disease-modifying treatment is IVIG (or plasmapheresis, though IVIG is generally preferred/more practical in young children).","wrong":"A) Ceftriaxone would treat bacterial meningitis, but the CSF here (lymphocytic predominance, high protein, normal glucose, low cell count) is NOT consistent with bacterial meningitis (which would show much higher WBC counts, low glucose, neutrophil predominance). C) Methylprednisolone (steroids) have NOT been shown effective in GBS. D) Plasmapheresis is an alternative to IVIG but is technically more difficult in a small child (vascular access challenges) — IVIG is generally the preferred first-line option in pediatrics.","note":""},{"id":51,"system":"neurology","systemName":"Neurology","source":"2021","stem":"A 4-year-old developmentally normal girl is brought to the emergency department because of an abnormal gait. Her mother reports that she woke that morning with the inability to walk without holding on to something. When sitting, she cannot hold herself up without bobbing her head. Her mother also reports that her speech seems slower than usual and that she has had no fever, headache, sensory changes, vomiting, rash, or weakness. The mother recalls that her daughter had a mild viral upper respiratory infection 1 week ago, from which she has completely recovered. The patient is alert and cooperative. The general physical examination findings and vital signs are normal. Neurological examination reveals scanning speech. Cranial nerve examination findings are normal, with no papilledema and mild end-gaze nystagmus bilaterally. Her strength is normal, with normal deep tendon reflexes and toes downgoing to plantar stimulation. Sensory examination findings are normal. When encouraged to sit up, she exhibits truncal instability with titubation. She has mild dysmetria when reaching for toys bilaterally. She walks holding her mother's hand with a wide-based unsteady gait. Magnetic resonance imaging of the brain with and without contrast has normal findings. Lumbar puncture is performed with normal opening pressure. Cerebrospinal fluid analysis reveals a lymphocytic pleocytosis with normal protein and glucose levels. Cultures of the cerebrospinal fluid are negative.\nOf the following, the MOST likely diagnosis for this child is","options":[{"letter":"A","text":"accidental drug ingestion"},{"letter":"B","text":"acute cerebellar ataxia"},{"letter":"C","text":"acute disseminated encephalomyelitis"},{"letter":"D","text":"postinfectious polyradiculopathy"}],"correct":"B","why":"Acute-onset truncal ataxia (wide-based gait, titubation, dysmetria), dysarthria (scanning speech), and nystagmus following a recent viral illness, with a normal MRI and CSF showing only a mild lymphocytic pleocytosis (post-infectious/para-infectious inflammatory pattern), in an otherwise well child, is the classic presentation of acute cerebellar ataxia (post-infectious cerebellitis) — a usually self-limited condition typically following viral infections (classically varicella, but many viruses).","wrong":"A) Accidental drug ingestion (e.g., benzodiazepine, antihistamine) can cause ataxia, but wouldn't be expected to show CSF pleocytosis, and the recent viral illness history supports a post-infectious cause instead. C) ADEM typically shows MULTIFOCAL white matter changes on MRI and depressed consciousness/encephalopathy — this child has a NORMAL MRI and is alert/interactive, arguing against ADEM. D) Postinfectious polyradiculopathy (GBS) causes weakness/AREFLEXIA typically with an ascending pattern, not primarily truncal ataxia/dysmetria/nystagmus with normal strength and reflexes as described here.","note":""},{"id":52,"system":"neurology","systemName":"Neurology","source":"2021","stem":"A 10-month-old, full-term, male infant is seen by his pediatrician for evaluation of gross motor delay. His mother notes that he is unable to sit independently. She recalls that he was able to roll at 4 months of age and briefly sat in a tripod position around the age of 8 months. Over the last 4 weeks he is no longer able to roll or sit without support. He reaches for objects, using a raking grasp with no hand preference. He babbles, says 'mama' and 'dada,' and cries if approached by an unfamiliar person. He has had no preceding illness. He is alert and in no acute distress. His pupils are equal, round and reactive to light, extraocular movements are intact, and his face is symmetric. Tongue fasciculations are noted. Normal muscle bulk with diffuse axial and appendicular hypotonia is appreciated. Proximal strength is 3/5 bilaterally with more movement distally and in the arms. Deep tendon reflexes are 0/4 throughout, with toes downgoing to plantar stimulation. Fine tremors are noted in the hands. No dysmetria or ataxia are appreciated in his movements.\nOf the following, the MOST likely diagnosis is","options":[{"letter":"A","text":"congenital muscular dystrophy"},{"letter":"B","text":"infantile botulism"},{"letter":"C","text":"myasthenia gravis"},{"letter":"D","text":"spinal muscular atrophy"}],"correct":"D","why":"Progressive proximal weakness with generalized hypotonia, AREFLEXIA (0/4 throughout), tongue fasciculations (a lower motor neuron sign highly specific for anterior horn cell disease), and fine tremor of the hands (polyminimyoclonus, another classic SMA finding), with normal cognition/social engagement (normal babbling, stranger anxiety) and no sensory/cerebellar findings, is classic for spinal muscular atrophy (a pure lower motor neuron/anterior horn cell disease).","wrong":"A) Congenital muscular dystrophy would present from birth/early infancy with weakness, not a NEW regression after a period of normal motor progress, and doesn't typically cause fasciculations. B) Infantile botulism causes acute (often rapidly progressive over days) hypotonia typically with bulbar signs (poor suck, ptosis, sluggish pupils) and often a history of honey ingestion/constipation — not this more gradual regression pattern with tongue fasciculations pointing to anterior horn cell disease specifically. C) Myasthenia gravis is rare in this age group and would show fatigable weakness, often with ocular/bulbar findings, not tongue fasciculations (a lower motor neuron sign not seen in NMJ disease).","note":""},{"id":53,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"A 5-year-old child presents with six or more café-au-lait spots, axillary freckling, and a family history of similar symptoms. Given these findings, what potential complication should the pediatrician be vigilant about in the patient's future?","options":[{"letter":"A","text":"Development of learning disabilities"},{"letter":"B","text":"Onset of type 2 diabetes"},{"letter":"C","text":"Onset of severe asthma"},{"letter":"D","text":"Development of cardiac arrhythmias"}],"correct":"A","why":"This is neurofibromatosis type 1 (NF1). Learning disabilities/ADHD are the most common neurodevelopmental complication and the thing pediatricians should proactively screen for, even though NF1 is best known for tumors (optic glioma, plexiform neurofibromas).","wrong":"B) Type 2 diabetes isn't a recognized NF1 association. C) Severe asthma isn't part of the NF1 phenotype. D) Cardiac arrhythmias aren't a classic NF1 complication (though pulmonic stenosis/vascular anomalies can occur, arrhythmia isn't the classic vigilance point).","note":""},{"id":54,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"A 2-year-old boy is seen for a health supervision visit. His mother reports episodes of otitis media over the past year, which required the placement of myringotomy tubes. He has had 10 to 12 episodes of upper respiratory tract infection over his lifetime. He has coarse facial features, macrocephaly, hand contractures, a gibbous deformity, and corneal clouding. His liver is palpable 3 cm below the right costal margin. His height is 2.5 standard deviations below the mean.\nWhich diagnosis is most consistent with the boy's clinical features?","options":[{"letter":"A","text":"Fabry disease"},{"letter":"B","text":"Hunter syndrome"},{"letter":"C","text":"Pompe disease"},{"letter":"D","text":"Hurler Syndrome"}],"correct":"D","why":"Corneal clouding is the key discriminator — it occurs in Hurler syndrome (MPS I, autosomal recessive) but classically NOT in Hunter syndrome (MPS II, X-linked), even though both cause coarse features, organomegaly, and skeletal changes (gibbus deformity, contractures).","wrong":"A) Fabry disease presents with angiokeratomas, acroparesthesias, and renal disease, not this coarse phenotype. B) Hunter syndrome mimics Hurler but classically spares the cornea (no clouding) and is X-linked, milder in general. C) Pompe disease is a glycogen storage disease presenting with cardiomyopathy/hypotonia in infancy, not this dysmorphic/storage phenotype.","note":""},{"id":55,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"A neonate with multiple anomalies is being evaluated in the newborn nursery. Her physical examination findings are remarkable for bilateral iris colobomas, bilateral choanal atresia, unilateral facial palsy, and facial dysmorphology, including a square/flat midface, broad, prominent forehead, and wide nasal bridge. The ears are low set and asymmetric with a prominent antihelix and clipped-off helix. On auscultation, a cardiac murmur is detected. Echocardiography reveals an atrioventricular canal defect. In addition, the neonate failed her hearing screen bilaterally.\nWhich of the following is the neonate's MOST likely diagnosis?","options":[{"letter":"A","text":"22q11.2 deletion"},{"letter":"B","text":"Branchio-oto-renal syndrome"},{"letter":"C","text":"CHARGE syndrome"},{"letter":"D","text":"Treacher Collins syndrome"}],"correct":"C","why":"CHARGE syndrome (Coloboma, Heart defects, Atresia choanae, Retarded growth/development, Genital abnormalities, Ear abnormalities) is defined by exactly this combination — coloboma + choanal atresia + characteristic ears + AV canal + hearing loss make this diagnostic.","wrong":"A) 22q11.2 deletion (DiGeorge) causes conotruncal heart defects, hypocalcemia, and immune deficiency, not coloboma/choanal atresia. B) Branchio-oto-renal syndrome involves ear pits/branchial cysts and renal anomalies, not this combination. D) Treacher Collins causes malar/mandibular hypoplasia without coloboma/choanal atresia/heart defects as core features.","note":""},{"id":56,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"A 23-hour-old neonate with a history of poor feeding, lethargy, and severe hypotonia also had recurrent myoclonic seizures, apnea, and hiccups. Laboratory investigation: normal Ph, normal ammonia. Negative urine ketone.\nWhat is the most likely diagnosis?","options":[{"letter":"A","text":"Creatine deficiency disorders"},{"letter":"B","text":"Propionic acidemia"},{"letter":"C","text":"Cobalamin defect disorders"},{"letter":"D","text":"Non-Ketotic Hyperglycinemia"}],"correct":"D","why":"Hiccups are a classic and specific clue for non-ketotic hyperglycinemia (glycine encephalopathy) — along with the absence of acidosis, hyperammonemia, or ketosis (which would instead suggest organic acidemia or urea cycle defect), pointing away from the more 'typical' metabolic acidemias.","wrong":"A) Creatine deficiency disorders present later with developmental delay/seizures, not this acute neonatal picture. B) Propionic acidemia causes metabolic acidosis and often hyperammonemia — both are normal here, arguing against it. C) Cobalamin defects often cause megaloblastic anemia/metabolic acidosis, not this specific presentation.","note":""},{"id":57,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"A 6-year-old boy is seen for a health supervision visit. He is attending first grade in a regular classroom and is doing well. His parents are expecting a baby next month. A family history is obtained; a pedigree review shows Classical Homocystinuria in the boy's great-grandparent, advanced paternal and maternal age at conception, and parental consanguinity (first cousins). His parents are concerned about the risk of Classical Homocystinuria in their unborn child.\nWhich of the following is the MOST significant risk factor for Classical Homocystinuria?","options":[{"letter":"A","text":"Advanced maternal age at conception"},{"letter":"B","text":"Advanced paternal age at conception"},{"letter":"C","text":"Parental consanguinity"},{"letter":"D","text":"Parental ethnic background"}],"correct":"C","why":"Classical homocystinuria is autosomal recessive. Consanguinity dramatically increases the chance both parents carry (and pass on) the same recessive allele, making it the dominant risk factor — advanced parental age is far more relevant to autosomal dominant/de novo mutations and chromosomal non-disjunction, not AR conditions.","wrong":"A/B) Advanced maternal/paternal age increases risk of aneuploidy (maternal) or new dominant mutations (paternal), not recessive disease inheritance. D) Ethnic background can influence carrier frequency for specific AR conditions but is not the 'most significant' factor when consanguinity is explicitly present in the pedigree.","note":""},{"id":58,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"A 6-month-old infant has been exclusively fed a commercially available infant formula. Upon introduction of fruit juices, however, the child develops jaundice, hepatomegaly, vomiting, lethargy, irritability, and seizures. Tests for urine-reducing substances are positive.\nWhich of the following is likely to explain this child's condition?","options":[{"letter":"A","text":"Tyrosinemia"},{"letter":"B","text":"Galactosemia"},{"letter":"C","text":"Hereditary fructose intolerance"},{"letter":"D","text":"á1-Antitrypsin deficiency"}],"correct":"C","why":"Symptom onset specifically with introduction of FRUIT (fructose-containing) juice, plus positive urine reducing substances (fructose is a reducing sugar), is classic for hereditary fructose intolerance (aldolase B deficiency) — hepatotoxicity/hypoglycemia occur only after fructose exposure.","wrong":"A) Tyrosinemia presents with liver failure/renal tubulopathy but isn't specifically triggered by fruit juice introduction. B) Galactosemia is triggered by lactose (milk, i.e., formula) exposure from birth, not by later introduction of fruit juice — the timing here (symptom onset after starting juice, having tolerated formula fine) argues against galactosemia. D) Alpha-1 antitrypsin deficiency causes cholestasis unrelated to diet triggers.","note":""},{"id":59,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"A 3-day-old term female neonate is being evaluated in the emergency department for hypotonia and decreased feeding. The neonate was discharged to home after an uneventful delivery and postnatal period. He is hypotonic and difficult to arouse. His vital signs include a blood pressure of 68/40 mmHg, temperature of 37.3 C, heart rate of 170 beats/min, and respiratory rate of 80 breaths/min. Laboratory data: Glucose:38 mg/dL (2.1 mmol/L), Creatinine 0.2 mg/dL (17.7 µmol/L), Blood urea nitrogen 16 mg/dL (5.7 mmo/L), Ammonia: 35 µg/dL (25 µmol/L), Carbon dioxide: 12 mEq/L (12 mmol/L), Lactate: 41.4 mg/dL (4.6 mmol/L), Urine ketones: Negative, Anion gap: 20 mEq/L (20 mmol/L), white blood cell count: 8,000/µL (8 x 109/L), C-reactive protein: 0.2 mg/dL (2 mg/L)\nWhich of the following is the MOST likely diagnosis?","options":[{"letter":"A","text":"Fatty acid oxidation disorder"},{"letter":"B","text":"Glycogen storage disease"},{"letter":"C","text":"Organic acidemia"},{"letter":"D","text":"Urea cycle defect"}],"correct":"A","why":"HYPOKETOTIC hypoglycemia (low glucose with inappropriately negative/low urine ketones, since ketones should be present when hypoglycemic) is the signature finding of a fatty acid oxidation disorder — the body cannot use fat for ketone/energy production during fasting stress.","wrong":"B) Glycogen storage disease typically shows appropriate ketosis with hypoglycemia (ketotic hypoglycemia), the opposite pattern. C) Organic acidemias usually cause significant metabolic acidosis with elevated ammonia and DO produce ketones — not matching the negative ketones here. D) Urea cycle defects present with hyperammonemia and respiratory alkalosis, not hypoglycemia with a normal ammonia as seen here.","note":""},{"id":60,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"You are asked to counsel a healthy mother with two non-dysmorphic mentally retarded sons, 6 and 9 years of age. She tells you that she also has a mentally retarded brother.\nWhich of the following is the MOST likely diagnostic test?","options":[{"letter":"A","text":"Chromosome analysis using folic acid deficient medium"},{"letter":"B","text":"Measurement of the serum uric acid concentration"},{"letter":"C","text":"Computed tomography of the head"},{"letter":"D","text":"Measurement of the plasma phenylalanine concentration"}],"correct":"A","why":"An X-linked recessive pattern (affected sons, affected maternal uncle, unaffected carrier mother) in NON-dysmorphic boys with intellectual disability is classic for Fragile X syndrome. Folate-deficient culture medium was the classic (older) cytogenetic technique used to reveal the fragile site on the X chromosome (Xq27.3) — this is why the specific medium is named in the answer, even though modern practice now uses molecular CGG-repeat testing.","wrong":"B) Serum uric acid points toward Lesch-Nyhan syndrome, which also causes dysmorphism/self-injury, not matching a 'non-dysmorphic' description. C) Head CT wouldn't identify a genetic diagnosis. D) Plasma phenylalanine tests for PKU, an autosomal recessive metabolic disease, not an X-linked pedigree like this one.","note":""},{"id":61,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"You are evaluating in the NICU a new born boy of 3 days old who had hypocalcaemic tetany and on I.V calcium supplementation, new born notice to had cleft palate and holosystolic murmur on cardiac examination, suggestive of Di George syndrome, you are discussing with your consultant the other finding which is one of them is the immunodeficiency, the immunodeficiency in Di George syndrome caused by defect in the following:","options":[{"letter":"A","text":"Purine nucleoside phosphorylase."},{"letter":"B","text":"WASP."},{"letter":"C","text":"Thymic development."},{"letter":"D","text":"DNA repair."}],"correct":"C","why":"DiGeorge syndrome (22q11.2 deletion) results from a defect in third and fourth pharyngeal pouch development, causing thymic hypoplasia/aplasia — hence a primary T-cell deficiency, alongside hypoparathyroidism (hypocalcemia) and conotruncal cardiac defects.","wrong":"A) Purine nucleoside phosphorylase deficiency is a separate cause of combined immunodeficiency, unrelated to DiGeorge. B) WASP gene defects cause Wiskott-Aldrich syndrome (different triad: eczema, thrombocytopenia, recurrent infection). D/E) DNA repair defects cause conditions like ataxia-telangiectasia, not DiGeorge.","note":""},{"id":62,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"Alia is a 13-month-old girl admitted to the inpatient ward with history of failure to thrive, repeated chest infection, and fatty offensive diarrhea. Hemoglobin level 8.8gm/dl, platelate count 150/mm3, white blood cell count 3.500/mm3, with absolute neutrophil count (ANC) 500/µL. Of the following, the MOST likely diagnosis is","options":[{"letter":"A","text":"cyclic neutropenia"},{"letter":"B","text":"drug-induced neutropenia"},{"letter":"C","text":"Shwachman-Diamond syndrome"},{"letter":"D","text":"acute lymphoblastic leukemia"}],"correct":"C","why":"The combination of exocrine pancreatic insufficiency (steatorrhea/FTT) PLUS bone marrow dysfunction (neutropenia ± other cytopenias) is classic for Shwachman-Diamond syndrome — the second most common cause of pancreatic insufficiency in children after cystic fibrosis.","wrong":"A) Cyclic neutropenia causes isolated, periodic neutropenia without pancreatic insufficiency/steatorrhea. B) Drug-induced neutropenia doesn't fit a chronic FTT/malabsorption picture without a triggering drug history. D) ALL can cause cytopenias but wouldn't classically present with fatty, offensive diarrhea from pancreatic insufficiency.","note":""},{"id":63,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"Musculoskeletal abnormalities in neurofibromatosis is","options":[{"letter":"A","text":"Hypertrophy of the limbs"},{"letter":"B","text":"Scoliosis"},{"letter":"C","text":"Pusdo arthrosis"},{"letter":"D","text":"All of the above"}],"correct":"D","why":"NF1 has a broad musculoskeletal phenotype: scoliosis (most common), pseudoarthrosis (classically of the tibia), and localized limb overgrowth/hypertrophy can all occur — this is a 'know the full list' recall question.","wrong":"Any single option alone (A, B, or C) is incomplete — NF1's skeletal manifestations span all three, which is why 'all of the above' is correct.","note":""},{"id":64,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"SET-1","stem":"A 9 years old child with high arched palate and his shoulder meeting to front of his chest. He has:","options":[{"letter":"A","text":"Erb's palsy"},{"letter":"B","text":"Cleidocranial dysostosis"},{"letter":"C","text":"Chondro-osteodystrophy"},{"letter":"D","text":"Cortical hyperostosis"}],"correct":"B","why":"Cleidocranial dysostosis (dysplasia) classically presents with hypoplastic/absent clavicles allowing the shoulders to be brought together in front of the chest, plus delayed closure of fontanelles, high-arched palate, and dental anomalies — an autosomal dominant RUNX2 disorder.","wrong":"A) Erb's palsy is a brachial plexus birth injury causing arm weakness, unrelated to clavicle absence or palate findings. C) Chondro-osteodystrophy (Morquio, an MPS) causes short stature/skeletal dysplasia but not classic shoulder-approximation. D) Cortical hyperostosis (Caffey disease) causes bony swelling/irritability in infancy, unrelated to this presentation.","note":""},{"id":65,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"2021","stem":"A child is diagnosed with neurofibromatosis (NF 1). The clinical presentation which is diagnostic for this condition:","options":[{"letter":"A","text":"Five café-au-lait spots over 5 mm in diameter."},{"letter":"B","text":"Four café-au-lait spots over 4 mm in diameter."},{"letter":"C","text":"Eye examination reveals hamartoma in the iris and absence of café-au-lait spots."},{"letter":"D","text":"Kyphoscoliosis without café-au-lait spots."},{"letter":"E","text":"Six café-au-lait spots 6 mm in diameter plus father has neurofibromatosis (NF 1)."}],"correct":"E","why":"NF1 diagnostic criteria (need ≥2 of 7 features) include: ≥6 café-au-lait macules (≥5mm in prepubertal children, ≥15mm in postpubertal individuals — 6mm qualifies), PLUS having a first-degree relative with NF1 counts as a second independent criterion on its own — so 6 large café-au-lait spots + an affected parent satisfies the ≥2-criteria requirement for diagnosis.","wrong":"A) Five café-au-lait spots is one below the required threshold of SIX for this criterion to count on its own. B) Four café-au-lait spots at 4mm doesn't meet either the number (need 6) or size threshold (need ≥5mm prepubertal). C) Iris hamartomas (Lisch nodules) ARE a valid NF1 criterion, but the option specifically states 'absence of café-au-lait spots' — a single criterion alone (Lisch nodules without any other criterion) is insufficient for diagnosis, which requires ≥2 criteria. D) Kyphoscoliosis (a distinctive osseous lesion) is a valid criterion, but again a single isolated criterion without a second one doesn't meet the ≥2 criteria diagnostic threshold.","note":""},{"id":66,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"2021","stem":"A full-term male newborn appeared with multiple congenital anomalies. He developed apneas and seizures. Physical examination reveals microcephaly, cleft lip, cleft palate, small eyes, and midline scalp defects. Most likely diagnosis:","options":[{"letter":"A","text":"Down syndrome"},{"letter":"B","text":"Trisomy 18"},{"letter":"C","text":"Trisomy 16"},{"letter":"D","text":"Trisomy 13"},{"letter":"E","text":"Noonan syndrome"}],"correct":"D","why":"Trisomy 13 (Patau syndrome) is classically associated with midline defects — cleft lip/palate, microphthalmia (small eyes), and midline scalp defects (cutis aplasia) — along with severe CNS malformations causing apnea/seizures (often from holoprosencephaly). This specific combination of midline facial and scalp anomalies is a hallmark 'buzzword' pattern for trisomy 13.","wrong":"A) Down syndrome (trisomy 21) doesn't cause cleft lip/palate, microphthalmia, or midline scalp defects as core features. B) Trisomy 18 (Edwards syndrome) has a different classic pattern (clenched fists with overlapping fingers, rocker-bottom feet, micrognathia) rather than this specific midline facial/scalp defect combination. C) Trisomy 16 is almost universally lethal in utero (a common cause of miscarriage) and essentially never seen in a liveborn infant. E) Noonan syndrome doesn't cause cleft lip/palate or midline scalp defects — it has a distinct phenotype (webbed neck, pulmonic stenosis, characteristic facies) without these specific findings.","note":""},{"id":67,"system":"genetics_dysmorphology_metabolic_disorders","systemName":"Genetics, Dysmorphology & Metabolic Disorders","source":"2021","stem":"A 3-week-old female neonate is brought to the emergency department for poor feeding and tachypnea. Physical examination reveals a nondysmorphic neonate with nasal flaring, diffuse rales on lung examination, a quiet precordium, and mild hepatomegaly. Chest radiography demonstrates cardiomegaly and pulmonary edema. Echocardiography shows hypertrophic cardiomyopathy and pericardial effusion, with no structural defects. Electrocardiography demonstrates increased voltages throughout. Laboratory results: Complete blood cell count Normal; C-reactive protein Normal; Blood cultures No growth at 48 hours; Comprehensive metabolic panel Normal except: Blood glucose 35 mg/dL (1.9 mmol/L), AST 125 U/L, ALT 150 U/L; Urinalysis Negative, no ketones; Newborn screening noted Elevated C14:1 of >1 mmol/L; Urine organic acids Increased dicarboxylic acids.\nOf the following, this neonate's MOST likely diagnosis is","options":[{"letter":"A","text":"Barth syndrome"},{"letter":"B","text":"α-galactosidase A deficiency"},{"letter":"C","text":"Pompe disease"},{"letter":"D","text":"very-long-chain acyl-coenzyme A dehydrogenase deficiency"}],"correct":"D","why":"The combination of hypertrophic cardiomyopathy, hypoketotic hypoglycemia (glucose 35 with negative urine ketones — inappropriate absence of ketosis during hypoglycemia), elevated liver enzymes, and specifically an ELEVATED C14:1 (tetradecenoylcarnitine) on newborn screening with increased urine dicarboxylic acids is the classic biochemical signature of VLCAD deficiency, a fatty acid oxidation disorder that characteristically causes cardiomyopathy (unlike some other FAO disorders) along with hypoketotic hypoglycemia and hepatic dysfunction.","wrong":"A) Barth syndrome also causes cardiomyopathy but is an X-linked disorder of cardiolipin metabolism with a different biochemical signature (3-methylglutaconic aciduria, neutropenia) — not this newborn screen/organic acid pattern. B) Alpha-galactosidase A deficiency (Fabry disease) is an X-linked lysosomal storage disease that doesn't present this acutely in the neonatal period with hypoglycemia/cardiomyopathy in this way — it's a much later-onset condition typically. C) Pompe disease (acid alpha-glucosidase deficiency, a glycogen storage disease) does cause infantile hypertrophic cardiomyopathy, but wouldn't produce this specific newborn-screen acylcarnitine (C14:1) elevation or the hypoketotic hypoglycemia pattern — Pompe's newborn screening marker is different (GAA enzyme activity), and glycogen storage diseases classically cause HYPERketotic, not hypoketotic, hypoglycemia.","note":""},{"id":68,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"SET-1","stem":"In the clinic you are evaluating a 9-month-old boy presented with recurrent attacks of diarrhea, thrush, and failure to thrive shortly after birth. You suspect immune deficiency. Of the following, the MOST common cause of this condition is:","options":[{"letter":"A","text":"defect in phagocytic cells"},{"letter":"B","text":"deficiencies in T-cell function"},{"letter":"C","text":"defect in antibody production"},{"letter":"D","text":"defect in complement proteins"}],"correct":"B","why":"Early-onset (shortly after birth) recurrent diarrhea + oral thrush + failure to thrive is the classic presentation of Severe Combined Immunodeficiency (SCID) — a T-cell (and usually combined T/B) defect. Symptoms this early and this severe point to T-cell dysfunction rather than a purely antibody problem (which usually presents later, after maternal antibody wanes around 6 months).","wrong":"A) Phagocytic cell defects (e.g., chronic granulomatous disease) present with abscesses/deep organ infections with catalase-positive organisms, not chronic diarrhea/thrush from birth. C) Antibody deficiencies typically present later (after maternal IgG wanes) with recurrent sinopulmonary bacterial infections, not this early/severe combined picture. D) Complement deficiencies present with recurrent Neisserial infections or SLE-like autoimmunity, not this picture.","note":""},{"id":69,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"SET-1","stem":"In the inpatient ward you are examining Fatma, a 17-month-old girl who admitted as case of pneumonia with previous history of recurrent attacks of pneumonia since the age of 8 months. You suspect a predominant B-cell defect. Of the following, the BEST simple initial screening test is:","options":[{"letter":"A","text":"IgA measurement"},{"letter":"B","text":"IgG measurement"},{"letter":"C","text":"IgM measurement"},{"letter":"D","text":"isohemagglutinins titer"}],"correct":"B","why":"Quantitative immunoglobulin levels (starting with IgG, the dominant serum immunoglobulin and most clinically relevant for recurrent bacterial infection) is the simplest initial screening test for suspected antibody (B-cell) deficiency.","wrong":"A) IgA alone would miss more common/severe defects like XLA or CVID (which primarily show low IgG). C) IgM alone is less representative of overall humoral function; isolated hyper-IgM syndromes are less common than IgG-predominant deficiencies. D) Isohemagglutinin titers assess a SPECIFIC IgM-mediated response and are a second-line/functional test, not the initial screen.","note":""},{"id":70,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"SET-1","stem":"You are following Ahmed, 3-year-old boy in the clinic who is known case of recurrent attacks of pneumonia and otitis media since the 1st birthday. He had recent diagnose of X-linked agammaglobulinemia.\nOf the following, the MOST likely offending organism is","options":[{"letter":"A","text":"CMV"},{"letter":"B","text":"Streptococcus pneumonia"},{"letter":"C","text":"Pneumocystis jiroveci"},{"letter":"D","text":"Staphylococcus aureus"}],"correct":"B","why":"XLA (Bruton's) causes absent B cells/antibodies, leaving patients susceptible to recurrent infections with ENCAPSULATED bacteria (S. pneumoniae, H. influenzae) that normally require opsonizing antibody for clearance, as well as enteroviruses.","wrong":"A) CMV is controlled by T-cell immunity, which is intact in XLA. C) Pneumocystis jiroveci is a T-cell/cellular-immunity-related opportunist (seen in SCID, HIV, not primarily antibody deficiency). D) Staph aureus is more associated with phagocytic defects (e.g., CGD) than pure antibody deficiency.","note":""},{"id":71,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"SET-1","stem":"Abdullah is a 5-year-old boy presented with history of recurrent attack of secretary otitis media and purulent nasal discharge, Haemophilus influenza revealed by culture of ear discharge, on physical examination there is no tonsillar tissue and no palpable lymph nodes. Of the following, the MOST appropriate test to confirm the diagnosis is measurement of","options":[{"letter":"A","text":"flow cytometry"},{"letter":"B","text":"IgA concenteration"},{"letter":"C","text":"isohemagglutinins titer"},{"letter":"D","text":"IgG and IgM concenteration"}],"correct":"C","why":"Absent tonsillar tissue and lymph nodes points to an antibody deficiency (agammaglobulinemia — B cells and the lymphoid tissue they populate are absent/diminished). A functional test of antibody response — isohemagglutinin titers (naturally-occurring IgM antibodies against blood group antigens) — is used to confirm a functional humoral defect, in addition to quantitative immunoglobulins.","wrong":"A) Flow cytometry (for lymphocyte subsets) helps characterize which cell lines are missing but isn't the specific confirmatory functional test being tested here. B) Isolated IgA level wouldn't be the most specific confirmatory choice for a global antibody-response defect suggested by absent lymphoid tissue.","note":""},{"id":72,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"SET-1","stem":"Ali, 4-year-old boy presented to the paediatric emergency with high fever, decreased appetite, aphthous stomatitis, and cellulitis of the right calf muscle. His absolute neutrophil count (ANC) was 600/µL.\nThe MOST likely organisms causing this condition are","options":[{"letter":"A","text":"Staphylococcus aureus and Histoplasmosis"},{"letter":"B","text":"Staphylococcus aureus and Cytomegalovirus"},{"letter":"C","text":"Staphylococcus aureus and Pneumocystis carinii"},{"letter":"D","text":"Staphylococcus aureus and gram-negative bacteria"}],"correct":"D","why":"In a neutropenic patient, skin/soft-tissue infections (cellulitis) are most commonly caused by Staph aureus and gram-negative organisms (e.g., Pseudomonas, E. coli) — the standard organisms covered by empiric broad-spectrum febrile-neutropenia antibiotic regimens.","wrong":"B) CMV isn't a typical cause of cellulitis. C) Pneumocystis carinii (jiroveci) causes pneumonia in profoundly immunocompromised hosts, not cellulitis.","note":""},{"id":73,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"SET-1","stem":"A 9-year-old boy with acute lymphoblastic leukemia on chemotherapy, presented with fever, aphthous stomatitis, and fatigue for the last 5 days. His absolute neutrophil count (ANC) was 450/µL and hemoglobin level was 10gm/dl. The NEXT appropriate therapeutic measure is","options":[{"letter":"A","text":"transplantation of hematopoietic stem cells"},{"letter":"B","text":"administration of pulse methylprednisolone"},{"letter":"C","text":"aggressive use of broad-spectrum antibiotics"},{"letter":"D","text":"administration of recombinant human granulocyte colony-stimulating factor"}],"correct":"C","why":"Febrile neutropenia (fever + ANC <500) in an oncology patient is a medical emergency requiring immediate empiric broad-spectrum IV antibiotics (covering Pseudomonas) — delay increases mortality risk from unrecognized sepsis.","wrong":"A) Stem cell transplant is not an acute emergency intervention. B) Pulse steroids would further immunosuppress a febrile neutropenic patient — dangerous. D) G-CSF may be used adjunctively in some cases but is not the immediate NEXT step ahead of starting antibiotics.","note":""},{"id":74,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"2021","stem":"The most favorable prognosis for a patient with acute myeloid leukemia (AML)?\n(Note: only one option — \"Down syndrome\" — and no answer letter were preserved in the source document; the other options and the marked answer are missing from the original file.)","options":[{"letter":"A","text":"Down syndrome"}],"correct":"A","why":"Children with Down syndrome who develop AML (specifically acute megakaryoblastic leukemia, AML-M7) — particularly those diagnosed under age 4 — have a notably FAVORABLE prognosis compared to non-Down syndrome AML, with excellent event-free survival on reduced-intensity chemotherapy protocols. This is a well-recognized, frequently tested exception to the general rule that AML carries a worse prognosis than ALL in children.","wrong":"","note":"The original source document only preserved one answer choice ('a) Down syndrome') for this question, with no other options (b-e) or an explicit 'Answer:' line — it appears to be a formatting/scanning artifact from the source PDF. Based on standard board knowledge, Down syndrome-associated AML is indeed the classic 'favorable prognosis' answer for this exact question stem, so it's included here for completeness, but you may want to cross-check against a complete version of this exam if available."},{"id":75,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"2021","stem":"A 5-year-old boy appears with splenomegaly and paleness. CBC reveals hemoglobin 8, hematocrit 24, MCV 70, WBC count 7,600, polymorphs 55%, lymphocyte 45%, platelet 219000. Hemoglobin electrophoresis reveals hemoglobin A 20%, hemoglobin A2 8%, hemoglobin F 10%, and hemoglobin S 62%. Most likely diagnosis:","options":[{"letter":"A","text":"Sickle cell disease"},{"letter":"B","text":"Sickle cell trait"},{"letter":"C","text":"Sickle alpha thalassemia"},{"letter":"D","text":"Sickle beta thalassemia"},{"letter":"E","text":"Thalassemia major"}],"correct":"D","why":"Hemoglobin electrophoresis showing a MIX of Hemoglobin A (20%, i.e., SOME normal beta-globin production, ruling out pure sickle cell disease which is HbSS with NO HbA), HbS (62%, predominant), HbF, and elevated HbA2 (8%, a marker of beta-thalassemia trait/disease) together indicate sickle beta-thalassemia — a compound heterozygous state where one beta-globin gene has the sickle mutation and the other has a beta-thalassemia mutation (reduced but not absent normal beta-globin production explains the presence of some HbA).","wrong":"A) Sickle cell disease (HbSS) would show NO HbA (since both beta-globin alleles carry the sickle mutation) — the presence of 20% HbA here rules this out. B) Sickle cell trait (HbAS) would show MORE HbA than HbS (typically ~60% HbA, ~40% HbS), the opposite ratio from what's seen here (62% HbS dominant). C) Sickle-alpha-thalassemia would show a different electrophoresis pattern and wouldn't explain the elevated HbA2, which specifically reflects a BETA-globin gene abnormality. E) Beta-thalassemia major (homozygous beta-thal) would show absent or minimal HbA with predominant HbF, not this HbS-predominant pattern.","note":""},{"id":76,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"2021","stem":"A 3-year-old boy underwent a laparoscopic splenectomy 6 months ago to control hemolysis associated with hereditary spherocytosis.\nOf the following, this child's medical history MOST increases his risk for","options":[{"letter":"A","text":"HIV infection"},{"letter":"B","text":"parvovirus B19 infection"},{"letter":"C","text":"pneumococcal bacteremia"},{"letter":"D","text":"Pneumocystis jirovecii pneumonia"}],"correct":"C","why":"Splenectomy (or functional asplenia, as in sickle cell disease) dramatically increases the risk of overwhelming infection with ENCAPSULATED organisms — Streptococcus pneumoniae is the most significant risk (also Haemophilus influenzae type b and Neisseria meningitidis) — because the spleen is essential for clearing encapsulated bacteria via opsonization/phagocytosis. This is why post-splenectomy patients require pneumococcal (and other encapsulated-organism) vaccination and often prophylactic penicillin.","wrong":"A) HIV risk isn't affected by splenectomy status. B) Parvovirus B19 causes aplastic crisis specifically in patients with chronic hem
