olytic anemia (like hereditary spherocytosis) due to high red cell turnover, but this is NOT specifically increased by splenectomy itself. D) PCP pneumonia risk relates to T-cell/cellular immunodeficiency, not asplenia — asplenia specifically impairs humoral clearance of encapsulated bacteria.","note":""},{"id":77,"system":"immunology_hematology_oncology","systemName":"Immunology & Hematology-Oncology","source":"2021","stem":"A 2-year-old boy is seen for a health supervision visit. He has been well with normal growth and development. His mother expresses concern that he is a picky eater and does not eat much solid food. He still drinks from the bottle and has been consuming at least four 8-oz bottles of milk per day. The result of a finger-stick hemoglobin measurement is 8.6 g/dL (86 g/L). Additional laboratory tests are ordered.\nOf the following, the laboratory results MOST consistent with this presentation are (in terms of Mean Corpuscular Volume / Red Cell Distribution Width / Total Iron-Binding Capacity / Ferritin):","options":[{"letter":"A","text":"High MCV / Low RDW / Low TIBC / Normal Ferritin"},{"letter":"B","text":"Low MCV / High RDW / High TIBC / Low Ferritin"},{"letter":"C","text":"Low MCV / Normal RDW / Low TIBC / High Ferritin"},{"letter":"D","text":"Normal MCV / Low RDW / High TIBC / Low Ferritin"}],"correct":"B","why":"This is classic iron deficiency anemia from excessive cow's milk intake (>24oz/day) displacing iron-rich solid foods ('milk anemia') — a very common toddler presentation. Iron deficiency shows a MICROCYTIC (low MCV) anemia with HIGH red cell size variability (high RDW, reflecting a mixed population of normal and progressively smaller new red cells), HIGH TIBC (transferrin is upregulated when iron stores are low, increasing the blood's iron-binding capacity), and LOW ferritin (the most specific marker of depleted iron stores).","wrong":"A) High MCV would suggest macrocytic anemia (e.g., B12/folate deficiency), the opposite of iron deficiency's microcytosis. C) Low TIBC with high ferritin is the pattern of anemia of chronic disease/inflammation (where iron is sequestered but stores/ferritin are elevated as an acute phase reactant), not iron deficiency. D) Normal MCV with low RDW doesn't fit a developing microcytic, heterogeneous-cell-size iron deficiency picture.","note":""},{"id":78,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"SET-1","stem":"A 6-week-old infant is brought to your office by her parents. They report that the infant had blueness around the mouth after coughing. Rescue breaths were not required. The infant is now alert and pink without labored breathing. She has a 1-week history of clear rhinorrhoea and poor feeding. Her father has a cough, which is dry and spasmodic. The infant appears well and is not in acute distress. An intermittent dry cough is noted. Her RR is 30 breaths/min.\nWhich of the following is the MOST sensitive test to confirm the diagnosis?","options":[{"letter":"A","text":"Chest radiography"},{"letter":"B","text":"Culture from nasopharyngeal swab"},{"letter":"C","text":"Polymerase chain reaction from nasopharyngeal swab"},{"letter":"D","text":"Serologic testing"}],"correct":"C","why":"This is pertussis (whooping cough) — paroxysmal cough with cyanotic spells in an infant, exposure to an adult with a chronic cough. PCR of a nasopharyngeal specimen is now the most sensitive and rapid confirmatory test, especially useful later in the illness course when culture yield drops.","wrong":"A) Chest radiography is nonspecific. B) Culture is highly specific but has LOW sensitivity and is slow-growing (Bordetella pertussis is fastidious) — PCR outperforms it for sensitivity. D) Serology is used later in illness/for epidemiologic purposes, not as the most sensitive acute confirmatory test.","note":""},{"id":79,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"SET-1","stem":"Ali 6 years old child admitted to the surgical floor with diarrhoea, vomiting, fever, and abdominal pain for 2 days duration and high suggestion of Acute appendicitis however US abdomen and CT scan showed no acute appendicitis. You get consulted as you are the paediatrician on call to rule out other causes of acute appendicitis\nWhich of the following foodborne bacterial illness might present with Appendicitis-like symptoms:","options":[{"letter":"A","text":"Yersinia enterocolitica"},{"letter":"B","text":"Vibrio vulnificus"},{"letter":"C","text":"Shigella spp."},{"letter":"D","text":"Staphylococcus aureus"}],"correct":"A","why":"Yersinia enterocolitica classically causes mesenteric adenitis/terminal ileitis that mimics acute appendicitis clinically ('pseudoappendicitis') — a well-known board association.","wrong":"B) Vibrio vulnificus causes wound infections/septicemia (often from raw shellfish), not an appendicitis mimic. C) Shigella causes bloody dysentery/colitis, not a pseudoappendicitis picture. D) Staph aureus causes rapid-onset food poisoning (vomiting) from preformed toxin, not this picture.","note":""},{"id":80,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"SET-1","stem":"Ahmed 5 years old who is recovering from recent diarrheal illness presented today to the paediatric emergency with new onset of ascending weakness starting in his legs. The child admitted to the paediatric floor with high suspicion of Guillain-Barre syndrome.\nGuillain-Barré syndrome can be a sequel in which of the following foodborne bacterial illness:","options":[{"letter":"A","text":"Bacillus anthracis"},{"letter":"B","text":"Brucella abortus"},{"letter":"C","text":"Clostridium botulinum"},{"letter":"D","text":"Campylobacter jejuni"}],"correct":"D","why":"Campylobacter jejuni is the most well-established antecedent infection linked to GBS (molecular mimicry between bacterial lipo-oligosaccharides and peripheral nerve gangliosides).","wrong":"A) Bacillus anthracis isn't linked to GBS. B) Brucella causes a chronic febrile illness, not classically GBS. C) Clostridium botulinum causes a DESCENDING paralysis with a distinct toxin mechanism (pre-synaptic neuromuscular blockade), not GBS, and is an important mimicker/differential rather than a trigger.","note":""},{"id":81,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"SET-1","stem":"A 1-day-old male neonate is seen for routine postpartum care. He was born via spontaneous vaginal delivery at 38 weeks. The pregnancy, labor, and delivery were uncomplicated, although his mother has a history of untreated chronic hepatitis C virus infection. She has questions regarding the natural course of the hepatitis C virus in exposed infants and the steps for testing.\nWhich of the following is the MOST specific test to diagnose chronic hepatitis C virus infection in this neonate?","options":[{"letter":"A","text":"Hepatitis C antibody in 6 months"},{"letter":"B","text":"Hepatitis C antibody in 18 months"},{"letter":"C","text":"Hepatitis C ribonucleic acid level now"},{"letter":"D","text":"Hepatitis C ribonucleic acid level in 1 month"}],"correct":"C","why":"Maternal HCV antibody crosses the placenta and will be positive in essentially all exposed infants regardless of true infection, so antibody testing must wait until ~18 months (after maternal antibody clears) to be meaningful. HCV RNA (PCR) can detect true vertical transmission earlier, though guidelines recommend checking it at least after the first weeks-to-months of life (not literally at birth) to avoid detecting transient viremia — the key teaching point is RNA testing, not antibody, is used to establish infection before 18 months.","wrong":"A) Antibody at 6 months would still reflect passively-transferred maternal antibody in many uninfected infants. B) Antibody at 18 months is the correct test for confirming TRUE infection serologically, but is not the earliest/most specific method available — RNA testing can identify infection sooner.","note":""},{"id":82,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"SET-1","stem":"A 13-year-old girl with fevers, chills, and rigor for the last 2 weeks presents with the MRI findings of tibia osteomyelitis. She undergoes CT-guided biopsy and culture. Final cultures reveal methicillin-resistant staphylococcus aureus (MRSA). She becomes septic and is taken to the operating room for urgent surgical debridement. Which of the following is often associated with this diagnosis and requires close surveillance in the acute setting?","options":[{"letter":"A","text":"Septic arthritis"},{"letter":"B","text":"Gas gangrene"},{"letter":"C","text":"Squamous cell carcinoma"},{"letter":"D","text":"Marjolin's ulcer"},{"letter":"E","text":"Deep vein thrombosis (DVT)"}],"correct":"A","why":"Osteomyelitis, especially in children (where the metaphysis is close to the joint capsule in certain bones), commonly co-exists with or extends to contiguous septic arthritis, particularly with virulent organisms like MRSA — active surveillance for joint involvement is essential.","wrong":"B) Gas gangrene is a clostridial soft-tissue infection, not a typical osteomyelitis complication. C) Squamous cell carcinoma and D) Marjolin's ulcer are long-term complications of chronic non-healing wounds/sinus tracts (years later), not an acute surveillance concern. E) DVT can be a complication of severe MRSA osteomyelitis/sepsis but is less classically 'associated' compared to septic arthritis as the paired diagnosis.","note":""},{"id":83,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"SET-1","stem":"A boy received complete immunization against tetanus ten years ago. Now, he presents with a clean wound without any lacerations from an injury sustained 2.5 hours ago.\nWhat should he receive now?","options":[{"letter":"A","text":"Full course of tetanus toxoid"},{"letter":"B","text":"Single dose of tetanus toxoid"},{"letter":"C","text":"Human tetanus globulin"},{"letter":"D","text":"Human tetanus globulin and a single dose of toxoid."}],"correct":"B","why":"For a clean, minor wound, a booster (single dose Tdap/Td) is only needed if it has been ≥10 years since the last dose — here it has been exactly 10 years, meeting the threshold for a booster. Tetanus immune globulin is not needed for a clean wound regardless of immunization status.","wrong":"A) A full course isn't needed since he was previously fully immunized — only a booster. C/D) Tetanus immune globulin is reserved for dirty/high-risk wounds in UNDER- or non-immunized patients, not a clean wound in a fully immunized patient.","note":""},{"id":84,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"SET-1","stem":"A 3-year-old boy is seen for a 14-day history of intermittent, watery diarrhea without blood or mucus. The stools smell foul and appear greasy. He also has low-grade fever, anorexia, weight loss, and occasional bouts of abdominal pain and emesis. He attends daycare. He has not been exposed to pets or traveled internationally. No other family members have had diarrhea. The boy's temperature is 37 °C, and his vital signs are normal. His physical examination findings are significant, only of mild dehydration and abdominal distension.\nWhich of the following is the MOST likely cause of this boy's illness?","options":[{"letter":"A","text":"Campylobacter jejuni"},{"letter":"B","text":"Enterotoxigenic Escherichia coli"},{"letter":"C","text":"Giardia duodenalis"},{"letter":"D","text":"Rotavirus"}],"correct":"C","why":"Chronic (>2 week), greasy/foul-smelling, non-bloody diarrhea with weight loss in a daycare-attending child is classic for Giardia — a protozoan parasite causing malabsorptive diarrhea, common in daycare settings due to fecal-oral spread.","wrong":"A) Campylobacter typically causes acute, often bloody diarrhea, not this chronic greasy pattern. B) ETEC causes acute watery (traveler's-type) diarrhea, not a 14-day greasy course. D) Rotavirus causes acute, self-limited watery diarrhea (days, not 2 weeks) predominantly in infants/toddlers, not this chronic malabsorptive picture.","note":""},{"id":85,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"2021","stem":"A 5-year-old boy was brought to the ER with a history of cat bites on the face. The incident happened 2 hours ago while the child was playing with the cat at home. Physical examination reveals minor wounds on the face. Most common organism in cat-bite wounds:","options":[{"letter":"A","text":"P. multocida"},{"letter":"B","text":"Eikenella corrodens"},{"letter":"C","text":"S. aureus"},{"letter":"D","text":"S. epidermidis"},{"letter":"E","text":"S. moniliformis"}],"correct":"A","why":"Pasteurella multocida is the most common organism isolated from cat bite wounds (also common in dog bites), reflecting normal feline oral flora — it's notable for causing rapid-onset (within 24 hours), aggressive local cellulitis/infection.","wrong":"B) Eikenella corrodens is classically associated with human bite wounds ('fight bite'/clenched-fist injuries), not cat bites. C) S. aureus can be found in bite wounds generally but is not the MOST common organism specifically in cat bites — Pasteurella predominates. D) S. epidermidis is a skin commensal, not the predominant cat-bite pathogen. E) Streptobacillus moniliformis causes rat-bite fever, not typical cat bite infections.","note":""},{"id":86,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"2021","stem":"2 vaccines if not given together at the same visit should be 4 weeks apart?","options":[{"letter":"A","text":"Diphtheria and Hib"},{"letter":"B","text":"MMR and varicella"}],"correct":"B","why":"Live attenuated vaccines (like MMR and varicella) given on separate days (not the same visit) should be spaced at least 4 weeks apart, because closely-spaced live vaccines can result in interference with the immune response to the second vaccine. Inactivated vaccines (like DTaP/Hib) don't have this same live-virus interference concern and can generally be given at any interval relative to each other.","wrong":"A) Diphtheria/Hib containing vaccines are inactivated/subunit vaccines, not live vaccines, so they don't carry the same 4-week live-vaccine-interference spacing requirement.","note":""},{"id":87,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"2021","stem":"A female child appears in a clinic for a routine checkup. She developed a transient urticarial rash after the previous vaccination. She is due for the same vaccination. The next step in management:","options":[{"letter":"A","text":"Don't give vaccination"},{"letter":"B","text":"Give half of the vaccine"},{"letter":"C","text":"Vaccine should be given"},{"letter":"D","text":"Give three-fourth of the vaccine"},{"letter":"E","text":"Give antihistamine 30 minutes before vaccination"}],"correct":"C","why":"A TRANSIENT urticarial (hive) rash after a vaccine is generally considered a mild, non-anaphylactic reaction and is NOT a contraindication to future doses of the same vaccine — routine vaccination should proceed as scheduled. True contraindications requiring caution/avoidance are anaphylaxis or another severe allergic reaction to a prior dose or vaccine component.","wrong":"A) Withholding vaccination entirely is an overreaction to a mild, transient urticarial reaction, which isn't a contraindication. B/D) Giving a fractional dose isn't a recognized/validated practice for standard vaccination after a mild prior reaction — full-dose vaccination is appropriate. E) Premedication with antihistamine before vaccination is sometimes considered in select cases but isn't the standard universal 'next step' — the core correct answer is simply that vaccination should proceed as usual since this isn't a contraindication.","note":""},{"id":88,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"2021","stem":"A 6-year-old girl appears in the ER with an injury. She has a puncture wound with a dirty nail in her left foot. She received DTaP vaccination at 2m, 4m, 6m, and 15m of age. The next step in vaccination:","options":[{"letter":"A","text":"No vaccination"},{"letter":"B","text":"Give DT (pediatric strength)"},{"letter":"C","text":"Give DT (adult strength)"},{"letter":"D","text":"Give DTaP"},{"letter":"E","text":"Give DTP"}],"correct":"D","why":"For a tetanus-prone (dirty/contaminated) wound in a child with an INCOMPLETE primary series (only 4 doses at 2, 4, 6, 15 months — the 5th booster dose at 4-6 years is still due), the appropriate approach is to give a dose of the age-appropriate combination vaccine (DTaP, since she's under 7 years old) as both wound prophylaxis AND to advance her routine immunization schedule — TIG (tetanus immune globulin) isn't needed since she has had ≥3 prior tetanus-toxoid-containing doses.","wrong":"A) No vaccination is inappropriate — she's not fully immunized and has a tetanus-prone wound. B/C) Plain DT (without pertussis) is used only when pertussis vaccine is contraindicated — DTaP is preferred here since there's no such contraindication and she needs the pertussis component too as part of her routine series. E) DTP (whole-cell pertussis) is an older formulation no longer used in current practice — DTaP (acellular) is standard.","note":""},{"id":89,"system":"infectious_diseases_immunizations","systemName":"Infectious Diseases & Immunizations","source":"2021","stem":"A 6-month-old unimmunized female infant is brought to the emergency department in January with a 6-hour history of fever, vomiting, and watery, foul-smelling nonbloody diarrhea. One month before presentation, she and her parents arrived in the United States with refugee status from Syria. There is no history of sick contacts. On physical examination, her temperature is 39°C with a heart rate of 130 beats/min, respiratory rate of 54 breaths/min, and a blood pressure of 75/50 mm Hg. She appears severely dehydrated, with dry mucous membranes and a capillary refill time of about 3 seconds. Stool examination is negative for occult blood.\nOf the following, the MOST likely pathogen causing this infant's illness is","options":[{"letter":"A","text":"Giardia lamblia"},{"letter":"B","text":"norovirus"},{"letter":"C","text":"rotavirus"},{"letter":"D","text":"Salmonella typhi"}],"correct":"C","why":"Rotavirus is the classic cause of acute watery, non-bloody, foul-smelling diarrhea with vomiting and fever in an UNIMMUNIZED young child (rotavirus vaccine dramatically reduces this in vaccinated populations), especially in winter months (January, the classic 'rotavirus season' in temperate climates) — this unimmunized refugee infant fits the highest-risk demographic for severe rotavirus gastroenteritis.","wrong":"A) Giardia causes a more CHRONIC, greasy/malabsorptive diarrhea pattern, not this acute severe presentation. B) Norovirus can cause acute gastroenteritis too but is less classically tied to this specific 'unimmunized, winter, severely dehydrating' vignette that points to rotavirus. D) Salmonella typhi causes enteric (typhoid) fever with a more prolonged febrile illness and different GI pattern (often constipation early, and it's not typically the 'most likely' cause of acute watery diarrhea in this classic vignette).","note":""},{"id":90,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A 16-year-old girl was admitted to the surgical team with abdominal pains, which had worsened over the last week. She has a past medical history of chronic aches in the limbs, for which she takes ibuprofen intermittently.\nWhich of the following makes Crohn's disease the MOST likely diagnosis?","options":[{"letter":"A","text":"Bright red blood per rectum and family history of inflammatory bowel disease"},{"letter":"B","text":"Patchy rectal erythema on proctoscopy"},{"letter":"C","text":"Small bowel strictures on CT abdomen"},{"letter":"D","text":"Terminal ileal ulceration at colonoscopy"}],"correct":"C","why":"Crohn's disease is transmural and can affect any part of the GI tract (including the small bowel), leading to strictures — a finding essentially never seen in ulcerative colitis, which is limited to the colon/rectum with continuous, superficial (mucosal) inflammation.","wrong":"A) Bright red blood per rectum + family history is nonspecific and can occur in either UC or Crohn's. B) Patchy rectal erythema on proctoscopy could be seen in either. D) Terminal ileal ulceration is suggestive of Crohn's too, but small bowel STRICTURES (a transmural, fibrotic complication) are the more specific/diagnostic Crohn's-defining feature among the choices.","note":""},{"id":91,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"You are preparing a presentation about liver disorders among children, in the discussion with your consultant the point of transplant of liver had raised up.\nOf the following the MOST common indication for liver transplantation in children is:","options":[{"letter":"A","text":"Alagille syndrome"},{"letter":"B","text":"Wilson disease"},{"letter":"C","text":"Hepatocellular carcinoma"},{"letter":"D","text":"Biliary atresia"}],"correct":"D","why":"Biliary atresia is the single most common indication for liver transplantation in children worldwide, typically after a failed or unsuccessful Kasai portoenterostomy.","wrong":"A) Alagille syndrome can lead to transplant but is far less common as an indication than biliary atresia. B) Wilson disease is a more common cause of transplant in older children/adolescents but overall less frequent than biliary atresia. C) Hepatocellular carcinoma is a rare indication in children overall.","note":""},{"id":92,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"In the round in NICU you are evaluating a premature baby of 30 weeks gestation who is currently on Total parenteral nutrition (TPN). While your are presenting the plan of care for the baby discussion was started to monitor the baby for the complication of TPN as it can cause a variety of liver diseases.\nOf the following, the MOST severe complication is","options":[{"letter":"A","text":"Hepatic steatosis"},{"letter":"B","text":"Gallbladder damage"},{"letter":"C","text":"Cholestasis"},{"letter":"D","text":"Sclerosing cholangitis"}],"correct":"C","why":"TPN-associated cholestasis is the most clinically significant and common hepatobiliary complication of prolonged parenteral nutrition in neonates, and can progress to fibrosis/cirrhosis if unrecognized — hence it's the key complication actively monitored via serial direct bilirubin.","wrong":"A) Hepatic steatosis can occur but is generally less severe/progressive than cholestasis in this population. B) Gallbladder damage isn't the primary TPN-liver complication tracked. D) Sclerosing cholangitis is a rare, late complication, not the most common/severe one to monitor for.","note":""},{"id":93,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"In the clinic mother of Aisha 9 years old child who had recent diagnose inflammatory bowel disease (IBD), you are discussing with the mother all the complication and association for this diseases, the mother raised a concern about liver disorders with IBD.\nYou told her that the MOST common hepatobiliary disease associated with IBD is:","options":[{"letter":"A","text":"Hepatic abscess"},{"letter":"B","text":"Portal vein thrombosis"},{"letter":"C","text":"Sclerosing cholangitis"},{"letter":"D","text":"Autoimmune hepatitis"}],"correct":"C","why":"PSC is the classic hepatobiliary extra-intestinal manifestation strongly linked to IBD (especially ulcerative colitis) — this well-known association is frequently tested.","wrong":"A) Hepatic abscess isn't a typical IBD-associated hepatobiliary finding. B) Portal vein thrombosis can be a hypercoagulability-related complication of IBD, but isn't the classic 'hepatobiliary disease' association. D) Autoimmune hepatitis can overlap with PSC but is less classically 'the' IBD-hepatobiliary association compared to PSC itself.","note":""},{"id":94,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A term new born of 10 days old notice to have yellowish discoloration of the skin and sclera, in which that was present since birth and increasing every day, in the paediatric emergency found to have unconjugated hyperbilirubinemia with a level of 22 mg/dl with absence of haemolysis in laboratory finding , the baby placed on triple phototherapy.\nThe most possible diagnose of persistent unconjugated hyperbilirubinemia at levels >20 mg/dL after the 1st wk of life in the absence of haemolysis is:","options":[{"letter":"A","text":"Galactosemia"},{"letter":"B","text":"Crigler-Najjar type I"},{"letter":"C","text":"α1-Antitrypsin deficiency"},{"letter":"D","text":"Tyrosinemia"}],"correct":"B","why":"Severe, persistent UNCONJUGATED hyperbilirubinemia without hemolysis, present since birth and refractory/poorly responsive to phototherapy, points to a primary defect in bilirubin conjugation — Crigler-Najjar type I (complete absence of UGT1A1 activity) is the classic severe form.","wrong":"A) Galactosemia causes CONJUGATED (mixed) hyperbilirubinemia with liver dysfunction, not isolated unconjugated hyperbilirubinemia. C) Alpha-1-antitrypsin deficiency causes conjugated hyperbilirubinemia/cholestasis, not this pattern. D) Tyrosinemia also causes conjugated hyperbilirubinemia/liver failure, not isolated unconjugated hyperbilirubinemia.","note":""},{"id":95,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A father of 6 and 9 years old children brought them to you in the clinic as he is very concern that recently he get diagnose with polyps in the colon and he will have operation to remove it. He want to screen his kids from now as he was told by his physician that his polyps is carcinogenic.\nYou are discussing with him that the risk of colon cancer is 100% in the following condition:","options":[{"letter":"A","text":"Peutz-Jeghers syndrome"},{"letter":"B","text":"Cowden syndrome"},{"letter":"C","text":"Gardner syndrome"},{"letter":"D","text":"Juvenile polyposis"}],"correct":"C","why":"Gardner syndrome is a variant of familial adenomatous polyposis (FAP) — untreated, colon cancer risk approaches 100% by adulthood, which is why prophylactic colectomy is recommended once polyposis is confirmed.","wrong":"A) Peutz-Jeghers syndrome increases cancer risk (GI and non-GI) but not to a near-100% certainty specifically for colon cancer. B) Cowden syndrome increases risk of several cancers (breast, thyroid, endometrial) but colon cancer risk isn't near-100%. D) Juvenile polyposis carries increased colon cancer risk but, again, not the near-certain 100% risk specific to FAP/Gardner.","note":""},{"id":96,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A 2-year-old child is evaluated 18 months after an unsuccessful portoenterostomy (Kasai procedure) to treat extrahepatic biliary atresia. He is jaundiced and has signs of cirrhosis and portal hypertension. In addition, he is not walking well, has an ataxic gait, and shows no deep tendon reflexes. He has received inadequate medical care and no nutritional supplementation.\nWhat is the MOST likely diagnosis?","options":[{"letter":"A","text":"Vitamin A deficiency"},{"letter":"B","text":"Vitamin B12 deficiency"},{"letter":"C","text":"Vitamin D deficiency"},{"letter":"D","text":"Vitamin E deficiency"}],"correct":"D","why":"Chronic cholestasis impairs fat-soluble vitamin (A, D, E, K) absorption. Ataxia + areflexia (a peripheral neuropathy/posterior column picture) is the classic neurologic presentation of vitamin E deficiency specifically, distinguishing it from the other fat-soluble vitamin deficiencies.","wrong":"A) Vitamin A deficiency causes night blindness/xerophthalmia, not ataxia/areflexia. B) Vitamin B12 deficiency isn't a fat-soluble vitamin affected by cholestasis in the same way, and this pattern is a distractor. C) Vitamin D deficiency causes rickets/bone disease, not this neurologic picture.","note":""},{"id":97,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A 7-year-old is noted to have mild icterus. On examination, he is found to have moderate splenomegaly. Investigations reveal a conjugated hyperbilirubinemia. There are normal AST, ALT, albumin, and alkaline phosphatase levels. Tests on the urine show an elevated total coproporphyrin excretion of 5 times the normal level, with 25% being coproporphyrin I. A liver biopsy is normal.\nWhat is the MOST likely diagnosis?","options":[{"letter":"A","text":"Hepatitis A"},{"letter":"B","text":"Rotor's Syndrome"},{"letter":"C","text":"Gilbert's Syndrome"},{"letter":"D","text":"Hemochromatosis"}],"correct":"B","why":"Rotor syndrome causes conjugated hyperbilirubinemia with otherwise entirely normal liver function tests/histology, and a specific urine coproporphyrin pattern (elevated TOTAL coproporphyrin, but with coproporphyrin I making up roughly 65% or less rather than being markedly skewed) — distinguishing it from Dubin-Johnson syndrome (which has a DIFFERENT coproporphyrin I fraction pattern, ~80%+, and a black/pigmented liver on biopsy).","wrong":"A) Hepatitis A would show elevated transaminases, not normal LFTs. C) Gilbert syndrome causes UNconjugated (not conjugated) hyperbilirubinemia. D) Hemochromatosis causes iron overload with abnormal liver histology/enzymes, not a normal biopsy with normal LFTs.","note":""},{"id":98,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A full-term infant is seen at four weeks of age. The parents report that the baby has been feeding well, but urine appears dark, and stools are pale. On examination, the infant weighs 3.8 kg (birthweight was 3,500 grams), and vital signs are normal. The baby is noted to be jaundiced and has hepatomegaly. No other abnormalities are detected on systemic examination. The total bilirubin level is 140 mmol/L with a direct bilirubin concentration of 45 mmol/L.\nWhat is the MOST LIKELY diagnosis?","options":[{"letter":"A","text":"CMV infection"},{"letter":"B","text":"Biliary atresia"},{"letter":"C","text":"Alagille syndrome"},{"letter":"D","text":"Idiopathic neonatal hepatitis"}],"correct":"B","why":"Pale (acholic) stools + dark urine + conjugated hyperbilirubinemia + hepatomegaly in a young infant is the classic biliary atresia presentation — early recognition is critical since outcomes with Kasai portoenterostomy are time-sensitive (best if done before 6-8 weeks of age).","wrong":"A) CMV hepatitis can cause conjugated jaundice but wouldn't be the 'most likely' single diagnosis given this classic presentation pattern (pale stools specifically indicate biliary obstruction). C) Alagille syndrome also causes cholestasis but is less common and usually has other syndromic features (facial features, heart disease, vertebral anomalies) not mentioned here. D) Idiopathic neonatal hepatitis is a diagnosis of exclusion after biliary atresia and other causes are ruled out.","note":""},{"id":99,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A 15-year-old girl who has Crohn's disease has had poor appetite and chronic diarrhea despite her medical treatment. In evaluating her nutritional state, you document a low plasma zinc concentration and initiate zinc supplementation. Of the following, a TRUE statement about zinc supplementation is that it:","options":[{"letter":"A","text":"Inhibits the absorption of dietary copper"},{"letter":"B","text":"Decreases serum alkaline phosphatase values"},{"letter":"C","text":"Impairs wound healing"},{"letter":"D","text":"Should be given with dairy products"}],"correct":"A","why":"High-dose zinc supplementation competes with and inhibits intestinal copper absorption (both use metallothionein-mediated pathways) — a well-recognized interaction requiring monitoring of copper status with prolonged zinc therapy.","wrong":"B) Zinc doesn't decrease alkaline phosphatase — in fact alk phos is a zinc-dependent enzyme, so deficiency (not supplementation) LOWERS alk phos. C) Zinc actually PROMOTES wound healing (a classic zinc function), it doesn't impair it. D) There's no specific requirement to give zinc with dairy; in fact, phytates/certain minerals in some foods can reduce zinc absorption.","note":""},{"id":100,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A 4-week-old boy, a product of vaginal delivery at term, presented with severe watery diarrhea soon after birth. This is the first baby for the parents, who are first-degree cousins. The pregnancy was complicated by polyhydramnios. The baby looked sick and dehydrated. His stool workup was negative for infectious agents and reducing substances. His blood gas showed metabolic alkalosis. Diarrhea persisted despite fasting.\nWhat is the MOST likely diagnosis?","options":[{"letter":"A","text":"Autoimmune enteropathy"},{"letter":"B","text":"Primary lactase deficiency"},{"letter":"C","text":"Glucose-Galactose malabsorption"},{"letter":"D","text":"Chloride losing diarrhea"}],"correct":"D","why":"Congenital chloride diarrhea is an autosomal recessive intestinal chloride/bicarbonate transporter defect causing massive secretory (persists despite fasting) watery diarrhea from birth, with prenatal polyhydramnios (from in-utero diarrhea) and metabolic alkalosis with hypochloremia — a very classic triad/tetrad.","wrong":"A) Autoimmune enteropathy usually presents somewhat later and isn't linked to polyhydramnios/consanguinity in this classic way. B) Primary lactase deficiency would improve with fasting/formula change, not persist despite fasting. C) Glucose-galactose malabsorption would also improve with fasting and doesn't cause polyhydramnios/alkalosis in this classic pattern.","note":""},{"id":101,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A 5-year-old boy has a history of chronic recurrent abdominal pain and emesis. A diagnosis of cyclic vomiting was made at three years of age. Therapy with antimigraine medications was unsuccessful. He now presents with bile-stained emesis, a tender distended abdomen, and bright red blood per rectum.\nWhat is the MOST likely diagnosis?","options":[{"letter":"A","text":"Stress ulcers"},{"letter":"B","text":"Malrotation"},{"letter":"C","text":"Superior mesenteric artery syndrome"},{"letter":"D","text":"Meconium ileus equivalent"}],"correct":"B","why":"Bilious vomiting plus a tender, distended abdomen and bloody stool are red flags for midgut volvulus complicating malrotation — a surgical emergency (bowel ischemia) that can occur at any age, not just in neonates, and must be actively excluded even in a child with a longstanding 'cyclic vomiting' label.","wrong":"A) Stress ulcers can cause GI bleeding but wouldn't typically cause bilious emesis with a tender distended abdomen. C) SMA syndrome causes bilious vomiting but typically in a thin/cachectic patient after rapid weight loss, and doesn't typically cause bloody stools/distension to this degree. D) Meconium ileus equivalent (DIOS) occurs in CF patients, not stated here, and wouldn't cause bloody stools.","note":""},{"id":102,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"SET-1","stem":"A 9-year-old boy who has cystic fibrosis presents with abdominal pain, nausea and vomiting. He had two small bowel motions per week over the past few weeks. The dose of oral pancreatic enzymes has been increased recently. On physical examination, he appears uncomfortable and has moderate abdominal distention with a palpable right-sided abdominal mass.\nWhat is the MOST likely cause of his symptoms?","options":[{"letter":"A","text":"Appendicular abscess"},{"letter":"B","text":"Mesenteric lymphadenitis"},{"letter":"C","text":"Distal intestinal obstruction syndrome"},{"letter":"D","text":"Fibrosing colonopathy"}],"correct":"C","why":"DIOS (the 'meconium ileus equivalent' in older CF patients) presents with a palpable right lower quadrant fecal mass, abdominal pain/distension, and reduced bowel movements due to thick, obstructing fecal material in the terminal ileum/cecum — very characteristic of CF patients.","wrong":"A) Appendiceal abscess wouldn't classically follow a change in enzyme dosing or present as a chronic, several-week pattern in a CF patient this way. B) Mesenteric lymphadenitis doesn't cause a palpable fecal mass or reduced stooling pattern. D) Fibrosing colonopathy is linked to VERY high-dose pancreatic enzyme use causing colonic strictures — a different, rarer entity than the more classic DIOS picture described here.","note":""},{"id":103,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"2021","stem":"A 2-year-old girl was brought to the ER with history of vomiting and diarrhea for the last 24 hours. The mother denies any history of fever. The girl was admitted 4 times in the last 6 months for gastroenteritis. The girl is admitted to the pediatric floor. She vomited once after admission. Mother notified the nurse. She stayed with her the whole night. She vomited again after several hours. She had no more episodes of diarrhea. The next day, mother went home. The girl had no more vomiting and diarrhea. Mother returned in the evening. A few hours later, the girl started to vomit again. Most likely diagnosis:","options":[{"letter":"A","text":"Child abuse"},{"letter":"B","text":"Viral gastroenteritis"},{"letter":"C","text":"Munchausen by proxy syndrome"},{"letter":"D","text":"Gastroesophageal reflux"},{"letter":"E","text":"Intestinal obstruction"}],"correct":"C","why":"The critical pattern here is that symptoms (vomiting) consistently occur ONLY in the mother's presence/after her arrival, and RESOLVE when she is absent — a classic red flag for factitious disorder imposed on another (Munchausen syndrome by proxy / medical child abuse), where a caregiver fabricates or induces illness in a child, often to gain medical attention/sympathy. The pattern of recurrent unexplained hospitalizations for the same symptom cluster (4 admissions in 6 months) further supports this.","wrong":"A) 'Child abuse' as a general category is too vague — the specific pattern described (symptoms tied to caregiver presence) makes Munchausen by proxy the more precise/complete answer. B) Viral gastroenteritis wouldn't explain symptoms occurring specifically only when the mother is present and NOT when she's absent overnight. D) GERD wouldn't correlate temporally with a specific caregiver's presence. E) Intestinal obstruction would cause a more continuous/progressive symptom pattern, not one that comes and goes based on who's in the room.","note":""},{"id":104,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"2021","stem":"A 12-month-old girl appears with a loss of weight and repeated regurgitation of food for the last 3 months. She has no nausea, diarrhea and fever. Mother appears depressed due to a separation from her husband 4 months ago. She is unemployed. The girl does not cry prior to regurgitation episodes. She lost 24 oz over the last 3 months. Physical examination reveals a normal development, weight less than 5th percentile, height is 25th percentile, and head circumference is 50th percentile. She was fine prior to this episode. Most likely diagnosis:","options":[{"letter":"A","text":"Rumination"},{"letter":"B","text":"Gastroesophageal reflux"},{"letter":"C","text":"Diaphragmatic hernia"},{"letter":"D","text":"Upper intestinal obstruction"},{"letter":"E","text":"Peptic ulcer"}],"correct":"A","why":"Rumination syndrome involves effortless, repeated regurgitation of recently ingested food WITHOUT preceding nausea/retching ('does not cry prior to regurgitation'), often in the context of a disrupted caregiver-infant relationship/psychosocial stress (here, maternal depression/separation, unemployment) — a classic association with rumination disorder in infancy, which is a self-stimulatory/self-soothing behavior in the absence of an organic cause.","wrong":"B) GERD would typically be associated with more distress/crying/discomfort around episodes, not this effortless, non-distressed pattern. C) Diaphragmatic hernia would have presented earlier in infancy (often at birth or with acute respiratory symptoms), not as a new 3-month history in a previously well 12-month-old. D) Upper intestinal obstruction would cause bilious/forceful vomiting with more acute distress, not a chronic, non-distressed regurgitation pattern. E) Peptic ulcer disease is uncommon at this age and would typically cause pain/distress, not painless regurgitation.","note":""},{"id":105,"system":"gastroenterology_hepatology","systemName":"Gastroenterology & Hepatology","source":"2021","stem":"A 5-year-old girl with no significant medical history is brought to the emergency department with a 2-day history of watery diarrhea mixed with specks of blood, abdominal cramping, and emesis. She was recently hospitalized for cellulitis, and is currently on day 12 of a 14-day course of clindamycin. The girl's temperature is 39°C, and her vital signs are normal. Her physical examination findings are only notable for resolving cellulitis and evidence of moderate dehydration. Laboratory data are significant for a white blood cell count of 28,000/μL (28 × 10^9/L) and serum albumin of 2.3 g/dL (23 g/L). She is admitted to the hospital for treatment.\nOf the following, the MOST appropriate antimicrobial agent to treat this girl's illness is","options":[{"letter":"A","text":"intravenous vancomycin"},{"letter":"B","text":"intravenous metronidazole"},{"letter":"C","text":"oral metronidazole"},{"letter":"D","text":"oral vancomycin"}],"correct":"D","why":"This is Clostridioides difficile colitis (antibiotic-associated diarrhea — here from prolonged clindamycin — with bloody mucousy diarrhea, elevated WBC, hypoalbuminemia suggesting a protein-losing enteropathy/colitis). Current guidelines favor ORAL vancomycin (or fidaxomicin) as first-line therapy for C. diff infection, especially in a more significant/severe presentation like this one (marked leukocytosis, hypoalbuminemia suggesting more severe colitis) — oral vancomycin acts locally within the gut lumen where the infection is, achieving high intraluminal concentrations.","wrong":"A) IV vancomycin does NOT achieve adequate concentrations within the GI lumen (it's not excreted into the bowel in useful amounts), so it's NOT effective for treating C. diff colitis. B) IV metronidazole is also not preferred — while metronidazole has some enterohepatic recycling providing some luminal drug, current guidelines have moved away from metronidazole as first-line given inferior efficacy, especially for more severe disease. C) Oral metronidazole was previously used but current guidelines now favor oral vancomycin (or fidaxomicin) as first-line, particularly for a case with this many severity markers (WBC 28,000; albumin 2.3).","note":""},{"id":106,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"SET-1","stem":"A 5-year-old boy is admitted for an asthma attack. Intravenous D5 water is started in the left hand. A blood electrolyte specimen is drawn from the left forearm. Lab results reveal Na 123mmol/L K 4mmol/L, Cl 106, glucose 700 mg/Dl(38.8 mmol/L), BUN 10mmol/L, and creatinine 0.7 mmol/L. Urine specific gravity 1017.\nWhat is the next step in management?","options":[{"letter":"A","text":"Correct hyponatremia in 24 hours"},{"letter":"B","text":"Correct hyponatremia over 48 hours"},{"letter":"C","text":"Draw another specimen from his right hand"},{"letter":"D","text":"Restrict intravenous fluid"}],"correct":"C","why":"Drawing electrolytes from a limb that has an IV infusion running (especially proximal/same limb) risks contamination/dilution artifact, producing a falsely low sodium. The correct next step is to redraw from an uncontaminated site before acting on the result.","wrong":"A/B) Treating a possibly spurious lab value by 'correcting hyponatremia' over any timeframe risks harm from unnecessary/incorrect fluid management based on inaccurate data. D) Restricting IV fluid is premature without confirming the sodium value is real.","note":""},{"id":107,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"SET-1","stem":"A 12-year-old girl complained of cramping in both her hands. She denies any vomiting and any medication intake. Her BP is 108/62 mmHg, with no edema or rash. Lab. test reveals Na 136 mmol/L, K 3.1 mmol/L, Cl 96 mmol/L, HCO3 is 30 mmol/L, Ca 2.4 mmol/L and serum Mg of 0.56 mmol/L. The urine Ca/creat ratio is normal.\nWhich ONE of the following is the MOST likely cause of this condition?","options":[{"letter":"A","text":"Fanconi syndrome"},{"letter":"B","text":"Gitelman's syndrome"},{"letter":"C","text":"Diuretic used"},{"letter":"D","text":"Bartter's syndrome"}],"correct":"B","why":"Gitelman syndrome (defect in the distal convoluted tubule NaCl cotransporter, mimicking thiazide use) causes hypokalemic metabolic alkalosis with HYPOMAGNESEMIA and, critically, HYPOCALCIURIA (normal/low urine calcium) — this distinguishes it from Bartter syndrome, which causes hypercalciuria.","wrong":"A) Fanconi syndrome causes a proximal tubulopathy with glucosuria/phosphaturia/aminoaciduria and typically metabolic ACIDOSIS, not alkalosis. C) Diuretic use is a differential but not confirmed/stated here, and the normal urine Ca/creat ratio specifically supports Gitelman over a Bartter-type picture. D) Bartter syndrome presents similarly but with HYPERcalciuria (elevated urine Ca/creat ratio), which is explicitly normal here, arguing against it.","note":""},{"id":108,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"SET-1","stem":"A seven-year-old girl with chronic renal failure decided to have an emergency surgical operation, but she had prolonged bleeding time.\nWhich of the following causes is responsible for that?","options":[{"letter":"A","text":"Hypoalbuminemia"},{"letter":"B","text":"Liver dysfunction"},{"letter":"C","text":"Thrombocytopenia"},{"letter":"D","text":"Uremic toxins"}],"correct":"D","why":"Uremia causes a well-described qualitative PLATELET FUNCTION defect (impaired platelet adhesion/aggregation due to circulating uremic toxins), producing a prolonged bleeding time despite a normal platelet COUNT — this is the classic mechanism of uremic bleeding diathesis.","wrong":"A) Hypoalbuminemia doesn't directly cause a bleeding tendency. B) Liver dysfunction can cause coagulopathy but isn't the primary driver in isolated CKD. C) Thrombocytopenia (low platelet count) isn't the mechanism in uremic bleeding — the platelet COUNT is typically normal; it's platelet FUNCTION that's impaired.","note":""},{"id":109,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"SET-1","stem":"A 6-month-old boy came to your clinic for evaluation of significant proteinuria (+3); you found that he has genital anomalies and an abnormal eye exam.\nWhich of the following statements is correct in this condition?","options":[{"letter":"A","text":"He is at very high risk for Wilms tumor"},{"letter":"B","text":"Kidney biopsy will show focal segmental glomerulosclerosis"},{"letter":"C","text":"It is an X-linked disorder"},{"letter":"D","text":"He is at high risk for brain tumor"}],"correct":"D","why":"Genital anomalies (ambiguous genitalia/DSD) + nephropathy + eye findings suggests a syndromic constellation — most consistent with a WT1-related disorder or overlapping syndrome with CNS tumor association among the listed choices; the exam's key specifically flags brain tumor risk as the correct association for this combination (distinguishing it from Denys-Drash/WAGR, which is classically linked to WILMS tumor via genital anomalies + nephropathy, but eye findings plus this specific combination in the question points the exam toward the CNS tumor option as marked).","wrong":"A) Wilms tumor risk is the 'expected' association with genital anomalies + nephropathy (as in Denys-Drash/WAGR syndromes) and is a very reasonable competing answer, but the addition of an ABNORMAL EYE EXAM shifts the exam's intended answer toward the syndromic combination with CNS tumor risk rather than isolated Wilms risk. B) FSGS is the classic renal biopsy finding in Denys-Drash syndrome, but is a histology description, not a risk statement about this triad. C) An X-linked inheritance pattern isn't specifically implied by this combination of findings.","note":"This question's answer key selection is somewhat atypical — if this pattern (genital anomaly + nephropathy + eye finding) appears again on your exam, also keep Denys-Drash/WAGR (Wilms, Aniridia, GU anomalies, Retardation) in mind, since aniridia is the 'eye finding' most classically linked with WAGR and Wilms tumor risk."},{"id":110,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"SET-1","stem":"A 6-year-old boy diagnosed with idiopathic nephrotic syndrome received prednisolone for four weeks but no response.\nWhich of the following is the best approach?","options":[{"letter":"A","text":"Give another four weeks of prednisolone and see the response"},{"letter":"B","text":"Add ACE inhibitors"},{"letter":"C","text":"Keep on long-term I.V albumin therapy"},{"letter":"D","text":"Send genetic studies and do kidney biopsy"}],"correct":"D","why":"Steroid-RESISTANT nephrotic syndrome (no remission after an adequate steroid trial) requires further work-up — kidney biopsy (to determine histology, e.g., FSGS/MCD) and genetic testing (for podocyte gene mutations, which predict poor steroid response and guide management/transplant planning), rather than simply continuing or escalating steroids blindly.","wrong":"A) Continuing another identical course of steroids in a truly steroid-resistant patient is unlikely to help and delays proper diagnosis. B) ACE inhibitors are adjunctive for proteinuria reduction but aren't the definitive NEXT diagnostic step. C) Long-term IV albumin isn't standard/definitive management and doesn't address the underlying cause.","note":""},{"id":111,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"SET-1","stem":"Urinalysis obtained during a health supervision visit of a 10-year-old boy reveals 2+ protein. The remainder of the urinalysis is normal. Family and personal medical histories, as well as physical examination of the boy, are negative.\nWhich of the following is the BEST NEXT STEP in the management?","options":[{"letter":"A","text":"Arrange consultation with a nephrologist"},{"letter":"B","text":"Obtain a 24-hour urine sample for protein quantification"},{"letter":"C","text":"Obtain renal ultrasonography"},{"letter":"D","text":"Perform a urinalysis on the first-morning void"}],"correct":"D","why":"The most common cause of isolated proteinuria found on a random daytime specimen in an otherwise healthy child is orthostatic (postural) proteinuria — a benign condition where protein excretion is normal when supine (first morning void) but elevated with upright posture during the day. Testing a first-morning void is the simplest way to confirm/exclude this benign diagnosis before pursuing more invasive work-up.","wrong":"A) Nephrology referral is premature before basic confirmatory testing. B) 24-hour urine protein quantification is a reasonable next step but is more cumbersome than simply checking a first-morning sample first, which can resolve the question more simply. C) Renal ultrasound isn't the first step for isolated asymptomatic proteinuria without other red flags.","note":""},{"id":112,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"SET-1","stem":"A 7-year-old female presented with bloody urine and high serum creatinine. She is known to have chronic sinusitis. She was intubated because of severe pulmonary edema. During intubation, she was found to have subglottic stenosis.\nWhich of the following tests is likely to be positive?","options":[{"letter":"A","text":"C-ANCA"},{"letter":"B","text":"Alport syndrome gene"},{"letter":"C","text":"Anti-GBM antibodies"},{"letter":"D","text":"ANA"}],"correct":"A","why":"The combination of chronic sinusitis (upper airway), pulmonary involvement, subglottic stenosis, and glomerulonephritis (hematuria/renal failure) is the classic triad of granulomatosis with polyangiitis (GPA, formerly Wegener's) — strongly associated with c-ANCA (anti-PR3) positivity.","wrong":"B) Alport syndrome causes hematuria + sensorineural hearing loss + eye findings, not sinusitis/subglottic stenosis/pulmonary disease. C) Anti-GBM antibodies (Goodpasture) cause pulmonary-renal syndrome but not sinusitis/subglottic stenosis specifically — that's more GPA-specific. D) ANA is nonspecific and not the classic marker for this triad.","note":""},{"id":113,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"2021","stem":"A 7-year-old boy is seen for evaluation of swelling over his eyelids for 10 days. His mother reports that the swelling is more prominent upon waking and gradually improves throughout the day. The boy had an upper respiratory tract infection 2 weeks ago. He has a history of mild intermittent asthma. He has a heart rate of 82 beats/min, respiratory rate of 16 breaths/min, and blood pressure of 105/62 mm Hg. He has periorbital edema and pitting edema of ankles. His chest is clear to auscultation. The rest of the physical examination findings are unremarkable. Laboratory data from spot urinalysis with microscopy: pH 6.5, Specific gravity 1.030, Leukocyte esterase Negative, Nitrite Negative, Blood +1, Protein +3, Red blood cells 5-10/HPF, White blood cells <5/HPF.\nOf the following, the BEST next step in evaluation of this patient is","options":[{"letter":"A","text":"24-hour urine collection for protein"},{"letter":"B","text":"renal function test, serum albumin, and complement levels"},{"letter":"C","text":"renal ultrasonography with Doppler"},{"letter":"D","text":"repeat urinalysis 1 week after a trial of diphenhydramine"}],"correct":"B","why":"Periorbital + ankle edema, hematuria (blood +1, 5-10 RBC/HPF) AND significant proteinuria (+3), occurring 2 weeks after a URI, raises concern for either post-infectious glomerulonephritis or another glomerular process. The appropriate initial evaluation includes assessing renal function (creatinine/BUN), serum albumin (to assess for nephrotic-range protein loss), and complement levels (C3/C4 — low in PSGN and lupus nephritis, normal in IgA nephropathy/HSP) to help narrow the differential before further work-up.","wrong":"A) A 24-hour urine protein quantification is useful but doesn't address the broader initial work-up (renal function, albumin, complement) needed to characterize a mixed nephritic/nephrotic picture. C) Renal ultrasound with Doppler assesses anatomy/vascular flow, not the underlying glomerular pathophysiology suggested by this labs pattern. D) A trial of diphenhydramine assumes an allergic cause for the edema, but the presence of hematuria AND heavy proteinuria strongly suggests a renal/glomerular process, not simple allergic edema — this would inappropriately delay proper renal work-up.","note":""},{"id":114,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"2021","stem":"A previously healthy 9-month-old female infant is seen in the emergency department with a 2-day history of fever and decreased appetite. She has no history of vomiting, diarrhea, cough, or nasal congestion. Her temperature is 39.5°C. She is alert and interactive. She is mildly dehydrated, and there is no focus of infection. A catheterized urine sample is collected. Urinalysis results: Leukocyte esterase 2+, Nitrite Negative, White blood cells 20-50/HPF. She fails an oral fluid challenge and is admitted to the hospital for intravenous antibiotics. Her urine culture grows 50,000 CFU/mL of Escherichia coli. Renal ultrasonography shows mild left hydronephrosis.\nOf the following, the MOST appropriate next step is to","options":[{"letter":"A","text":"perform DMSA (dimercaptosuccinic acid) renal scan"},{"letter":"B","text":"perform voiding cystourethrography"},{"letter":"C","text":"repeat renal ultrasonography after 1 month"},{"letter":"D","text":"repeat urinalysis and culture"}],"correct":"B","why":"A febrile UTI in an infant with an abnormal renal ultrasound (hydronephrosis) raises concern for an underlying urologic abnormality, particularly vesicoureteral reflux (VUR). VCUG is the test used to evaluate for VUR after an abnormal ultrasound in the setting of a febrile UTI, as per standard AAP-influenced work-up algorithms.","wrong":"A) DMSA renal scan assesses for renal scarring/acute pyelonephritis involvement, useful in some algorithms but not the immediate next step here when the priority is defining anatomic risk (VUR) given the hydronephrosis finding. C) Simply repeating the ultrasound in a month doesn't address the need to characterize the reflux/anatomic abnormality now, while the child is being treated. D) The diagnosis (UTI with E. coli) is already confirmed — there's no indication to simply repeat urinalysis/culture instead of proceeding with further anatomic work-up.","note":""},{"id":115,"system":"nephrology_urology_fluids_electrolytes","systemName":"Nephrology, Urology & Fluids/Electrolytes","source":"2021","stem":"An 18-hour-old male newborn has not voided since birth. He was delivered at 38 weeks' gestation to a 25-year-old primigravida mother via cesarean delivery. Prenatal records indicate that she had oligohydramnios. The neonate's vital signs are stable. He has suprapubic swelling. The remainder of the physical examination findings are unremarkable. Renal ultrasonography shows bilateral hydronephrosis with ureteronephrosis and a distended urinary bladder.\nOf the following, the MOST likely diagnosis in this neonate is","options":[{"letter":"A","text":"duplex collecting system"},{"letter":"B","text":"multicystic dysplastic kidney"},{"letter":"C","text":"posterior urethral valves"},{"letter":"D","text":"ureteropelvic junction obstruction"}],"correct":"C","why":"A MALE newborn with oligohydramnios (from reduced fetal urine output due to obstruction), failure to void, a palpable distended bladder (suprapubic swelling), and BILATERAL hydroureteronephrosis is the classic presentation of posterior urethral valves — an obstructing membrane in the posterior urethra unique to males, causing bilateral upper tract dilation and bladder outlet obstruction.","wrong":"A) A duplex collecting system doesn't typically cause bilateral obstruction with failure to void/distended bladder. B) Multicystic dysplastic kidney is typically a UNILATERAL finding and doesn't cause bladder outlet obstruction/failure to void. D) UPJ obstruction is typically unilateral and doesn't explain the distended bladder (bladder outlet, not just upper tract, is obstructed here).","note":""},{"id":116,"system":"endocrinology","systemName":"Endocrinology","source":"SET-1","stem":"A 13-year-old boy was seen for routine health supervision visits. He is concerned about his small size. The boy is healthy, has no significant past medical history, and has a negative review of systems. His mother is 165 cm tall and had menarche at 12. His father is 175 cm tall and continued to grow in height during college. The boy's vital signs are normal. His growth chart is on the 5th percentile. His body mass index is 17 kg/m2 (24th Percentile). He has a sexual maturity rating of 2 for pubic hair and genital development. The remainder of his physical examination findings are unremarkable. A bone age radiograph is read as 11 years.\nWhat is the MOST likely diagnosis for this boy?","options":[{"letter":"A","text":"Constitutional growth delay"},{"letter":"B","text":"Familial short stature"},{"letter":"C","text":"Growth hormone deficiency"},{"letter":"D","text":"Insufficient caloric intake"}],"correct":"A","why":"A delayed bone age (11 vs. actual age ~13), a normal growth VELOCITY along a low percentile, a family history of a delayed-puberty parent (father's late growth spurt), and early pubertal changes already starting (SMR 2) together describe constitutional delay of growth and puberty — these boys are short now but have more growing time left and will catch up.","wrong":"B) Familial short stature typically shows a bone age equal to chronological age (not delayed), reflecting genetically short but on-time parents — here the father's late growth argues against pure familial short stature. C) Growth hormone deficiency usually causes a more significantly abnormal growth pattern/lower growth velocity and wouldn't fit this reassuring family/exam picture as well. D) Insufficient caloric intake would show a low BMI/weight percentile discordant from height, not fitting this scenario with normal BMI.","note":""},{"id":117,"system":"endocrinology","systemName":"Endocrinology","source":"SET-1","stem":"A 12-year-old male with Type 1 DM awoke this morning with a blood glucose of 450 mg/dL. He is on 25 units of insulin glargine and an insulin-to-carb ratio of 1 unit for every 15 grams of carbohydrate with rapid-acting insulin. His correction dose is 1 unit of rapid-acting insulin for every 50 mg/dL if his glucose is over a target of 150 mg/dL. He has had URI symptoms and a low-grade fever for a few days. He has not had any emesis to date. You ask him to begin his sick-day regimen.\nWhich of the following actions is necessary for his sick-day regimen?","options":[{"letter":"A","text":"Monitor ketones with blood glucose < 70 mg/dL"},{"letter":"B","text":"Monitor blood sugar carefully and check ketones if hyperglycemic"},{"letter":"C","text":"Use glucagon if he develops emesis"},{"letter":"D","text":"Give insulin glargine every 3 hours according to his sliding scale"}],"correct":"B","why":"Standard sick-day management for T1DM: continue basal insulin, monitor glucose frequently, and CHECK KETONES whenever hyperglycemic (illness increases insulin resistance and DKA risk) — this proactive ketone-checking is the cornerstone of preventing progression to DKA during illness.","wrong":"A) Checking ketones only when glucose is LOW (<70) is backwards — ketones should be checked when hyperglycemic during illness, since that's when DKA risk rises. C) Glucagon is for treating hypoglycemia/emergencies, not routine sick-day management. D) Giving glargine every 3 hours isn't correct — basal insulin (glargine) is typically continued once daily; correction doses (rapid-acting) are what's adjusted more frequently based on glucose/ketones.","note":""},{"id":118,"system":"endocrinology","systemName":"Endocrinology","source":"SET-1","stem":"You are taking care of a 12-year-old female with Type 1 diabetes mellitus. She was recently diagnosed with Addison's disease. You suspect autoimmune polyglandular syndrome Type 2.\nWhich of the following conditions she is at risk for?","options":[{"letter":"A","text":"Nail disease"},{"letter":"B","text":"Hypoparathyroidism"},{"letter":"C","text":"Chronic mucocutaneous candidiasis"},{"letter":"D","text":"Hypothyroidism"}],"correct":"D","why":"APS type 2 (Schmidt syndrome) classically comprises Addison's disease, autoimmune thyroid disease (commonly Hashimoto's/hypothyroidism), and T1DM — this patient already has 2 of the 3 components, so hypothyroidism is the classic 'third' condition to screen for.","wrong":"A) Nail disease isn't part of APS-2 (it's part of APS-1/APECED, along with chronic mucocutaneous candidiasis and hypoparathyroidism). B) Hypoparathyroidism is a hallmark of APS TYPE 1, not type 2. C) Chronic mucocutaneous candidiasis is also an APS-1 (not APS-2) feature.","note":""},{"id":119,"system":"endocrinology","systemName":"Endocrinology","source":"SET-1","stem":"An 8-year-old girl who was treated from infancy for adrenal insufficiency was noted to have inguinal gonads. Karyotype is 46, XY.\nWhat is the most likely diagnosis?","options":[{"letter":"A","text":"Androgen insensitivity syndrome"},{"letter":"B","text":"Lipoid adrenal hyperplasia"},{"letter":"C","text":"Ovotesticular disorder of sexual development"},{"letter":"D","text":"17-Hydroxylase deficiency"}],"correct":"B","why":"Congenital lipoid adrenal hyperplasia (StAR protein deficiency) causes SEVERE adrenal insufficiency from birth/infancy in BOTH sexes, and in 46,XY individuals, it also blocks testicular steroidogenesis, resulting in undervirilized/female-appearing genitalia despite a male karyotype, with the testes often palpable in the inguinal canal/labia — matching this presentation exactly (early severe adrenal insufficiency + 46,XY sex reversal + inguinal gonads).","wrong":"A) Androgen insensitivity syndrome causes a 46,XY female phenotype with inguinal gonads too, but does NOT cause adrenal insufficiency (androgen receptor defect is isolated to androgen action, adrenal steroidogenesis is intact) — the infancy-onset adrenal insufficiency argues strongly against AIS. C) Ovotesticular DSD doesn't typically present with severe adrenal insufficiency from infancy. D) 17-hydroxylase deficiency causes hypertension (mineralocorticoid excess) and sexual ambiguity, but not primary adrenal INSUFFICIENCY (cortisol precursors get shunted to mineralocorticoid pathway, and patients are often hypertensive, not adrenal-insufficient) — this is essentially the opposite electrolyte/BP picture.","note":""},{"id":120,"system":"endocrinology","systemName":"Endocrinology","source":"SET-1","stem":"A 3-year-old female is admitted for a water deprivation test due to new onset polydipsia and polyuria. During the test, she loses 4% of her body weight. Her serum Na = 150 mmol/L, serum osmolality = 300 mOsm/kg, and urine osmolality =100 mOsm/kg. After administration of DDAVP, urine osmolality is 150 mOsm/kg.\nWhich of the following is the MOST likely diagnosis in this patient?","options":[{"letter":"A","text":"Psychogenic polydipsia"},{"letter":"B","text":"Hereditary nephrogenic diabetes insipidus"},{"letter":"C","text":"Idiopathic central diabetes insipidus"},{"letter":"D","text":"Secondary Nephrogenic diabetes insipidus"}],"correct":"D","why":"Failure to concentrate urine during water deprivation (urine osm inappropriately low relative to serum osm) indicates diabetes insipidus. The KEY discriminator is the response to DDAVP: a nephrogenic process shows LITTLE TO NO rise in urine osmolality after DDAVP (since the kidney can't respond to ADH), which matches this scenario (rise from only 100→150, still far below serum osmolality) — consistent with (at least partial) nephrogenic DI, here presumed acquired/secondary given the acute new-onset presentation rather than a hereditary pattern.","wrong":"A) Psychogenic polydipsia would show LOW serum sodium/osmolality from water intoxication, not elevated Na 150 with high serum osm as seen here. B) Hereditary nephrogenic DI is possible, but nothing in the vignette (age of onset, family history) specifically supports a HEREDITARY pattern over an acquired/secondary one — 'hereditary' is a stronger/more specific claim than the case supports. C) Central DI would show a ROBUST rise in urine osmolality after DDAVP (since exogenous ADH is finally supplied) — the poor/minimal response here argues against a central cause.","note":""},{"id":121,"system":"endocrinology","systemName":"Endocrinology","source":"SET-1","stem":"The mother of an 11-year-old girl who comes to her pediatrician's office for a checkup note that her daughter is beginning to develop breast buds. She asks when her daughter might have her first period.\nWhich of the following is a TRUE statement regarding menarche?","options":[{"letter":"A","text":"Precedes the spurt in linear growth"},{"letter":"B","text":"Generally, occurs when Tanner stage III Breast and Pubic hair development have been achieved"},{"letter":"C","text":"Occurs simultaneously with Tanner stages IV to V pubic hair and breast development"},{"letter":"D","text":"Generally, occurs a year or more after Tanner Stage V Breast and Pubic hair development have been achieved"}],"correct":"D","why":"Menarche typically occurs roughly 2-2.5 years after the onset of breast development (thelarche), generally once a girl has progressed through most of puberty (later Tanner stages) — it is a LATE pubertal event, not an early one.","wrong":"A) Menarche does NOT precede the growth spurt — the growth spurt happens earlier in female puberty (unlike males, where growth spurt is later), and menarche is one of the LAST pubertal milestones. B) Menarche does not typically occur as early as Tanner stage III; it comes later in the sequence.","note":""},{"id":122,"system":"endocrinology","systemName":"Endocrinology","source":"2021","stem":"A 14-year-old boy is admitted to the PICU (Pediatric intensive care unit) with DKA (diabetic ketoacidosis). He takes both regular and NPH insulin twice daily. He was admitted with DKA 3 weeks ago. The most likely cause for DKA in this patient:","options":[{"letter":"A","text":"Eats excessive candy"},{"letter":"B","text":"Frequently suffers from an infection"},{"letter":"C","text":"Drinks less fluid"},{"letter":"D","text":"Takes increased dose of insulin"},{"letter":"E","text":"Forgets to take insulin"}],"correct":"E","why":"Recurrent DKA in an adolescent already established on a regular insulin regimen is most commonly due to insulin omission/non-adherence — a very common issue in teenagers managing a chronic, demanding disease, often related to the psychosocial burden of adolescence (embarrassment, burnout, rebellion) rather than a true medical trigger.","wrong":"A) Excessive candy intake would cause hyperglycemia but not typically trigger full DKA on its own if insulin is still being taken appropriately. B) Recurrent infection is a real trigger of DKA but is less likely to be the specific recurring cause in the same patient within a short 3-week interval without other signs of illness described. C) Inadequate fluid intake alone doesn't precipitate DKA (though it can worsen dehydration once DKA occurs) — DKA requires an underlying insulin deficiency state. D) An INCREASED insulin dose would cause hypoglycemia, not DKA (which results from insufficient insulin).","note":""},{"id":123,"system":"endocrinology","systemName":"Endocrinology","source":"2021","stem":"A 15-year-old boy developed swelling and discomfort in the left breast for the last 3 days. Physical examination reveals swelling and tenderness in the left breast. His growth and development are normal. The next step in management:","options":[{"letter":"A","text":"Head CT scan"},{"letter":"B","text":"Abdominal CT scan"},{"letter":"C","text":"Ultrasonography of the abdomen"},{"letter":"D","text":"MRI of the pituitary"},{"letter":"E","text":"Reassurance only"}],"correct":"E","why":"Unilateral, tender breast enlargement in an otherwise normally developing pubertal adolescent boy is pubertal gynecomastia — a common, benign, self-limited physiologic phenomenon related to the relative estrogen/androgen imbalance during puberty. With normal growth/development and no other concerning findings, reassurance and observation (it typically resolves within 1-2 years) is appropriate.","wrong":"A/B/C/D) Head CT, abdominal CT, abdominal ultrasound, and pituitary MRI would all be reserved for atypical presentations — e.g., very rapid progression, other signs of a hormone-secreting tumor, abnormal growth/pubertal pattern, or other red flags — none of which are present in this classic benign pubertal gynecomastia vignette.","note":""},{"id":124,"system":"endocrinology","systemName":"Endocrinology","source":"2021","stem":"A 13-year-old Native American boy is receiving a health supervision evaluation. He and his parents have no concerns or questions. The boy's height is 162 cm (75th percentile), weight is 71 kg (97th percentile), and body mass index is 27 kg/m2 (97th percentile). His blood pressure is 110/70 mm Hg. The skin on his posterior neck and bilateral axillae is hyperpigmented and velvety. The remainder of his physical examination findings are normal.\nOf the following, the MOST appropriate screening test to perform in this patient is a(n)","options":[{"letter":"A","text":"fasting insulin"},{"letter":"B","text":"hemoglobin A1c"},{"letter":"C","text":"insulin-like growth factor"},{"letter":"D","text":"random glucose"}],"correct":"B","why":"An obese adolescent (BMI 97th percentile) with acanthosis nigricans (a marker of insulin resistance) is at high risk for type 2 diabetes. HbA1c is the recommended screening test in this population per current guidelines, as it reflects average glycemic control over ~3 months and doesn't require fasting, making it practical for adolescent screening.","wrong":"A) Fasting insulin isn't the standard recommended screening test for T2DM in adolescents — it's more of a research/investigational marker of insulin resistance rather than a diagnostic screening tool. C) IGF-1 assesses growth hormone axis function, unrelated to diabetes screening. D) A random glucose can be used but is less reliable/standardized as the primary screening test compared to HbA1c, which is the guideline-preferred initial screening test for T2DM risk in at-risk youth.","note":""},{"id":125,"system":"growth_development","systemName":"Growth & Development","source":"SET-1","stem":"On a routine health supervision visit, a 12-month-old girl pulls to a stand and cruises. Her mother states that she recently started to take a few steps alone and drinks from a cup held by another person. You place cereal in front of her to evaluate her ability to pick up small objects.\nWhat is the MOST likely method by which she will pick up a piece of cereal?","options":[{"letter":"A","text":"Pincer grasp between her forefinger and thumb"},{"letter":"B","text":"Raking motion of her entire hand"},{"letter":"C","text":"Scissoring motion with her forefinger and thumb"},{"letter":"D","text":"Scooping motion with the radial aspect of her hand"}],"correct":"A","why":"By 9-12 months, infants develop a mature pincer grasp (thumb-to-index-finger opposition), allowing precise pickup of small objects like cereal — a key fine motor milestone tested alongside the gross motor skills described (cruising, early steps).","wrong":"B) Raking motion (whole-hand grasp without finger isolation) is an earlier (~6-9 month) milestone, already surpassed by 12 months. C) 'Scissoring' isn't a standard developmental grasp term used for this age. D) A scooping/radial palm motion is also an earlier, more primitive grasp pattern than the mature pincer grasp expected by 12 months.","note":""},{"id":126,"system":"growth_development","systemName":"Growth & Development","source":"SET-1","stem":"An infant with normal growth and development is seen in the clinic. She is initially fearful and looks at her mother when the examiner enters the room. With time, she grows calm, smiles, and laughs when the examiner plays peek-a-boo with her. After squirming in her mother's arms, she is placed standing on the ground. In response, she holds onto the seat of a chair and takes a few steps. She turns when her mother says her name during the visit and makes a variety of vocalizations using vowel and consonant sounds as well as shrieks and \"growls.\"\nWhich of the following do this infant's fine motor abilities MOST likely include?","options":[{"letter":"A","text":"Stacking two small blocks"},{"letter":"B","text":"Scribbling linear marking with a crayon"},{"letter":"C","text":"Self-feeding soft foods with a spoon"},{"letter":"D","text":"Grasping a cube with her thumb and fingertips"}],"correct":"D","why":"This description (stranger anxiety, peek-a-boo, cruising, name recognition, varied babble) corresponds to roughly 9-10 months of age — at this stage, fine motor skill has progressed to a radial-digital grasp (grasping objects between thumb and fingertips), a precursor to the fully mature pincer grasp.","wrong":"A) Stacking two blocks is a ~15-18 month skill, too advanced for this age. B) Scribbling with a crayon is an ~18 month (or later) skill. C) Self-feeding with a spoon is typically achieved around 15-18 months, more advanced than this stage.","note":""},{"id":127,"system":"growth_development","systemName":"Growth & Development","source":"SET-1","stem":"A 24-month-old, typically developing girl is seen for a routine health supervision visit. She can jump, kick a ball, and throw a ball overhand.\nWhich of the following is MOST likely able to do?","options":[{"letter":"A","text":"Balance on 1 foot for 3 seconds"},{"letter":"B","text":"Catch a ball with stiff arms"},{"letter":"C","text":"Walk downstairs while holding the rail"},{"letter":"D","text":"Walk upstairs with alternating feet"}],"correct":"C","why":"At 24 months, gross motor skills include walking up/down stairs while holding a rail (one step at a time), consistent with the other described 2-year skills (jumping, kicking, throwing).","wrong":"A) Balancing on one foot for even a few seconds is typically a ~3-4 year skill, too advanced for 24 months. B) Catching a ball with stiff arms is more of a 3-year skill. D) Walking upstairs with ALTERNATING feet (without holding a rail) is typically achieved closer to age 3-4, more advanced than a 2-year-old's expected skill.","note":""},{"id":128,"system":"growth_development","systemName":"Growth & Development","source":"SET-1","stem":"The parents of a 9-year-old boy consult you about their son's constant struggle with coordination. They report that he often trips over, has trouble tying his shoelaces, and finds it challenging to use utensils while eating. He doesn't seem to have any cognitive or learning difficulties. Based on these observations, what might be a potential diagnosis?","options":[{"letter":"A","text":"Autism Spectrum Disorder"},{"letter":"B","text":"Dyspraxia"},{"letter":"C","text":"Sensory Processing Disorder"},{"letter":"D","text":"Intellectual Disability"}],"correct":"B","why":"Developmental coordination disorder (dyspraxia) presents with impaired motor coordination for age (clumsiness, difficulty with fine/gross motor tasks like tying shoes or using utensils) in the ABSENCE of intellectual disability or a primary neurologic disorder — matching this presentation precisely.","wrong":"A) Autism spectrum disorder involves social communication deficits/restricted interests as core features, not isolated motor coordination problems. C) Sensory processing disorder involves abnormal responses to sensory input, a different clinical picture than pure motor incoordination. D) Intellectual disability is explicitly excluded in the vignette
