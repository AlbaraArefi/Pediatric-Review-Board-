 ('no cognitive or learning difficulties').","note":""},{"id":129,"system":"rheumatology","systemName":"Rheumatology","source":"SET-1","stem":"A 3-year-old girl is seen for complaints of persistent left knee swelling and limping that began six weeks ago. She received acetaminophen with mild improvement of her limp but no improvement in the swelling. Physical examination reveals a warm, erythematous, swollen left knee that is tender to touch and has a decreased range of motion. ESR is 40 mm/h. A diagnosis of juvenile idiopathic arthritis is made.\nWhat is the BEST initial treatment?","options":[{"letter":"A","text":"Codeine"},{"letter":"B","text":"Prednisolone"},{"letter":"C","text":"Naproxen"},{"letter":"D","text":"Sulfasalazine"}],"correct":"C","why":"NSAIDs are the correct first-line agent for newly diagnosed oligoarticular JIA with mild-moderate disease. They control pain/inflammation while a rheumatology work-up and DMARD decision proceed.","wrong":"A) Codeine treats pain only, not inflammation, and has no role in JIA. B) Prednisolone (systemic steroid) is reserved for more severe/systemic disease or as a bridge, not first-line monotherapy for oligoarticular JIA. D) Sulfasalazine is a second-line DMARD used when NSAIDs fail, not initial therapy.","note":""},{"id":130,"system":"rheumatology","systemName":"Rheumatology","source":"SET-1","stem":"You are seeing a 3-year-old girl who has had joint inflammation of 3 joints for the past eight months. She recently saw a rheumatologist who diagnosed oligoarticular arthritis.\nWhich of the following tests correlates the highest with this patient's risk of developing uveitis?","options":[{"letter":"A","text":"Antinuclear antibody"},{"letter":"B","text":"HLA Typing"},{"letter":"C","text":"Erythrocyte sedimentation rate"},{"letter":"D","text":"Immunoglobulin A levels"}],"correct":"A","why":"ANA positivity is the strongest predictor of chronic anterior uveitis risk in JIA (especially young girls with oligoarticular disease) and dictates the frequency of slit-lamp screening.","wrong":"B) HLA typing is relevant to enthesitis-related arthritis/spondyloarthropathy risk, not uveitis. C) ESR reflects systemic inflammation, not uveitis risk. D) IgA levels are not linked to uveitis.","note":""},{"id":131,"system":"rheumatology","systemName":"Rheumatology","source":"SET-1","stem":"The clinical manifestation in patients with SLE (systemic lupus erythematosus) and anti-ribosomal P antibodies is:","options":[{"letter":"A","text":"Hypothyroidism"},{"letter":"B","text":"Hemolytic anemia"},{"letter":"C","text":"Coagulopathy"},{"letter":"D","text":"Lupus cerebritis"}],"correct":"D","why":"Anti-ribosomal P antibodies are relatively specific for CNS lupus, particularly lupus psychosis/depression — a classic association tested on boards.","wrong":"A) Hypothyroidism relates to anti-thyroid antibodies, not lupus-specific. B) Hemolytic anemia is linked to warm autoantibodies/direct Coombs positivity, not anti-ribosomal P. C) Coagulopathy relates to antiphospholipid antibodies (lupus anticoagulant, anticardiolipin), a different antibody family.","note":""},{"id":132,"system":"rheumatology","systemName":"Rheumatology","source":"SET-1","stem":"An 11-year-old girl presented with ankle swelling four days after having a sore throat. Upon examination, she had a blood pressure of 130/85 mmHg and ankle edema. Investigations reveal creatinine 100 µmol/L, albumin 25 g/L, normal C3, and C4 levels. 24-hour urinary protein 3 grams.\nWhat is the MOST likely diagnosis?","options":[{"letter":"A","text":"IgA Nephropathy"},{"letter":"B","text":"Membranoproliferative glomerulonephritis"},{"letter":"C","text":"Minimal change nephropathy"},{"letter":"D","text":"Post-streptococcal glomerulonephritis"}],"correct":"A","why":"Normal complement levels are the key discriminator here — post-strep GN and membranoproliferative GN both classically cause low C3. IgA nephropathy (and HSP nephritis) present with normal complement, often 1-5 days after a mucosal (pharyngeal) infection — 'synpharyngitic' hematuria/nephrotic-range proteinuria.","wrong":"B) Membranoproliferative GN typically has persistently low C3 (and often low C4). C) Minimal change disease doesn't typically follow a sore throat with hypertension/elevated creatinine and wouldn't explain this presentation as well. D) Post-streptococcal GN occurs 1-3 weeks after pharyngitis (latent period) with LOW C3, not normal complement — the timing and normal complement argue against it here.","note":""},{"id":133,"system":"rheumatology","systemName":"Rheumatology","source":"SET-1","stem":"The 8-year-old child presented with nephritis secondary to Henoch-Schönlein Purpura; which of the following conditions may indicate aggressive therapy in this child?","options":[{"letter":"A","text":"Isolated microscopic hematuria"},{"letter":"B","text":"Severe systemic manifestations"},{"letter":"C","text":">50% crescents on renal biopsy"},{"letter":"D","text":"IgA deposits intensity"}],"correct":"C","why":"The extent of crescents on biopsy is the strongest histologic predictor of poor renal outcome in HSP nephritis and is the threshold used to justify aggressive immunosuppression (steroids ± cyclophosphamide/other agents).","wrong":"A) Isolated microscopic hematuria is low-risk, usually just monitored. B) 'Severe systemic manifestations' is vague/non-renal and doesn't itself dictate renal-specific aggressive therapy. D) IgA deposit intensity on immunofluorescence is not the prognostic marker used clinically — crescent burden is.","note":""},{"id":134,"system":"rheumatology","systemName":"Rheumatology","source":"SET-1","stem":"A 12-year-old girl is brought to the clinic by her parents for evaluation of left-sided joint swelling of her wrist and knee. In addition, she has tenderness at the insertion point of the Achilles tendon and the plantar fascia insertion points. She has bilateral nail pitting and fusiform swelling of her entire right forefinger. Given this patient's physical findings, a family history of which of the following is most important to ask about?","options":[{"letter":"A","text":"Ankylosing spondylitis"},{"letter":"B","text":"Psoriasis"},{"letter":"C","text":"SLE"},{"letter":"D","text":"Inflammatory bowel disease"}],"correct":"B","why":"Dactylitis ('sausage digit') + nail pitting + enthesitis is the classic triad pointing to psoriatic arthritis, even without a rash yet — psoriasis frequently follows the arthritis in children. Family history of psoriasis supports the diagnosis.","wrong":"A) Ankylosing spondylitis is part of the spondyloarthropathy family but doesn't explain nail pitting/dactylitis as specifically. C) SLE doesn't cause dactylitis or nail pitting. D) IBD-associated arthritis doesn't typically cause nail pitting or dactylitis.","note":""},{"id":135,"system":"rheumatology","systemName":"Rheumatology","source":"SET-1","stem":"An 11-year-old girl with systemic juvenile rheumatoid arthritis appears with fever, lymphadenopathy, and hepatosplenomegaly. The blood test reveals anemia, leukopenia, and thrombocytopenia.\nWhat is the most likely cause?","options":[{"letter":"A","text":"Viral syndrome"},{"letter":"B","text":"Disseminated intravascular coagulation"},{"letter":"C","text":"Drug-induced aplastic anemia"},{"letter":"D","text":"Macrophage activation syndrome"}],"correct":"D","why":"A patient with known systemic JIA who develops cytopenias (a falling WBC/platelet count is paradoxical in an inflammatory disease and should raise alarm) with organomegaly is macrophage activation syndrome until proven otherwise — a life-threatening complication of sJIA requiring urgent recognition (check ferritin, triglycerides, fibrinogen).","wrong":"A) A viral syndrome wouldn't explain the backdrop of known sJIA with this constellation as precisely. B) DIC can co-occur with MAS but is a downstream/lab finding, not the primary diagnosis being tested. C) Drug-induced aplastic anemia doesn't fit the organomegaly/known sJIA context.","note":""},{"id":136,"system":"rheumatology","systemName":"Rheumatology","source":"2021","stem":"A 6-year-old girl appears in the ER with rashes over the lower extremities and buttocks for the last 24 hours. She had fever and malaise for the last 3 days. She also stated the right knee and the left ankle pain. Physical examination reveals erythematous maculopapular lesions on skin. The true statement about this clinical condition:","options":[{"letter":"A","text":"Low platelet count"},{"letter":"B","text":"Reduced IgA and IgM"},{"letter":"C","text":"Biopsy of skin lesions confirms the diagnosis of vasculitis"},{"letter":"D","text":"Intussusception is present in all cases."},{"letter":"E","text":"Hematuria and proteinuria are present in all cases."}],"correct":"C","why":"This is Henoch-Schönlein purpura (HSP/IgA vasculitis) — palpable purpura on lower extremities/buttocks, arthritis/arthralgia, and antecedent illness. HSP is fundamentally a small-vessel leukocytoclastic vasculitis with IgA deposition, and skin biopsy (showing leukocytoclastic vasculitis with IgA deposits on immunofluorescence) IS a way to histologically confirm the vasculitic process, though the diagnosis is usually made clinically without requiring biopsy in typical cases.","wrong":"A) Platelet count is typically NORMAL in HSP (a key distinguishing feature from other purpuric conditions like ITP) — 'low platelet count' is incorrect and would actually argue AGAINST HSP. B) IgA is typically ELEVATED (not reduced) in HSP, reflecting the IgA-mediated immune complex pathophysiology — 'reduced IgA and IgM' is incorrect. D) Intussusception is a recognized GI complication of HSP but occurs in only a MINORITY of cases, not all. E) Hematuria/proteinuria (renal involvement) occurs in a significant proportion but NOT all cases of HSP — renal involvement is variable, occurring in roughly 20-50% of cases.","note":""},{"id":137,"system":"allergy_dermatology","systemName":"Allergy & Dermatology","source":"SET-1","stem":"A 4-year-old boy is seen in the clinic for evaluation of cough and eye redness. He has had nasal congestion, mild cough, and bilateral itchy and red eyes for the past week. He has been afebrile and otherwise well, with a normal appetite and energy. He has normal vital signs. He has mild bilateral periorbital edema and erythema. His bulbar and palpebral conjunctiva are erythematous but without discharge. His tympanic membranes are normal, and he has normal findings from cardiac and respiratory examinations.\nWhich of the following is the MOST appropriate treatment for the boy's ocular symptoms?","options":[{"letter":"A","text":"Erythromycin eye ointment"},{"letter":"B","text":"Ketotifen eye drops"},{"letter":"C","text":"Oral cephalexin"}],"correct":"B","why":"Itchy, bilateral red eyes WITHOUT discharge, in the setting of concurrent nasal allergy symptoms, is classic allergic conjunctivitis — topical ketotifen (a combined antihistamine/mast-cell stabilizer) is an appropriate, effective targeted treatment.","wrong":"A) Erythromycin ointment treats bacterial conjunctivitis, which typically has purulent DISCHARGE — absent here. C) Oral cephalexin would treat a bacterial/skin infection, not allergic conjunctivitis.","note":""},{"id":138,"system":"allergy_dermatology","systemName":"Allergy & Dermatology","source":"SET-1","stem":"A 15-year-old adolescent boy is being evaluated for a rash on his face, which appeared several weeks ago. The affected area is flaky and, at times, itchy. He also reports flaking of his scalp. The boy is well in other respects and has an unremarkable medical history. His physical examination findings are normal except for the alar creases, which reveal mild erythema, hypopigmentation, and scaling.\nWhich of the following is the MOST likely diagnosis?","options":[{"letter":"A","text":"Atopic dermatitis"},{"letter":"B","text":"Periorificial dermatitis"},{"letter":"C","text":"Seborrheic dermatitis"},{"letter":"D","text":"Tinea corporis"}],"correct":"C","why":"Involvement of the alar creases (nasolabial folds) plus scalp flaking (dandruff) is classic distribution for seborrheic dermatitis, which favors sebaceous-gland-rich areas (scalp, nasolabial folds, eyebrows).","wrong":"A) Atopic dermatitis favors flexural areas (antecubital/popliteal fossae) in older children, not classically the alar creases/scalp pattern described. B) Periorificial dermatitis causes papules/pustules around the mouth/nose/eyes, a different morphology than flaky/scaling. D) Tinea corporis presents as annular, scaly plaques with central clearing on the body, not this facial/scalp distribution.","note":""},{"id":139,"system":"allergy_dermatology","systemName":"Allergy & Dermatology","source":"SET-1","stem":"A 5-year-old child with atopic dermatitis is not responding well to conventional treatment. The child's symptoms include persistent itching and skin inflammation.\nWhat is the next step in the management of this child's condition?","options":[{"letter":"A","text":"Topical calcineurin inhibitors"},{"letter":"B","text":"Systemic corticosteroids"},{"letter":"C","text":"Ultraviolet (UV) light therapy"},{"letter":"D","text":"Topical antibiotics"}],"correct":"A","why":"For atopic dermatitis refractory to standard topical corticosteroids (or in sensitive areas where prolonged steroid use is a concern), topical calcineurin inhibitors (tacrolimus/pimecrolimus) are the next step, offering steroid-sparing anti-inflammatory control.","wrong":"B) Systemic corticosteroids are generally avoided in pediatric AD due to side effects and rebound flares upon discontinuation — reserved for severe refractory cases under specialist care, not a routine next step. C) UV light therapy is a later-line option (used more in adolescents/adults, and requires specialized access), not the typical next step in a young child. D) Topical antibiotics only address secondary bacterial infection, not the underlying eczema itself.","note":""},{"id":140,"system":"allergy_dermatology","systemName":"Allergy & Dermatology","source":"2021","stem":"A child is diagnosed with seborrheic dermatitis and is treated with topical corticosteroid. The parents are upset because the child is not improving clinically. Most likely diagnosis:","options":[{"letter":"A","text":"Eczema"},{"letter":"B","text":"Psoriasis"},{"letter":"C","text":"Pityriasis rosea"},{"letter":"D","text":"Granuloma annulare"},{"letter":"E","text":"Histiocytosis X"}],"correct":"E","why":"A persistent 'seborrheic dermatitis-like' rash that FAILS to improve with appropriate topical corticosteroid therapy should raise suspicion for a seborrheic-dermatitis MIMIC — Langerhans cell histiocytosis (histiocytosis X) classically presents with a scaly, erythematous, seborrheic-like rash (often scalp/intertriginous areas, sometimes with petechiae/purpura) that is refractory to standard seborrheic dermatitis treatment, and should prompt further work-up (biopsy) when treatment fails as expected.","wrong":"A) Eczema (atopic dermatitis) has a different distribution (flexural areas) and typically DOES respond to topical steroids, unlike this refractory picture. B) Psoriasis can look similar to seborrheic dermatitis but usually shows more well-demarcated, silvery-scaled plaques and would still generally show SOME response to topical steroids, unlike a complete lack of improvement pointing to a different underlying process. C) Pityriasis rosea is typically self-limited (resolves over weeks regardless of treatment) with a distinct 'herald patch' and Christmas-tree distribution, not really described as being 'treated' with topical steroid for improvement assessment in this way. D) Granuloma annulare presents as annular, flesh-colored/erythematous plaques without scale, a different morphology from seborrheic-dermatitis-like scaling.","note":""},{"id":141,"system":"allergy_dermatology","systemName":"Allergy & Dermatology","source":"2021","stem":"A 15-year-old girl appears with macerated and inflamed areas between toes. She is an athlete. Most likely diagnosis:","options":[{"letter":"A","text":"Scabies"},{"letter":"B","text":"Tinea pedis"},{"letter":"C","text":"Tinea corporis"},{"letter":"D","text":"Eczema"},{"letter":"E","text":"Allergic reaction"}],"correct":"B","why":"Macerated, inflamed skin between the toes ('athlete's foot' distribution) in an athlete (moist, occlusive footwear environment favoring fungal growth) is the classic presentation of tinea pedis, a dermatophyte infection of the feet.","wrong":"A) Scabies causes intensely itchy burrows typically in web spaces of the FINGERS, wrists, and other areas, not primarily interdigital toe maceration. C) Tinea corporis affects the body/trunk with annular scaly plaques, not the interdigital foot distribution described. D) Eczema can occur anywhere but doesn't have this classic 'athlete + interdigital maceration' association that specifically points to tinea pedis. E) A generic allergic reaction wouldn't have this classic athletic/interdigital distribution and pattern.","note":""},{"id":142,"system":"ent","systemName":"ENT","source":"2021","stem":"A 12-year-old female appears in a clinic with fever (104.8°F), severe throat pain, unable to open her mouth, refuses to eat and talk for the last 24 hours. She had acute tonsillopharyngitis a few days ago. Physical examination reveals 'hot potato' voice, trismus, torticollis, enlarged left tonsil, and uvula is displaced to the right side. Most likely diagnosis:","options":[{"letter":"A","text":"Peritonsillar abscess"},{"letter":"B","text":"Retropharyngeal abscess"},{"letter":"C","text":"Epiglottitis"},{"letter":"D","text":"Acute tonsillopharyngitis"},{"letter":"E","text":"Pharyngeal muscle paralysis"}],"correct":"A","why":"Trismus (inability to open the mouth, from pterygoid muscle irritation), 'hot potato' voice, unilateral tonsillar swelling with CONTRALATERAL uvular deviation, torticollis, and severe unilateral throat pain following recent tonsillitis are the classic findings of peritonsillar abscess (quinsy) — a localized collection lateral to the tonsil.","wrong":"B) Retropharyngeal abscess typically causes neck stiffness/refusal to extend the neck and drooling, but less classically causes trismus and unilateral tonsillar bulge with uvular deviation — the exam findings here (unilateral tonsil/uvula deviation) are more specific for peritonsillar, not retropharyngeal, abscess. C) Epiglottitis causes drooling, respiratory distress, and a toxic-appearing child, often with a muffled voice, but not typically unilateral tonsillar swelling with uvular deviation and trismus. D) Simple tonsillopharyngitis wouldn't cause trismus or uvular deviation — those findings indicate a local abscess/mass effect. E) Pharyngeal muscle paralysis doesn't fit this acute infectious/inflammatory presentation.","note":""},{"id":143,"system":"ent","systemName":"ENT","source":"2021","stem":"A 3-year-old child with a 1-week history of unilateral, foul-smelling, nasal discharge is seen for evaluation. The child has been intermittently reporting pain and had 2 brief episodes of epistaxis earlier today. The mother reports increased snoring and mouth-breathing at night over the last week. There has been no fever, trauma, cough, ear pain, or headache. The child is active and appears well. The conjunctiva are clear, tympanic membranes are pearly white with a sharp light reflex bilaterally, and there is no facial swelling or tenderness. The right nare is patent without any congestion or discharge. The left nare is obstructed with profuse, foul-smelling, mucoid discharge.\nOf the following, the MOST likely diagnosis is","options":[{"letter":"A","text":"acute bacterial sinusitis"},{"letter":"B","text":"nasal foreign body"},{"letter":"C","text":"nasal polyp"},{"letter":"D","text":"nasal septal hematoma"}],"correct":"B","why":"Unilateral, foul-smelling nasal discharge with intermittent epistaxis in a young child is the classic presentation of an unwitnessed nasal foreign body — a very common toddler/preschool-age occurrence, often unwitnessed since young children rarely report it themselves.","wrong":"A) Bacterial sinusitis typically causes BILATERAL symptoms with a different clinical course (persistent bilateral nasal discharge/congestion, not unilateral foul discharge). C) Nasal polyps are uncommon in this age group without an underlying condition (like CF) and wouldn't typically cause acute foul unilateral discharge/epistaxis. D) Nasal septal hematoma is typically related to trauma and presents differently (septal swelling on exam, no history of trauma given here).","note":""},{"id":144,"system":"ent","systemName":"ENT","source":"2021","stem":"A 6-year-old boy with ear drainage is brought to the otolaryngology clinic. Four weeks ago he underwent bilateral tympanostomy tube placement for recurrent otitis media. For the last 2 weeks, he has had persistent foul-smelling drainage from the right ear. He has a temperature of 37.2°C, blood pressure of 100/60 mm Hg, heart rate of 90 beats/min, and respiratory rate of 22 breaths/min. There is purulent drainage in the right ear canal, and the right tympanic membrane cannot be visualized. A patent tympanostomy tube is seen in the left tympanic membrane.\nOf the following, the BEST management of this boy's infection is","options":[{"letter":"A","text":"oral ciprofloxacin"},{"letter":"B","text":"oral clindamycin"},{"letter":"C","text":"topical neomycin"},{"letter":"D","text":"topical ofloxacin"}],"correct":"D","why":"Chronic post-tympanostomy-tube otorrhea (drainage through a functioning/patent tube) is treated with TOPICAL fluoroquinolone drops (like ofloxacin or ciprofloxacin otic drops), which are safe for middle ear exposure (non-ototoxic) and provide effective local antibiotic concentration directly at the site of infection.","wrong":"A) Oral ciprofloxacin is systemic therapy, generally not needed for uncomplicated tube otorrhea when topical therapy is effective and avoids systemic side effects/resistance concerns. B) Oral clindamycin doesn't have ideal coverage for the typical organisms (often Pseudomonas or Staph) causing tube otorrhea and isn't standard first-line. C) Topical NEOMYCIN-containing drops carry a risk of ototoxicity if they reach the middle ear (as they would through a patent tube) — fluoroquinolone drops (like ofloxacin) are specifically preferred BECAUSE they are non-ototoxic and safe to use with a patent tympanostomy tube or perforation.","note":""},{"id":145,"system":"toxicology","systemName":"Toxicology","source":"SET-1","stem":"A 16-year-old boy was brought to the Emergency with hypothermia (temperature 35°C) and diminished respiratory effort. Physical examination reveals hypothermia, hypotension, and respiratory depression. The child did not respond to naloxone.\nWhat is the Most likely poisoning due to?","options":[{"letter":"A","text":"Morphine"},{"letter":"B","text":"Cocaine"},{"letter":"C","text":"Alcohol"},{"letter":"D","text":"Barbiturate"}],"correct":"D","why":"Failure to respond to naloxone essentially rules out an opioid as the cause (naloxone is a specific opioid antagonist). Barbiturates cause CNS/respiratory depression, hypotension, and hypothermia, similar to opioids but without naloxone reversibility — matching this presentation.","wrong":"A) Morphine (an opioid) WOULD respond to naloxone, which it didn't here. B) Cocaine causes sympathomimetic toxicity (tachycardia, hypertension, hyperthermia) — the opposite picture (hypotension, hypothermia, depression) seen here. C) Alcohol can cause CNS depression/hypothermia but is a less specific/complete match compared to barbiturate for this severe triad and is typically distinguished by history/breath odor rather than being the 'best' answer among these choices.","note":""},{"id":146,"system":"toxicology","systemName":"Toxicology","source":"SET-1","stem":"A 16-year-old patient reported consuming 20-40 capsules containing acetaminophen 1 hour ago.\nWhat is the most appropriate approach to treatment?","options":[{"letter":"A","text":"Measure the plasma level and determine potential toxicity from the level on the nomogram"},{"letter":"B","text":"Administer activated charcoal immediately and measure the acetaminophen plasma level 4 hours after ingestion"},{"letter":"C","text":"Wait until 4 hours after ingestion to measure the plasma level and do nothing else"},{"letter":"D","text":"Administer N-acetylcysteine at a dose of 140 mg/kg"}],"correct":"B","why":"Activated charcoal is most effective when given early (within 1-2 hours of ingestion) to reduce absorption, so it should be given now. The plasma acetaminophen level should be drawn at ≥4 hours post-ingestion (not sooner) to allow accurate interpretation via the Rumack-Matthew nomogram, since earlier levels may not reflect peak absorption.","wrong":"A) Measuring the level now (at 1 hour) is too early to accurately apply nomogram interpretation. C) Waiting until 4 hours and 'doing nothing else' misses the window of maximal benefit for charcoal, which should be given as soon as possible. D) N-acetylcysteine dosing is NOT 140 mg/kg as a blanket answer without first establishing the need via the nomogram at 4 hours (140 mg/kg IS the standard oral NAC loading dose, but giving it empirically here skips the necessary nomogram-based risk stratification step that determines if NAC is even needed, and the ordering emphasized in this vignette is charcoal now + level at 4h).","note":""},{"id":147,"system":"toxicology","systemName":"Toxicology","source":"SET-1","stem":"A 2-year-old born to a mother with severe depression is brought to the emergency room with lethargy of 2 hours' duration. On examination, the child has tachycardia, dilated pupils, dry mucous membranes, and cutaneous flushing. An electrocardiogram reveals frequent premature ventricular contractions and a QRS complex of 0.18 seconds.\nWhat is the NEXT important step in the management of this patient?","options":[{"letter":"A","text":"Administer sodium bicarbonate by vein"},{"letter":"B","text":"Administer physostigmine"},{"letter":"C","text":"Perform a head CT scan"},{"letter":"D","text":"Administer diazepam"}],"correct":"A","why":"This is classic tricyclic antidepressant (TCA) toxicity — anticholinergic signs (dilated pupils, dry mucosa, flushing, tachycardia) PLUS cardiotoxicity (wide QRS, PVCs) from sodium channel blockade. IV sodium bicarbonate is the specific antidote — it narrows the QRS and reduces arrhythmia risk by increasing extracellular sodium gradient and alkalinizing serum (reducing TCA-Na channel binding).","wrong":"B) Physostigmine can worsen cardiotoxicity/cause seizures in TCA overdose and is generally AVOIDED. C) A head CT doesn't address the acute life-threatening cardiotoxicity. D) Diazepam may be used for seizures if they occur, but it doesn't address the wide QRS/cardiotoxicity, which is the most immediately life-threatening issue requiring bicarbonate.","note":""},{"id":148,"system":"toxicology","systemName":"Toxicology","source":"SET-1","stem":"An 18-month-old girl is brought in by her parents with concerns that she may have ingested extended-release verapamil 90 minutes ago. Her grandfather believes that none of his pills are missing. In the emergency department, she is sleeping, which her parents report as unusual. Her examination is otherwise normal, and she has normal vital signs.\nWhat is the MOST appropriate NEXT STEP in management?","options":[{"letter":"A","text":"Administer glucagon IM"},{"letter":"B","text":"Admit for observation with cardiorespiratory monitoring"},{"letter":"C","text":"Initiate immediate dextrose infusion"},{"letter":"D","text":"Administer activated charcoal and observe for 12 hours"}],"correct":"B","why":"Extended-release calcium channel blocker toxicity can have DELAYED onset of severe cardiotoxicity (bradycardia, hypotension, shock) for many hours after ingestion, even with initially normal vitals — given uncertain exposure and a reported behavior change (unusual sleepiness), admission for extended cardiorespiratory monitoring is essential to catch delayed deterioration.","wrong":"A) Glucagon is a specific antidote used to TREAT established CCB toxicity (bradycardia/hypotension), not given prophylactically/empirically before any signs of toxicity have developed. C) Dextrose infusion isn't indicated without confirmed hypoglycemia. D) Charcoal at this point (90 minutes post-possible-ingestion) plus only 12 hours of observation would not be long enough — extended-release CCB toxicity requires longer monitoring (often 24 hours) given delayed absorption kinetics, making close monitoring/admission (B) the better overall answer versus a fixed short 12-hour charcoal-only plan.","note":""},{"id":149,"system":"toxicology","systemName":"Toxicology","source":"SET-1","stem":"A 16-year-old boy is brought to the emergency department approximately 3 hours after a suicidal ingestion of bupropion and presents with agitation and tachycardia. An electrocardiogram shows normal sinus rhythm and a normal corrected QT interval. His serum electrolyte and glucose levels are normal. Serum tests for acetaminophen and salicylates are negative. This patient should be observed for complications.\nYou are most concerned about the development of which of the following complications?","options":[{"letter":"A","text":"Hallucinations"},{"letter":"B","text":"Seizures"},{"letter":"C","text":"Rhabdomyolysis"},{"letter":"D","text":"Urinary retention"}],"correct":"B","why":"Bupropion overdose is well-known for causing SEIZURES (often delayed, sometimes many hours after ingestion, and can be recurrent) — this is the specific, life-threatening complication that drives the recommendation for prolonged cardiac AND neurologic monitoring after bupropion overdose.","wrong":"A) Hallucinations aren't the primary life-threatening concern tracked in bupropion overdose. C) Rhabdomyolysis can occur secondary to prolonged seizure activity but isn't itself the primary complication being watched for. D) Urinary retention isn't a recognized major bupropion toxicity concern.","note":""},{"id":150,"system":"toxicology","systemName":"Toxicology","source":"SET-1","stem":"An adolescent boy was brought to the ER by his friend. The patient was comatose but was breathing on his own. The heart rate was irregular, and the BP (blood pressure) was low. During examination, the patient developed generalized convulsion. After the convulsion was stopped, hematemesis and diarrhea were noted. His friend did not know what happened to him. However, a friend noticed initially that the patient had euphoria, ataxia, and distorted body image, causing panic reactions. He was using abusive language.\nWhich of the following is the MOST common cause for the clinical manifestations?","options":[{"letter":"A","text":"Jimsonweed intoxication"},{"letter":"B","text":"Marijuana use"},{"letter":"C","text":"Alcohol use"},{"letter":"D","text":"Phencyclidine use"}],"correct":"D","why":"The prodromal description — euphoria, ataxia, distorted body image (dissociation), panic reactions, and violent/abusive behavior — is a classic description of PCP intoxication, which can progress to seizures and cardiovascular instability in severe toxicity.","wrong":"A) Jimsonweed (anticholinergic) intoxication causes delirium/hallucinations with dry mouth/dilated pupils/hyperthermia, not this specific ataxia/dissociation/violence pattern. B) Marijuana intoxication is typically much milder (relaxation, mild tachycardia) and doesn't cause this severe violent/dissociative/seizure picture. C) Alcohol intoxication doesn't typically cause 'distorted body image' as a defining feature in the same way PCP dissociation does.","note":""},{"id":151,"system":"toxicology","systemName":"Toxicology","source":"2021","stem":"A 16-year-old boy appears in the ER with a visual disturbance (e.g., feeling of being in a snowstorm) for the last 3 hours. He vomited 3 times prior to arrival in ER. Physical examination reveals bilateral dilated pupils that are unresponsive to light, retinal edema, and optic disc hyperemia. The investigation that can lead to a diagnosis:","options":[{"letter":"A","text":"Blood methanol level"},{"letter":"B","text":"Blood cyanide level"},{"letter":"C","text":"Blood salicylate level"},{"letter":"D","text":"Blood acetaminophen level"},{"letter":"E","text":"Examination of urine under Wood's lamp"}],"correct":"A","why":"'Snowstorm' visual disturbance, bilateral fixed/dilated pupils, retinal edema, and optic disc hyperemia after an unknown ingestion (with vomiting) is the classic presentation of methanol poisoning — methanol's toxic metabolite (formic acid) is specifically toxic to the retina/optic nerve, producing this distinctive visual snowstorm phenomenon and papilledema/disc hyperemia.","wrong":"B) Cyanide poisoning causes rapid cardiovascular collapse/altered mental status from cellular hypoxia, not this specific visual/ophthalmologic picture. C) Salicylate toxicity causes tinnitus, hyperventilation/respiratory alkalosis, and altered mental status, not this classic 'snowstorm' visual disturbance with optic disc findings. D) Acetaminophen toxicity causes hepatotoxicity, not visual disturbances/pupillary findings like this. E) A Wood's lamp exam of urine is used to screen for certain substances (like some poisons via fluorescence, e.g., ethylene glycol antifreeze products containing fluorescein) but isn't the specific diagnostic test that identifies methanol toxicity itself.","note":""},{"id":152,"system":"toxicology","systemName":"Toxicology","source":"2021","stem":"A 16-year-old adolescent boy is brought to the emergency department by his sister after she found him acting strange when she came home from work that evening. She reports that he has no significant past medical or psychiatric history and no history of school or social problems and that he was in his normal state of health that morning. He is currently agitated and talking to himself, although he intermittently answers questions and agrees to be examined. He is well-kempt and oriented to name and place, although not to time. When asked if anything bothers him, he reports nausea and chest pain. He has a temperature of 37.9°C, heart rate of 148 beats/min, respiratory rate of 26 breaths/min, blood pressure of 168/100 mm Hg, and oxygen saturation of 100% on room air. His pupils are mydriatic but reactive, his oropharynx is clear, and his neck is supple. Auscultation reveals tachycardia without abnormal heart sounds and clear lungs. His abdomen is soft with hyperactive bowel sounds. He is diaphoretic and slightly tremulous with a capillary refill time of 2 seconds. He has a nonfocal neurological examination.\nOf the following, the evaluation that is MOST likely to lead to a diagnosis for this patient is","options":[{"letter":"A","text":"blood culture"},{"letter":"B","text":"comprehensive psychiatric assessment"},{"letter":"C","text":"head computed tomography"},{"letter":"D","text":"urine drug screen"}],"correct":"D","why":"Sudden-onset agitation, hallucinations/talking to self, tachycardia, hypertension, hyperthermia, mydriasis, diaphoresis, and hyperactive bowel sounds in a previously healthy teen with no psychiatric history is a classic sympathomimetic toxidrome (from stimulant drug use, e.g., cocaine, amphetamines, synthetic cathinones) — a urine drug screen is the most direct test to identify the causative substance and guide management.","wrong":"A) Blood culture would evaluate for infection/sepsis, which doesn't fit this acute-onset toxidrome picture as well as a toxic ingestion does. B) A comprehensive psychiatric assessment is premature before ruling out an acute organic/toxic cause, especially given the sudden onset in a teen with NO psychiatric history and a clear autonomic toxidrome. C) Head CT would be reasonable if there were focal neurologic findings or trauma concern, but the presentation here (nonfocal neuro exam, clear autonomic/sympathomimetic signs) more directly points toward toxicologic screening as the most useful next test.","note":""},{"id":153,"system":"psychiatry_behavioral_health","systemName":"Psychiatry & Behavioral Health","source":"SET-1","stem":"A 12-year-old girl is brought to your office due to issues with attention and organization. She often loses her belongings, forgets to complete her homework, and struggles to follow multi-step instructions. Despite these challenges, she does not display hyperactive or impulsive behaviors.\nWhich medication could potentially be beneficial for her likely condition?","options":[{"letter":"A","text":"Amphetamine/Dextroamphetamine"},{"letter":"B","text":"Guanfacine"},{"letter":"C","text":"Sertraline"},{"letter":"D","text":"Risperidone"}],"correct":"A","why":"This describes ADHD, predominantly inattentive presentation. Stimulant medications (amphetamine/methylphenidate class) remain first-line pharmacotherapy for ADHD regardless of subtype (inattentive vs. combined), as they are the most effective medication class for core ADHD symptoms.","wrong":"B) Guanfacine (an alpha-2 agonist) is typically second-line or used adjunctively/for patients who can't tolerate stimulants, not first-line. C) Sertraline (SSRI) treats depression/anxiety, not ADHD's core inattentive symptoms. D) Risperidone (antipsychotic) is used for aggression/irritability in other conditions (e.g., autism-associated irritability), not as ADHD first-line therapy.","note":""},{"id":154,"system":"psychiatry_behavioral_health","systemName":"Psychiatry & Behavioral Health","source":"SET-1","stem":"Anorexia and bulimia are frequently comorbid with major depression. Thus, eating disorders have tended to be treated pharmacologically with which of the following?","options":[{"letter":"A","text":"Antipsychotics"},{"letter":"B","text":"Antibiotics"},{"letter":"C","text":"Antihistamine"},{"letter":"D","text":"Antidepressants"}],"correct":"D","why":"Given the high comorbidity between eating disorders and depression, antidepressants (particularly SSRIs, e.g., fluoxetine has specific evidence in bulimia) have been the most commonly used pharmacologic adjunct alongside psychotherapy (which remains the mainstay of eating disorder treatment).","wrong":"A) Antipsychotics aren't the standard pharmacologic approach for eating disorders/depression comorbidity. B) Antibiotics have no role. C) Antihistamines have no role in eating disorder or depression treatment.","note":""},{"id":155,"system":"psychiatry_behavioral_health","systemName":"Psychiatry & Behavioral Health","source":"SET-1","stem":"Which of the following is a behavioral symptom exhibited by individuals suffering from unipolar depression?","options":[{"letter":"A","text":"Unpredictable and erratic behavior"},{"letter":"B","text":"Compulsive checking"},{"letter":"C","text":"Stay in bed for long periods"},{"letter":"D","text":"Ritualised behaviour"}],"correct":"C","why":"Psychomotor retardation/withdrawal — including prolonged time in bed, low energy, and social withdrawal — is a classic behavioral manifestation of depression.","wrong":"A) Unpredictable/erratic behavior is more suggestive of mania/bipolar disorder, not unipolar depression. B) Compulsive checking is a hallmark of OCD, not depression. D) Ritualized behavior is also more typical of OCD/autism spectrum, not depression.","note":""},{"id":156,"system":"psychiatry_behavioral_health","systemName":"Psychiatry & Behavioral Health","source":"SET-1","stem":"A disturbance of consciousness caused by a medical condition that develops over a very short period and is characterized by a change in cognition (such as a memory deficit or disorientation) and a reduction in the ability to focus, shift, or sustain attention, is known as","options":[{"letter":"A","text":"Alzheimer's disease."},{"letter":"B","text":"Korsakoff's syndrome."},{"letter":"C","text":"Delirium."},{"letter":"D","text":"HIV-associated dementia"}],"correct":"C","why":"The defining features of delirium are ACUTE onset, fluctuating course, and impaired attention/consciousness with an underlying medical cause — matching this description precisely.","wrong":"A) Alzheimer's disease is a chronic, gradually progressive dementia, not an acute change. B) Korsakoff syndrome is a chronic amnestic disorder (from thiamine deficiency), not an acute confusional state. D) HIV-associated dementia is also a chronic progressive process, not acute-onset.","note":""},{"id":157,"system":"psychiatry_behavioral_health","systemName":"Psychiatry & Behavioral Health","source":"SET-1","stem":"An 8-year-old boy is considered for stimulant medication to treat attention deficit hyperactivity disorder.\nWhich of the following symptom complexes is a potential side effect?","options":[{"letter":"A","text":"Anorexia, insomnia, moodiness"},{"letter":"B","text":"Oculogyric crisis, dry mouth, blurred vision"},{"letter":"C","text":"Vomiting, hypotension, ataxia"},{"letter":"D","text":"Lethargy, headache, respiratory depression"}],"correct":"A","why":"These are the classic, well-recognized side effects of stimulant medications (appetite suppression, sleep difficulty, and irritability/mood lability), often requiring dose timing adjustments or drug holidays to manage.","wrong":"B) Oculogyric crisis/dry mouth/blurred vision describes an anticholinergic or dystonic reaction (e.g., from antipsychotics), not classic stimulant side effects. C) Vomiting/hypotension/ataxia isn't the classic stimulant side-effect profile. D) Lethargy/headache/respiratory depression is not characteristic of stimulants (which are typically activating, not sedating).","note":""},{"id":158,"system":"psychiatry_behavioral_health","systemName":"Psychiatry & Behavioral Health","source":"2021","stem":"A 16-year-old boy appears in a clinic with hyperactivity, short attention span, disturbances in sleep, and bad temperament for the last 2 weeks. He was hit by a car 3 weeks ago. He went to the ER and was released after evaluation. He used to be a good student prior to this episode. Most likely diagnosis:","options":[{"letter":"A","text":"Marijuana use"},{"letter":"B","text":"PCP use"},{"letter":"C","text":"Brain tumor"},{"letter":"D","text":"Post-traumatic syndrome"},{"letter":"E","text":"Problem with his girlfriend"}],"correct":"D","why":"New-onset hyperactivity, short attention span, sleep disturbance, and behavioral/temperament changes with academic decline, emerging in the weeks following a traumatic event (being hit by a car), is classic for post-traumatic stress in a pediatric patient — trauma-related symptoms in children often manifest as behavioral dysregulation, hyperarousal, and attention/concentration difficulties rather than the more 'classic' adult PTSD symptom descriptions.","wrong":"A/B) Marijuana or PCP use isn't suggested by any history in the vignette. C) A brain tumor is a less likely explanation than a clear temporal link to a recent trauma, and would typically show other progressive/focal neurologic signs. E) 'Problem with his girlfriend' is a distractor with no supporting information in the vignette and doesn't explain the clear temporal relationship to the traumatic accident.","note":""},{"id":159,"system":"psychiatry_behavioral_health","systemName":"Psychiatry & Behavioral Health","source":"2021","stem":"A 13-year-old boy comes to the office for follow-up of attention-deficit/hyperactivity disorder (ADHD). He was diagnosed with ADHD at 7 years of age and has done well with behavioral therapy, school supports, and stimulant medication. His mother reports that her son's grades have been falling recently. He is no longer playing sports so that he can have more time to dedicate to his schoolwork. She is concerned about his motivation; she often finds him in his bedroom texting his friends or sleeping instead of doing his homework. When interviewed alone, the boy states that everything is 'fine' and school is 'boring.' His responses to the Patient Health Questionnaire 9 (PHQ-9) indicate a moderate level of depression. When discussing a management plan with his mother, warning signs for suicidal ideation and options for emergent evaluation are reviewed.\nOf the following, the behavior that would be of MOST concern is","options":[{"letter":"A","text":"conflict at school and home"},{"letter":"B","text":"giving away belongings"},{"letter":"C","text":"trouble falling asleep"},{"letter":"D","text":"use of marijuana"}],"correct":"B","why":"Giving away prized/personal belongings is one of the most concerning and specific WARNING SIGNS for active suicidal ideation/planning in an adolescent, distinct from more general depressive symptoms — it can represent a concrete behavioral sign that a teen is preparing for death, warranting urgent evaluation.","wrong":"A) Conflict at school/home is a common, less specific stressor associated with depression generally, not a specific suicide warning sign in the same way. C) Trouble falling asleep is a common, nonspecific symptom of depression itself (part of the diagnostic criteria) rather than a specific behavioral RED FLAG for imminent self-harm risk. D) Marijuana use is a concerning risk factor/coping mechanism to note, but is less specifically alarming as an acute suicide warning sign compared to the concrete, deliberate act of giving away belongings.","note":""},{"id":160,"system":"psychiatry_behavioral_health","systemName":"Psychiatry & Behavioral Health","source":"2021","stem":"An 8-year-old girl is brought to the office to discuss recent behavioral changes. Her mother reports that her daughter has been having frequent dreams about getting lost in a forest and wakes up crying. Every morning before school, she will persistently ask if she can go to work with her mother instead of going to school. During the day, the school nurse has called to report that the girl refuses to do her assigned work and instead will suddenly cry for no apparent reason. At home, she behaves well with no emotional outbursts, enjoys outings with her mother, and completes her homework without problems. Her mother reports that the behavioral problems started after her husband was deported.\nOf the following, the MOST likely diagnosis for this girl is","options":[{"letter":"A","text":"general anxiety disorder"},{"letter":"B","text":"separation anxiety disorder"},{"letter":"C","text":"social anxiety disorder"},{"letter":"D","text":"specific phobia"}],"correct":"B","why":"Distress specifically related to SEPARATION from a primary attachment figure (wanting to go to work with mother instead of school, nightmares about being lost/separated, symptoms occurring specifically at school/separation times but NOT at home with mother present) following an identifiable stressor (father's deportation, likely disrupting family security/attachment), is classic for separation anxiety disorder.","wrong":"A) Generalized anxiety disorder involves excessive worry across MULTIPLE domains/contexts, not specifically tied to separation from an attachment figure. C) Social anxiety disorder involves fear of social/performance situations and being scrutinized by others, not specifically about separation from a parent. D) Specific phobia involves fear of a discrete object/situation (e.g., dogs, heights), not this broader separation-specific pattern tied to an attachment figure.","note":""},{"id":161,"system":"orthopedics_trauma_ophthalmology","systemName":"Orthopedics, Trauma & Ophthalmology","source":"SET-1","stem":"A 14-year-old boy presents with gradually progressive muscle weakness, particularly in his lower limbs. He also demonstrates calf muscle hypertrophy. His mother has similar symptoms.\nWhat treatment could be considered for managing his muscle symptoms?","options":[{"letter":"A","text":"Botulinum toxin injections"},{"letter":"B","text":"Mexiletine"},{"letter":"C","text":"Deflazacort"},{"letter":"D","text":"High-dose vitamin D supplementation"}],"correct":"C","why":"This is Duchenne/Becker muscular dystrophy (calf pseudohypertrophy, progressive proximal weakness; X-linked, so an affected/carrier mother having 'similar symptoms' fits a milder manifesting-carrier picture or points toward the dystrophinopathy family). Deflazacort (a corticosteroid) is a mainstay disease-modifying treatment shown to slow the decline in muscle strength/function in DMD.","wrong":"A) Botulinum toxin is used for FOCAL spasticity, not the diffuse progressive weakness of muscular dystrophy. B) Mexiletine is used for myotonia (e.g., in myotonic dystrophy) to reduce muscle stiffness, not for DMD's weakness itself. D) High-dose vitamin D doesn't address the underlying dystrophinopathy.","note":""},{"id":162,"system":"orthopedics_trauma_ophthalmology","systemName":"Orthopedics, Trauma & Ophthalmology","source":"SET-1","stem":"15 months old is brought to the pediatric clinic for evaluation of bow legs, mother mentioned that his legs is always bow but getting worse with starting walking. Child had normal development and no pain while walking or running. He drink a round 500 ml of milk per day and eat normal balanced diet with height on the 50th centile and weight on the 50th centile. Examination show normal range of movement with no joint involvement with tibiofemoral outward resulting in gap between the knee with normal other systemic examination, which of the following is the best next in the management of this patient?","options":[{"letter":"A","text":"bileral leg x ray"},{"letter":"B","text":"physiotherpay"},{"letter":"C","text":"resureance and observation"},{"letter":"D","text":"surgeical correction"},{"letter":"E","text":"vit d supplementation"}],"correct":"C","why":"Physiologic genu varum (bow legs) is extremely common and normal in toddlers up to about age 2, especially as they begin walking — with normal growth, no pain, and an isolated symmetric finding, reassurance and observation (it typically self-corrects by age 2-3) is appropriate.","wrong":"A) Bilateral leg X-ray isn't needed for a classic benign physiologic pattern without red flags. B) Physiotherapy has no role in physiologic bowing. D) Surgical correction is reserved for pathologic bowing (e.g., Blount disease) that persists/worsens beyond the expected age or has red flags, not this presentation. E) Vitamin D supplementation would be relevant if rickets were suspected, but nothing here (normal growth, no other rachitic signs) points to that.","note":""},{"id":163,"system":"orthopedics_trauma_ophthalmology","systemName":"Orthopedics, Trauma & Ophthalmology","source":"SET-1","stem":"Waddling gait in pediatric is due to?","options":[{"letter":"A","text":"Gluteal muscle weakness"},{"letter":"B","text":"Paravertabal muscle weakness"},{"letter":"C","text":"Obturator nerve palsy"},{"letter":"D","text":"Adductor muscle weakness"}],"correct":"A","why":"A waddling gait results from weakness of the hip abductors (gluteus medius/minimus), causing a compensatory Trendelenburg-type lurch toward the weak side with each step — classically seen in muscular dystrophies, developmental hip dysplasia, or proximal myopathies.","wrong":"B) Paravertebral muscle weakness would affect trunk posture/back extension, not classically produce a waddling gait. C) Obturator nerve palsy affects hip adduction, producing a different gait pattern (circumduction), not classic waddling. D) Isolated adductor weakness doesn't produce the classic waddle, which is specifically an abductor (gluteal) weakness phenomenon.","note":""},{"id":164,"system":"orthopedics_trauma_ophthalmology","systemName":"Orthopedics, Trauma & Ophthalmology","source":"SET-1","stem":"Ali is 13 years old professional tennis player presented with mild to moderate elbow pain. What is the best initial treatment?","options":[{"letter":"A","text":"MRI elbow joint"},{"letter":"B","text":"X ray elbow joint"},{"letter":"C","text":"Rest and anti-inflammatory"},{"letter":"D","text":"Splint"}],"correct":"C","why":"For mild-moderate overuse elbow pain in an athlete (e.g., 'tennis elbow'/medial or lateral epicondylitis, or early little league elbow), conservative first-line management is rest from the aggravating activity plus NSAIDs, reserving imaging for cases that fail conservative measures or have red flags.","wrong":"A) MRI is reserved for cases that fail conservative management or have concerning features (not first-line for mild-moderate pain). B) Plain X-ray may be reasonable to exclude growth-plate injury in some cases, but conservative treatment is still the correct FIRST management step for mild-moderate pain rather than imaging alone. D) A splint isn't the standard first-line approach for this presentation compared to rest/NSAIDs.","note":""},{"id":165,"system":"orthopedics_trauma_ophthalmology","systemName":"Orthopedics, Trauma & Ophthalmology","source":"SET-1","stem":"Mohamed is 11 years old basketball player fall down while playing and twist his right ankle, he was diagnose with ankle sprain, which of the following ligaments is most commonly damage in ankle sprain?","options":[{"letter":"A","text":"Anterior talofibular ligament"},{"letter":"B","text":"Deltoid ligament"},{"letter":"C","text":"Fibulocalcaneal ligament"}],"correct":"A","why":"The ATFL is the weakest and most frequently injured ligament in a typical inversion ankle sprain, making it the classic answer for 'most commonly damaged' ligament in ankle sprains.","wrong":"B) The deltoid ligament (medial side) is injured in eversion (less common) sprains, and is actually stronger/less commonly torn. C) The calcaneofibular ligament can be injured with more severe inversion sprains but is less commonly the FIRST/most frequently injured ligament compared to the ATFL.","note":""},{"id":166,"system":"orthopedics_trauma_ophthalmology","systemName":"Orthopedics, Trauma & Ophthalmology","source":"2021","stem":"A full-term baby was born by forceps delivery with Apgar scores 5 and 7 at 1 and 5 minutes respectively. Physical examination reveals absence of left retinal reflex. Most likely diagnosis:","options":[{"letter":"A","text":"Retinal hemorrhage"},{"letter":"B","text":"Retinal detachment"},{"letter":"C","text":"Cataract"},{"letter":"D","text":"Bleeding inside anterior chamber of left eye"},{"letter":"E","text":"Corneal trauma"}],"correct":"C","why":"Per this exam's answer key, absence of the red reflex in a newborn following traumatic (forceps) delivery is attributed to cataract formation from birth trauma.","wrong":"A/B/D/E) The other options (retinal hemorrhage, retinal detachment, anterior chamber hemorrhage, corneal trauma) are all recognized birth-trauma-related ocular findings, but per this question's marked answer, cataract is designated as the most likely explanation for an absent red reflex in this scenario.","note":"Worth double-checking this one: in most standard pediatric texts, RETINAL HEMORRHAGE is actually the most common ocular finding after forceps/vacuum-assisted or traumatic vaginal delivery (occurring in a substantial proportion of normal deliveries, even higher with instrumentation), and typically resolves without treatment. An absent red reflex more specifically suggests something opacifying the visual axis (dense vitreous or anterior chamber hemorrhage, or a cataract) rather than a peripheral retinal hemorrhage, which usually would NOT obliterate the red reflex unless extensive. If this question recurs, consider that the answer key's emphasis on 'absent red reflex' specifically (rather than just 'retinal finding after forceps delivery') is likely the reasoning that led to cataract/media opacity over retinal hemorrhage as the selected answer."},{"id":167,"system":"orthopedics_trauma_ophthalmology","systemName":"Orthopedics, Trauma & Ophthalmology","source":"2021","stem":"An 8-year-old boy appears with a history of fall onto an outstretched hand. Physical examination reveals a painful, red, swollen right wrist. X-ray of the right hand reveals fracture of the radius and ulna, just proximal to the wrist, distal segment displaced in dorsal and radial direction. The nerve injury associated with this condition:","options":[{"letter":"A","text":"Radial nerve"},{"letter":"B","text":"Median nerve"},{"letter":"C","text":"Ulnar nerve"},{"letter":"D","text":"Brachial plexus"},{"letter":"E","text":"Superficial cutaneous branch supplying over the wrist"}],"correct":"B","why":"A distal radius/ulna fracture with DORSAL displacement of the distal fragment (a classic pediatric 'Colles-type' or extension-type distal forearm fracture pattern from a fall on an outstretched hand) is classically associated with median nerve injury/compression (or acute carpal tunnel-type compression from the displaced fragment/swelling), making median nerve assessment (sensation to the thumb, index, middle fingers; thumb opposition) essential in the exam of this injury.","wrong":"A) Radial nerve injury is more classically associated with mid-shaft HUMERUS fractures (radial nerve wraps around the spiral groove), not distal forearm fractures. C) Ulnar nerve injury is more associated with medial epicondyle fractures/elbow injuries, not this distal radius/ulna pattern. D) Brachial plexus injury is associated with more proximal shoulder/neck trauma (or birth trauma), not an isolated distal forearm fracture. E) A superficial cutaneous sensory branch injury would cause a much more limited/less clinically significant deficit than the classic median nerve association with this fracture pattern.","note":""},{"id":168,"system":"emergency_critical_care_miscellaneous","systemName":"Emergency & Critical Care / Miscellaneous","source":"SET-1","stem":"A 22-month-old boy is hospitalized in a burn unit after a scald injury. The injury was sustained two days ago after he pulled a pot of boiling water from the stovetop to the floor. He has a temperature of 39°C, heart rate of 150 beats/min, respiratory rate of 38 breaths/min, blood pressure of 98/66 mm Hg, and oxygen saturation of 100%. In a splash pattern, he has denuded skin over portions of his right arm, abdomen, and lower legs. There are newly violaceous edges on the abdominal wound.\nWhich of the following is the BEST indication for starting parenteral antibiotics in this patient?","options":[{"letter":"A","text":"Discoloration at abdominal wound edges"},{"letter":"B","text":"Heart rate greater than 120 beats/min"},{"letter":"C","text":"Temperature greater than 39°C"}],"correct":"A","why":"New violaceous/dusky discoloration at a burn wound margin is a hallmark sign of invasive burn wound infection (impending or established burn wound sepsis, often Pseudomonas), a true indication for prompt systemic antibiotics — vital signs like tachycardia/fever alone are common in burns from the inflammatory response itself and are less specific.","wrong":"B) Heart rate >120 alone is a very common, nonspecific physiologic response to burn injury/pain/stress, not itself diagnostic of infection. C) Temperature >39°C alone can also reflect the systemic inflammatory response to a large burn without true infection.","note":""},{"id":169,"system":"emergency_critical_care_miscellaneous","systemName":"Emergency & Critical Care / Miscellaneous","source":"SET-1","stem":"An 8-month-old girl presents with a fever and runny nose for two days. Since morning, she has had difficulty breathing and is reluctant to feed. Upon examination, the temp was 39 °C, heart rate was 160/min, respiratory rate was 60/min, and capillary refill time was 2 seconds. The chest has fine crepitation, and the liver is palpable at 4 centimeters.\nWhat is the most appropriate treatment?","options":[{"letter":"A","text":"Amoxicillin"},{"letter":"B","text":"Dopamine"},{"letter":"C","text":"Furosemide"},{"letter":"D","text":"Epinephrine"}],"correct":"C","why":"Hepatomegaly + crackles + tachypnea/tachycardia in an infant (in the setting of a viral illness, likely triggering myocarditis or decompensated congenital heart disease) suggests congestive heart failure — furosemide (diuresis) is appropriate to relieve pulmonary/venous congestion.","wrong":"A) Amoxicillin would treat bacterial infection, not the heart-failure physiology suggested by hepatomegaly/crackles. B) Dopamine is an inotrope/vasopressor used for shock with hypotension, not indicated here where the picture is fluid overload/CHF rather than hypotensive shock. D) Epinephrine is reserved for cardiac arrest/severe anaphylaxis/refractory shock, not this presentation.","note":""},{"id":170,"system":"emergency_critical_care_miscellaneous","systemName":"Emergency & Critical Care / Miscellaneous","source":"SET-1","stem":"In the paediatric emergency you are evaluating a 2 weeks old baby product of normal delivery with no NICU admission who presented with severe dehydration, losing weight and continuous diarrhoea not improving with changing different type of milk as per mother, the working diagnose is congenital chloride diarrhoea.\nOf the following, the MOST common laboratory finding is of this diseases is :","options":[{"letter":"A","text":"Metabolic alkalosis"},{"letter":"B","text":"Hyperchloremia"},{"letter":"C","text":"Hyperkalemia"},{"letter":"D","text":"Hypernatremia"}],"correct":"A","why":"Congenital chloride diarrhea causes a defect in intestinal Cl-/HCO3- exchange, leading to chloride loss in stool and a hypochloremic, hypokalemic METABOLIC ALKALOSIS (mimicking pyloric stenosis biochemically) — a classic, testable lab pattern.","wrong":"B) Hyperchloremia is the OPPOSITE of what happens — chloride is lost in the stool, causing hypochloremia. C) Hyperkalemia is incorrect — hypokalemia (from stool losses and secondary hyperaldosteronism) is typical. D) Hypernatremia isn't the classic described finding; the hallmark is the alkalosis/electrolyte pattern from chloride loss.","note":""},{"id":171,"system":"emergency_critical_care_miscellaneous","systemName":"Emergency & Critical Care / Miscellaneous","source":"SET-1","stem":"Ketamine is a dissociative anesthetic occasionally used in pediatric patients. What is a property that makes it particularly useful?","options":[{"letter":"A","text":"It has a bronchodilator effect"},{"letter":"B","text":"It lowers intracranial pressure"},{"letter":"C","text":"It decreases respiratory secretions"},{"letter":"D","text":"It lowers blood pressure"}],"correct":"A","why":"Ketamine is notable for preserving airway reflexes and respiratory drive while also causing BRONCHODILATION (via catecholamine release/direct smooth muscle relaxation), making it a preferred sedative/induction agent in patients with reactive airway disease (e.g., status asthmaticus) or those needing procedural sedation with hemodynamic stability.","wrong":"B) Ketamine actually INCREASES intracranial pressure (historically a relative contraindication in head injury, though this has been increasingly questioned in recent literature) — it does not lower ICP. C) Ketamine INCREASES respiratory secretions (a recognized side effect, often necessitating co-administration of an antisialagogue like glycopyrrolate), not decreases them. D) Ketamine typically INCREASES (or maintains) blood pressure/heart rate via sympathomimetic effects, rather than lowering blood pressure — a key reason it's favored in hemodynamically unstable patients.","note":""},{"id":172,"system":"ethics_child_protection_research_biostatistics","systemName":"Ethics, Child Protection, Research & Biostatistics","source":"SET-1","stem":"Which of the following statements about using placebos in pediatric research is true?","options":[{"letter":"A","text":"It is always ethical to use a placebo in a pediatric research study"},{"letter":"B","text":"The use of a placebo can be unethical if it denies the child access to an effective treatment"},{"letter":"C","text":"The use of a placebo is only ethical. Topical calcineurin inhibitors if the child and parent or guardian give their written consent"},{"letter":"D","text":"Placebos are never used in pediatric research"}],"correct":"B","why":"The core ethical principle: placebo use is only acceptable when no proven effective treatment is being withheld (i.e., in conditions with no established therapy, or when added to standard-of-care as an adjunct) — using placebo INSTEAD of a known effective treatment is unethical.","wrong":"A) Placebo use is not 'always' ethical — it depends on context (whether an effective treatment is being withheld). C) This statement is oddly specific/false as written — placebo ethics isn't restricted only to topical calcineurin inhibitor trials. D) Placebos ARE used in pediatric research under appropriate ethical conditions, so 'never' is false.","note":""},{"id":173,"system":"ethics_child_protection_research_biostatistics","systemName":"Ethics, Child Protection, Research & Biostatistics","source":"SET-1","stem":"Which of the following is an example of a randomized controlled trial in pediatric research?","options":[{"letter":"A","text":"A study comparing the prevalence of autism spectrum disorders in boys versus girls"},{"letter":"B","text":"A study exploring the effects of vitamin D supplements on bone health in preterm infants"},{"letter":"C","text":"A study examining the association between screen time and attention deficit hyperactivity disorder (ADHD) in school-aged children"},{"letter":"D","text":"A study investigating the effectiveness of a new asthma medication in adolescents"}],"correct":"D","why":"An RCT requires an INTERVENTION with random allocation to groups — testing a new asthma MEDICATION'S effectiveness implies an interventional trial design, distinguishing it from the other purely observational study designs listed.","wrong":"A) Comparing autism prevalence between boys and girls is a cross-sectional/observational (descriptive) study, no intervention/randomization. B) Exploring vitamin D effects on bone health 'could' be an RCT, but as phrased ('exploring effects') is ambiguous/more observational in tone compared to the more clearly interventional 'effectiveness of a new medication' framing in option D. C) An association study between screen time and ADHD is a classic observational (cohort/case-control) design, not an RCT.","note":""},{"id":174,"system":"ethics_child_protection_research_biostatistics","systemName":"Ethics, Child Protection, Research & Biostatistics","source":"SET-1","stem":"What is the \"assent\" process in pediatric research?","options":[{"letter":"A","text":"It is the process of obtaining informed consent from the parents or guardians of the child"},{"letter":"B","text":"It is the process of obtaining written consent from the child"},{"letter":"C","text":"It is the process of obtaining verbal agreement from the child to participate in the study"},{"letter":"D","text":"It is the process of ensuring that the child understands the research and is willing to participate to the best of their ability"}],"correct":"D","why":"Assent (distinct from parental/guardian CONSENT) refers to a child's own agreement to participate, appropriate to their developmental level of understanding — it respects the child's autonomy even though they cannot legally provide full informed consent.","wrong":"A) This describes parental/guardian CONSENT, not the child's assent. B) Assent doesn't require WRITTEN consent from the child — it's typically a simpler, age-appropriate agreement process. C) 'Verbal agreement' alone is an incomplete description — assent specifically requires the child to understand (to the extent developmentally possible) what participation involves, not just verbally agree.","note":""},{"id":175,"system":"ethics_child_protection_research_biostatistics","systemName":"Ethics, Child Protection, Research & Biostatistics","source":"SET-1","stem":"You are asked to attend the monthly Mortality and Morbidity meeting for March. The data presented to you as follows:\nNo. of live births = 500\nNo. of stillbirths after 28 weeks = 2\nNo. of stillbirths before 28 weeks = 0\nNeonatal deaths before seven days = 1\nNeonatal deaths at 7-28 days = 4\nTerm infants = 350\nWhat is the perinatal mortality rate per 1,000 live births would?","options":[{"letter":"A","text":"4"},{"letter":"B","text":"5"},{"letter":"C","text":"6"},{"letter":"D","text":"7"}],"correct":"B","why":"Perinatal mortality rate = (stillbirths [≥28 weeks] + early neonatal deaths [<7 days]) / total births (live births + stillbirths ≥28 weeks) × 1,000. Here: (2 stillbirths + 1 early neonatal death) = 3 perinatal deaths; total births = 500 live + 2 stillbirths = 502. Rate = 3/502 × 1000 ≈ 5.98, which rounds to approximately 6 — but per standard convention using live births as denominator (500) as suggested by the question's phrasing 'per 1,000 live births': 3/500 × 1000 = 6. Using the strict perinatal formula with 502 in the denominator gives ~5.98 (≈6). The neonatal deaths at 7-28 days (late neonatal deaths) and stillbirths before 28 weeks are NOT included in the perinatal mortality calculation.","wrong":"The key errors to avoid: including the 4 late neonatal deaths (7-28 days) in the numerator (perinatal deaths only count stillbirths ≥28 weeks + EARLY neonatal deaths <7 days), or using the wrong denominator (total births, not just live births, is technically correct for the formal 'perinatal mortality rate,' though many board questions simplify to live births as stated in the question stem).","note":""},{"id":176,"system":"ethics_child_protection_research_biostatistics","systemName":"Ethics, Child Protection, Research & Biostatistics","source":"2021","stem":"Most common clinical manifestation of child abuse:","options":[{"letter":"A","text":"Hot water burn"},{"letter":"B","text":"Subdural hematoma"},{"letter":"C","text":"Rupture liver"},{"letter":"D","text":"Spiral fracture"},{"letter":"E","text":"Bruises"}],"correct":"E","why":"Bruises are, by far, the most COMMON overall physical finding in child abuse (skin findings are the most frequently seen manifestation), even though other findings (subdural hematoma, spiral fractures, visceral injury) are more specific/severe indicators when present. This tests the distinction between 'most common' (bruising) versus 'more specific for abuse' (e.g., certain fracture patterns, patterned burns).","wrong":"A) Immersion/hot water burns are a highly SPECIFIC (classic patterned) finding for abuse but far less COMMON overall than bruising. B) Subdural hematoma is a severe, specific, but much less common finding overall than simple bruising. C) Ruptured liver/visceral injury is rare and represents severe abuse, not the most common finding. D) Spiral fractures (especially in a non-ambulatory infant) are HIGHLY SPECIFIC for abuse but, again, not the most COMMON overall physical finding — bruises vastly outnumber fractures as the presenting sign.","note":""},{"id":177,"system":"ethics_child_protection_research_biostatistics","systemName":"Ethics, Child Protection, Research & Biostatistics","source":"2021","stem":"A child was brought to the ER after a car accident. There was nobody to give a proper history. The child was cyanotic and unresponsive. He was intubated immediately. The child's oxygen saturation improved to 100% but no spontaneous respiration was noted. Physical examination revealed hypotension, multiple bruises, abdominal distension, and obvious femoral fracture. The surgeon suspected splenic rupture, which was confirmed by a CT scan. The family could not be contacted. The next appropriate step in management would be to:","options":[{"letter":"A","text":"Wait for the parents to arrive and give consent prior to surgery."},{"letter":"B","text":"The surgeon is getting ready to do the surgery but decided to wait at least 2 hours for his parents to arrive."},{"letter":"C","text":"Get consent from the social worker involved in the case."},{"letter":"D","text":"Get consent from a neighbor who was contacted by the social worker."},{"letter":"E","text":"Surgeon should do the procedure without waiting to obtain a consent for the benefit of the patient."}],"correct":"E","why":"In a true life-threatening emergency where parents/guardians cannot be reached despite reasonable efforts, the legal and ethical doctrine of IMPLIED CONSENT (or 'emergency exception' to informed consent) applies — a physician may proceed with necessary emergency treatment without delay, since a reasonable parent would be presumed to consent to life-saving treatment for their child, and any delay could cause harm or death.","wrong":"A/B) Waiting for parents to arrive (even briefly, 2 hours) in a scenario with likely life-threatening internal bleeding (splenic rupture with hypotension) is dangerous and inappropriate — every minute of delay increases mortality risk. C/D) Consent from a social worker or a neighbor contacted by a social worker is NOT a legally valid substitute for parental consent in this scenario and introduces unnecessary delay and legal ambiguity — the correct doctrine is proceeding under implied/emergency consent, not seeking a substitute consenter who has no legal authority.","note":""},{"id":178,"system":"ethics_child_protection_research_biostatistics","systemName":"Ethics, Child Protection, Research & Biostatistics","source":"2021","stem":"An 18-year-old male with Down syndrome lives independently. He went to a doctor for facial cosmetic surgery. The appropriate statement regarding management:","options":[{"letter":"A","text":"He should bring his parents to give consent for surgery."},{"letter":"B","text":"A Down syndrome patient does not need a cosmetic facial surgery."},{"letter":"C","text":"Surgeon should refuse to do surgery because the Down syndrome patient is mentally retarded."},{"letter":"D","text":"The congenital cyanotic heart disease should be ruled out prior to surgery."},{"letter":"E","text":"Surgeon should set up a date for cosmetic surgery."}],"correct":"E","why":"An adult (18 years old) with Down syndrome who lives independently is PRESUMED to have decision-making capacity unless formally adjudicated otherwise (e.g., through legal guardianship/conservatorship proceedings) — having Down syndrome alone does NOT automatically strip someone of legal autonomy/capacity to consent to their own elective procedures. Respecting patient autonomy, the surgeon should proceed with the patient's own informed consent as with any other adult patient.","wrong":"A) Requiring parental consent assumes he lacks capacity, which isn't established simply by having Down syndrome, especially given he lives independently. B) Whether he 'needs' cosmetic surgery is not the surgeon's/others' judgment to make for an autonomous adult patient seeking an elective procedure — this paternalistically overrides patient autonomy. C) Refusing to treat based on an assumption of 'mental retardation' without any formal capacity assessment is discriminatory and inappropriate. D) While it's reasonable clinical practice to screen for known Down-syndrome-associated comorbidities (like congenital heart disease) as part of routine preoperative work-up for ANY surgery, this isn't a prerequisite specifically for consent/proceeding with SCHEDULING and isn't the core ethical point being tested here (patient autonomy).","note":""},{"id":179,"system":"ethics_child_protection_research_biostatistics","systemName":"Ethics, Child Protection, Research & Biostatistics","source":"2021","stem":"Blood cultures were performed on 66 newborns to rule out sepsis. 10 newborns had positive blood culture results and they were diagnosed with sepsis (A). 20 newborns had negative blood culture results but they were diagnosed with sepsis (C). 6 newborns had positive blood culture results but they were not diagnosed with sepsis (B). 30 newborns had negative blood culture results and they were not diagnosed with sepsis (D). Negative predictive value:","options":[{"letter":"A","text":"33%"},{"letter":"B","text":"60%"},{"letter":"C","text":"83%"},{"letter":"D","text":"50%"},{"letter":"E","text":"70%"}],"correct":"B","why":"Negative predictive value (NPV) = true negatives / (true negatives + false negatives) = D / (D + C). Using the numbers given: true negatives (D, negative culture AND not diagnosed with sepsis) = 30; false negatives (C, negative culture BUT diagnosed with sepsis clinically) = 20. NPV = 30 / (30+20) = 30/50 = 60%.","wrong":"This tests correct construction of a 2x2 table and the NPV formula specifically — a common error is confusing NPV with specificity (which would use a different denominator: true negatives / (true negatives + false positives) = D/(D+B) = 30/36 = 83%, which is actually option C, a classic 'attractive distractor' for this exact reason) or other combinations of the four cells.","note":""},{"id":180,"system":"nutrition","systemName":"Nutrition","source":"2021","stem":"A 1-month-old full-term infant is receiving breast milk only. The infant should receive supplementation of:","options":[{"letter":"A","text":"Iron"},{"letter":"B","text":"Vitamin D"},{"letter":"C","text":"Protein"},{"letter":"D","text":"Vitamin B12"},{"letter":"E","text":"Vitamin E"}],"correct":"B","why":"Exclusively breastfed infants require vitamin D supplementation (400 IU/day starting shortly after birth) because breast milk is naturally low in vitamin D, and exclusively breastfed infants are at risk for vitamin D deficiency/rickets without supplementation — this is a standard, universally-tested AAP recommendation.","wrong":"A) Iron supplementation for exclusively breastfed infants is typically recommended starting around 4 months of age (not from 1 month), once endogenous iron stores from birth begin to deplete — not the answer for a 1-month-old specifically. C) Protein supplementation isn't needed — breast milk provides adequate protein for a healthy term infant. D) Vitamin B12 supplementation is only needed if the breastfeeding mother herself has a B12 deficiency (e.g., strict vegan diet, pernicious anemia) — not a universal recommendation for all breastfed infants. E) Vitamin E deficiency isn't a concern in healthy term breastfed infants.","note":""}]}</script>

/* ============================================================
   AUTH — simple username/password, checked directly against
   Firestore. No email, no Firebase Auth layer — same pattern
   as the EPA Tracker app. Password is hashed client-side before
   ever touching the network or the database.
   ============================================================ */
let CURRENT_USER = null; // {username, displayName}

function hashPw(pw){
  let h = 5381;
  for(let i=0;i<pw.length;i++) h = ((h<<5)+h) + pw.charCodeAt(i);
  return (h>>>0).toString(36);
}
